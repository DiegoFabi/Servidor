      - '&7• &fModificar ajustes'
      - '&7• &fGestionar miembros'
      - ''
      - '&eClic para gestionar'
  
  # Claim List Menu - The menu that opens after typing /nclaim and clicking the 'Gestionar Protecciones' button.
  claim_list_menu:
    on_sale_lore:
