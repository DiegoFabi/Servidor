      RIGHT: Right
      DOWN: Down
      UP: Up
  
  # Claim Menu - When /nclaim is typed, it is the menu with operations such as buy claim
  claim_menu:
    enter_a_name_title: Escribe un nombre
    title: Menú de Protección
    admin:
      display_name: '&6Menú de Administración'
      material: COMMAND_BLOCK
    buy_claim:
      display_name: '&6Comprar una Protección'
      material: EMERALD
      lore:
      - ''
      - '&fCompra una nueva protección'
      - '&7Coste: &e${price}'
      - ''
      - '&eClic para comprar'
    manage_claims:
      display_name: '&6Gestionar Protecciones'
      material: CHEST
      lore:
      - ''
      - '&fGestiona tus protecciones:'
