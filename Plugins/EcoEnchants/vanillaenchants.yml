# Rarity option does not affect vanilla enchantments.
# The option is there for the display option to sort by rarity.

# Targets are only used for display, such as the book-targets line in config.yml.
# They do not change which items a vanilla enchantment can be applied to.

# tradeable, discoverable and enchantable are only used for display, in /enchantinfo and the enchant GUI.
# They do not change how vanilla enchantments are obtained.

# Set hide-from-enchantgui: true on an enchantment to hide it from the enchant GUI and /enchantinfo.

protection:
  name: "Protection"
  description: "Reduce el daño recibido un &a%placeholder%%"
  placeholder: "%level% * 4"
  type: normal
  targets:
    - armor
  rarity: common
  tradeable: true
  discoverable:
    chests: true
    fishing: true
    mob-drops: true
    raids: false
  enchantable: true
  #max-level: 6 # Custom max level to override for the enchantment. Raise it, but lowering it may cause bugs.
  #conflicts: [] # Custom conflicts to override for the enchantment. Add or remove conflicts as you please.
  drag-and-drop:
    enabled: false

