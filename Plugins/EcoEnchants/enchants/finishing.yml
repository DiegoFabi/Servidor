display-name: "Remate"
description: "Aumenta el daño un &a%placeholder%%&r por cada porcentaje de vida que le falte a tu rival"
placeholder: "0.2 * %level%"
type: normal

targets:
  - sword
  - axe
conflicts: [ ]
rarity: uncommon
max-level: 5

tradeable: true
discoverable: true
enchantable: true

effects:
  - id: damage_multiplier
    args:
      multiplier: "1 + ((1 - %victim_health% / %victim_max_health%) * 0.2 * %level%)"
    triggers:
      - melee_attack

conditions: [ ]
