display-name: "Goliat"
description: "Inflige &a%damage%x &rmás de daño por cada vez que tu rival tenga más vida que tú, hasta &a%limit%x"
placeholders:
  damage: "0.5 + %level% * 0.1"
  limit: "1.6 + %level% * 0.4"
type: normal

targets:
  - sword
conflicts: [ ]
rarity: rare
max-level: 6

tradeable: true
discoverable: true
enchantable: true

effects:
  - id: damage_multiplier
    args:
      multiplier: "1 + min(max(%victim_health% / %player_health% - 1, 0) * (0.5 + %level% * 0.1), 1.6 + %level% * 0.4)"
    triggers:
      - melee_attack

conditions: [ ]
