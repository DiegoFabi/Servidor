entity:
  nameplate: <other>
  name:
    offset: 0.2
    color: '#40000000'
  activity:
    look_close:
      range: 10.0
      # Qué tan rápido el NPC gira para mirar al jugador.
      smoothing: 0.2
objective:
  entity:
    indicator:
      tracked: <gold><b>❗
      normal: <blue><b>❓
      dialogue: <white><b>💬
road_network:
  distance:
    # Distancia máxima entre dos nodos.
    # También es el radio máximo al que puede estar el jugador de un nodo para usar la red
    max: 100.0
  path_stream:
    # Tiempo en milisegundos tras el cual se cancela un rastro de partículas
    timeout: 15000
chat:
  # Cantidad de mensajes del historial de chat que se muestran durante un diálogo
  darken-limit: 12
  # Separación entre el diálogo y el historial de chat
  spacing: 3
dialogue:
  spoken:
    format: |-
      <gray><st>                                                            </st>

      <gray><padding><bold><speaker></bold><reset>

      <message>

      <next_color>                     Pulsa<white> <confirmation_key> </white>para <finish_text>
      <gray><st>                                                            </st>
    instruction:
      next: continuar
      finish: terminar
      color:
        base: <gray>
        highlight: <red>
      ticks:
        highlighted: 10
        base: 30
    padding: '    '
    minLines: 3
    maxLineLength: 40
  option:
    format: |-
      <gray><st>                                                            </st>
      <white> <speaker><reset>: <text>

      <options>
      <grey>Usa la <white>rueda</white> para cambiar de opción y pulsa<white> <confirmation_key> </white>para elegir
      <gray><st>                                                            </st>
    prefix:
      selected: <#78ff85>>>
      up: <white> ↑
      down: <white> ↓
      unselected: '  '
    selected: |2
       <prefix> <white><option_text>
    unselected: |2
       <prefix> <grey><option_text>
    maxLineLength: 40
    # Retraso en milisegundos entre cada opción mostrada.
    delay: 100
  actionbar:
    format: '<bold><speaker></bold><reset><gray>: <white><message> <gray>(<confirmation_key>)</gray><padding>'
quest:
  objective:
    inactive: <gray><display></gray>
    showing: <white><display></white>
look_at_entity_interaction_bound:
  # Milisegundos que el jugador puede mover la cabeza antes de que se le obligue a mirar al NPC.
  look_back_delay: 500
cinematic:
  dialogue:
    actionbar:
      format: '<bold><speaker></bold><reset><gray>: <white><message><padding>'
      percentage: 0.4
    subtitle:
      format: <white><message>
      speaker:
        format: <reset><bold><speaker></bold><reset>
      percentage: 0.4
action:
  message:
    format: |2

      <gray> <bold><speaker></bold><reset>
      <reset><white> <message>
content:
  road_network:
    # Distancia a la que todavía se muestran las partículas de los bordes
    show_edge_distance: 30.0
    # Recalcular automáticamente los bordes de un nodo justo después de colocarlo.
    auto_recalculate_edges_on_place: true
