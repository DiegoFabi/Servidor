settings:
  # Should Nexo automatically generate sounds.json according to your settings?
  generate_sounds: true

# https://minecraft.wiki/w/Sounds.json
# sounds:
#  - id: nexo:music.something
#    sound: nexo:music/something.ogg
#    sounds:                                  # Alternative if you have more than 1 sound-file
#      - nexo:music/something.ogg
#      - nexo:music/something2.ogg
#    stream: true                             # Optional, defaults to false
#    preload: true                            # Optional, defaults to false
#    volume: 1f                               # Optional, defaults to 1f
#    pitch: 1f                                # Optional, defaults to 1f
#    weight: 1                                # Optional, defaults to 1
#    attenuation_distance: 13                 # Optional, defaults to 16
#    jukebox_playable:                        # Optional, Used for registering a custom music-disc sound
#      comparator_output: 15                  # Optional, defaults to 15, must be in 1..15
#      range: X                               # Optional, If omitted, the sound will have a variable range.
#      length_in_seconds: 2.5
#      description: Description

sounds:
- id: nexo:music.observatory
  # Música del tutorial (Observatory). OGG Vorbis estéreo q0: 728 KB (el MP3 pesaba 1,2 MB).
  # Estéreo = no posicional: suena igual aunque el jugador se mueva.
  sound: nexo:music/observatory.ogg
  stream: true
  volume: 1.0
  pitch: 1.0
- id: nexo:music.ocarina
  # Ocarina. OGG Vorbis estéreo 32 kHz ~44 kbps: 845 KB (el MP3 pesaba 2,5 MB). 2:35 min.
  sound: nexo:music/ocarina.ogg
  stream: true
  volume: 1.0
  pitch: 1.0
# Blade Into Void (música de jefe) en 3 partes. OGG Vorbis estéreo q0 (~62 kbps).
- id: nexo:music.blade_into_void.inicio
  # Parte 1: inicio de la canción (17 s).
  sound: nexo:music/blade_into_void_inicio.ogg
  stream: true
  volume: 1.0
  pitch: 1.0
- id: nexo:music.blade_into_void.transicion
  # Parte 2: transición (20 s).
  sound: nexo:music/blade_into_void_transicion.ogg
  stream: true
  volume: 1.0
  pitch: 1.0
- id: nexo:music.blade_into_void.drop
  # Parte 3: drop (9 s).
  sound: nexo:music/blade_into_void_drop.ogg
  stream: true
  volume: 1.0
  pitch: 1.0
- id: nexo:ruleta.spin
  sound: nexo:ruleta/ruleta.ogg
  volume: 1.0
  pitch: 1.0
