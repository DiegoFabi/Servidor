field_windmill:
  itemname: Field Windmill
  material: LEATHER_HORSE_ARMOR
  color: 255,255,255
  Pack:
    model: lanshan/essentials/autumn_field/field_windmill
    custom_model_data: 241601
  Mechanics:
    furniture:
      rotatable: false
      limited_placing:
        roof: false
        floor: true
        wall: false
      block_sounds:
        place_sound: block.metal.fall
        break_sound: block.metal.break
      drop:
        silktouch: false
        loots:
        - probability: 1.0
          nexo_item: field_windmill
      properties:
        display_transform: FIXED
        scale: 0.5,0.5,0.5
      hitbox:
        barriers:
        - 0,0,0
        - 0,1,0
        - 0,2,0
