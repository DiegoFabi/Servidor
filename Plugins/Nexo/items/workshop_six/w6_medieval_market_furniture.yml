# Workshop Six - Medieval Essentials (convertido de Oraxen a Nexo)
w6_bulletin_board:
  itemname: Bulletin Board
  material: PAPER
  Pack:
    model: workshop_six/essentials/market_furniture/bulletin_board
    custom_model_data: 1084
  Mechanics:
    furniture:
      limited_placing:
        roof: false
        floor: true
        wall: false
      properties:
        display_transform: FIXED
      restricted_rotation: VERY_STRICT
      block_sounds:
        place_sound: block.wood.place
        break_sound: block.wood.break
      hitbox:
        barriers:
        - 0,0,0
        - 1,0,0
        - 0,1,0
        - 1,1,0
      drop:
        silktouch: false
        loots:
        - nexo_item: w6_bulletin_board
          probability: 1.0
