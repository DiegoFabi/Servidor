          - ''
          - '<#FFB347>Clic otra vez para publicar.'

      sell_confirm_bid:
        location: top
        source: vanilla
        material: lime_dye
        empty_slot_material: lime_dye
        name: '<#3FCF7A><bold>Publicar'
        flags: [ HIDE_ATTRIBUTES ]
        lore: [ ]
        name2: '<#3FCF7A><bold>¿Seguro?'
        material2: emerald
        lore2: [ ]

