    name: '<#3FCF7A>⚖ <dark_gray>Mis objetos <gray>· {page_no}'
    size: 6
    bottom_inventory: false
    bottom_inventory_use_default: false

    active_display_lore:
      - ''
      - '<#FF8A8A>✥ ¡Clic para <bold>RETIRAR</bold> de la venta!'

    expired_display_lore:
      - ''
      - '<#FFB347>⌛ Esta publicación caducó.'
      - '<#3FCF7A>✥ ¡Clic para <bold>RECOGER</bold>!'

    buttons:
      fill:
        location: top
        slots: [ 52,53 ]
        source: vanilla
        material: gray_stained_glass_pane
