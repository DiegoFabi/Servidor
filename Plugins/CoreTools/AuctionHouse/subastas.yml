        source: vanilla
        material: dark_oak_door
        name: '<white>« <#3FCF7A>Volver a las subastas'
        flags: [ HIDE_ATTRIBUTES ]

      sell_player_item:
        location: top
        slots: [ 11 ]
        source: vanilla
        material: air

      sell_player_input_sign:
        location: top
        slots: [ 13 ]
        source: vanilla
        material: oak_sign
        name: '<white><glyph:essential_icons_coins></white> <#3FCF7A>Poner precio'
