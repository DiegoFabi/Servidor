# Selección de clases (Lemon Class Selection GUI). 5 clases, una por marco de la textura:
#   Guardián, Erudito, Explorador, Sanador y Cazafortunas (ids internos de los menús sin cambiar).
# Elegir: quita los modificadores "clase" de AuraSkills, pone los nuevos, guarda la clase
# y el cooldown de 7 días en TypeWriter (clase_actual / clase_cooldown) y lanza la
# cinemática con /claseelegida <jugador>.
# Abrir: /coremenu menuClaseGuerrero
clases_ver_guerrero:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:block.bamboo_wood_button.click_on";volume=1;pitch=2} @Self'
  - 'command{c="core-menu menuClaseGuerrero {caster_name}";runas=console} @Self'
clases_confirmar_guerrero:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:ui.button.click";volume=1;pitch=1} @Self'
  - 'command{c="core-menu menuConfirmarGuerrero {caster_name}";runas=console} @Self'
clases_elegir_guerrero:
  Conditions:
  - 'comparator{v1="%typewriter_cK6JWeu2N6ZMZkE%";v2="1"} falseElse clases_en_espera'
  Mechanics:
  - 'closeinventory{} @Self'
  - 'command{c="skills modifier remove {caster_name} crit_chance clase true";runas=console} @Self'
  - 'command{c="skills modifier remove {caster_name} health clase true";runas=console} @Self'
  - 'command{c="skills modifier remove {caster_name} luck clase true";runas=console} @Self'
  - 'command{c="skills modifier remove {caster_name} regeneration clase true";runas=console} @Self'
  - 'command{c="skills modifier remove {caster_name} speed clase true";runas=console} @Self'
  - 'command{c="skills modifier remove {caster_name} toughness clase true";runas=console} @Self'
  - 'command{c="skills modifier remove {caster_name} wisdom clase true";runas=console} @Self'
  - 'command{c="skills modifier add {caster_name} health clase 10 true";runas=console} @Self'
  - 'command{c="skills modifier add {caster_name} toughness clase 10 true";runas=console} @Self'
  - 'command{c="typewriter facts set clase_actual 1 {caster_name}";runas=console} @Self'
  - 'command{c="typewriter facts set clase_cooldown 1 {caster_name}";runas=console} @Self'
  - 'variable{a=set;v=clase_nombre;va="<#FFCC00>Guardián"} @Self'
  - 'command{c="claseelegida {caster_name}";runas=console} @Self'
