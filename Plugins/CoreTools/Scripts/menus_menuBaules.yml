# Scripts de la réplica de AxVaults (menuBaules + PlayerVaults/Baules.yml).
# Iconos y ranuras usadas se guardan en variables de CoreTools
# (Variables/baules.yml) que actualiza Skript (scripts/servidor/baules.sk).
baul_cerrar_selector:
  Mechanics:
  - 'closeinventory{} @Self'
baul_bloqueado:
  Mechanics:
  - 'message{m="<gradient:#55ff00:#AAFF00><b>AxVaults</b></gradient> <gray>» <#FF0000>You don''t own this vault!"} @Self'

baul_boton_1:
  Conditions:
  - 'Permission{p=axvaults.vault.1} trueElse baul_boton_1_bloqueado'
  Mechanics:
  - 'itemstack{source="vanilla";material="%coretools_var_player_baul_icono_1%";amount=1;name="<#55ff00><bold>Vault #1";lore=" , <gray>- <white>Slots: <#aaffaa>%coretools_var_player_baul_usados_1%<gray>/<#55ff00>54, ,<#55ff00><bold>(!)</bold> <#55ff00>Click - Open Vault,<#55ff00><bold>(!)</bold> <#55ff00>Shift + Click - Change Item";flags="HIDE_ATTRIBUTES,HIDE_ADDITIONAL_TOOLTIP"}'
baul_boton_1_bloqueado:
  Mechanics:
  - 'itemstack{source="vanilla";material=red_stained_glass_pane;amount=1;name="<#FF0000><bold>Vault #1";lore=" , <gray>- <white>You have <#FF0000>not unlocked <white>this vault yet!, ,<#FF0000><bold>(!)</bold> <#FF0000>Locked Vault";flags="HIDE_ATTRIBUTES"}'
baul_abrir_1:
  Conditions:
  - 'Permission{p=axvaults.vault.1} trueElse baul_bloqueado'
  Mechanics:
  - 'openvault{name=baul_1} @Self'
baul_icono_1:
  Conditions:
  - 'Permission{p=axvaults.vault.1} trueElse baul_bloqueado'
  Mechanics:
  - 'command{c="baulicono 1 {caster_name}";runas=console} @Self'
baul_abierto_1:
  Mechanics:
  - 'command{c="baulmarca 1 {caster_name}";runas=console} @Self'
  - 'playsound{sound="minecraft:block.barrel.open";volume=1;pitch=1} @Self'
  - 'message{m="<gradient:#55ff00:#AAFF00><b>AxVaults</b></gradient> <gray>» <white>Vault <#55FF00>#1 <white>opened!"} @Self'
baul_cerrado_1:
  Mechanics:
  - 'playsound{sound="minecraft:block.barrel.close";volume=1;pitch=1} @Self'
  - 'message{m="<gradient:#55ff00:#AAFF00><b>AxVaults</b></gradient> <gray>» <white>Vault <#55FF00>#1 <white>closed!"} @Self'

