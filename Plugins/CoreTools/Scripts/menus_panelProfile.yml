pf_boton_casco:
  Conditions:
  - 'comparator{v1="%coretools_var_player_pf_casco%";v2="armor_stand"} falseElse pf_boton_casco_puesto'
  Mechanics:
  - 'itemstack{source="vanilla";material=armor_stand;amount=1;name="<#9EA3AE>Casco <dark_gray>(vacío)";lore="<#7A7F8A>Equípate algo y aparecerá aquí.";flags="HIDE_ATTRIBUTES"}'
pf_boton_casco_puesto:
  Mechanics:
  - 'itemstack{source="vanilla";material="%coretools_var_player_pf_casco%";amount=1;name="<white><glyph:shield> <gradient:#FFE29A:#FFB347>Casco</gradient>";lore="<#C9CDD6>Lo llevas puesto ahora.";flags="HIDE_ATTRIBUTES,HIDE_ADDITIONAL_TOOLTIP"}'
