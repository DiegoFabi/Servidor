  Mechanics:
  - 'playsound{sound="minecraft:entity.experience_orb.pickup";volume=1;pitch=1} @Self'
  - 'command{c="core-menu MainShop {caster_name}";runas=console} @Self'
menumain_b6_click:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:entity.wolf.ambient";volume=1;pitch=1} @Self'
  - 'command{c="pets collection";runas=op} @Self'
menumain_b9_click:
  Conditions: []
  Mechanics:
  - 'command{c="core-menu panelTP {caster_name}";runas=console} @Self'
menumain_b10_click:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:item.book.page_turn";volume=1;pitch=1} @Self'
  - 'command{c="core-menu menuAyuda {caster_name}";runas=console} @Self'
menumain_bounty_click:
  Conditions: []
