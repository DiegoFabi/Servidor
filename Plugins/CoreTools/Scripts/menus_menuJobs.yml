# Acciones de los menus convertidos desde CommandPanels
menujobs_b5_left_click:
  Conditions: []
  Mechanics:
  - 'command{c="jobs join farmer";runas=player} @Self'
  - 'variable{a=set;v=inJob;va="%jobsr_user_jobs%"} @Self'
  - 'command{c="core-menu menuJobs {caster_name}";runas=console} @Self'
menujobs_b5_right_click:
  Conditions: []
  Mechanics:
  - 'command{c="jobs leave farmer";runas=player} @Self'
  - 'variable{a=remove;v=inJob} @Self'
  - 'command{c="core-menu menuJobs {caster_name}";runas=console} @Self'
