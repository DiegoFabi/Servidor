# Acciones de los menus convertidos desde CommandPanels
paneltp_open:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:entity.experience_orb.pickup";volume=1;pitch=1} @Self'
paneltp_b1_click:
  Conditions: []
  Mechanics:
  - 'command{c="rtp world survivalMain";runas=op} @Self'
  - 'playsound{sound="minecraft:entity.enderman.teleport";volume=1;pitch=1} @Self'
  - 'message{m="&6Transporte &8» &aTe has movido al mundo &2Survival, &aatento a los mobs!"} @Self'
paneltp_b2_click:
  Conditions: []
  Mechanics:
  - 'command{c="core-menu menuWarps {caster_name}";runas=console} @Self'
  - 'playsound{sound="minecraft:block.note_block.hat";volume=1;pitch=1} @Self'
