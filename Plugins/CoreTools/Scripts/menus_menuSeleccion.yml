# ---------- Particulas cosméticas (Skript personalizacion/particulas_cosmeticas.sk) ----------
# Si ya tiene el permiso cosmetico.particula.<id> se activa; si no, se intenta comprar con Shards.
cosm_alma_click:
  Conditions:
  - 'Permission{p=cosmetico.particula.alma} falseElse cosm_alma_comprar'
  Mechanics:
  - 'closeinventory{} @Self'
  - 'command{c="particula usar alma";runas=player} @Self'
cosm_alma_comprar:
  Conditions:
  - 'currency{m=check;c=coinsengine-shards;a=1500} falseElse cosm_sin_shards'
  Mechanics:
  - 'currency{m=remove;c=coinsengine-shards;a=1500} @Self'
  - 'command{c="lp user {caster_name} permission set cosmetico.particula.alma true";runas=console} @Self'
  - 'playsound{sound="minecraft:entity.player.levelup";volume=1;pitch=1.2} @Self'
  - 'message{m="<dark_gray>┃ <light_purple><bold>Partículas</bold> <dark_gray>» <#C9CDD6>Has comprado <gradient:#9FE8FF:#4FB3D9>Aura de Almas</gradient> <#C9CDD6>por <#D89BFF>✦ 1500"} @Self'
  - 'closeinventory{} @Self'
  - 'command{c="particula usar alma";runas=op} @Self'
