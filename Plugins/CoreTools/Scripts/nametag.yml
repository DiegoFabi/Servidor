# Nametag: pasa a Skript el clan del jugador (PlaceholderAPI) para la línea
# de arriba del nametag (Skript servidor/nametag.sk, comando /ntequipo).
# Lo lanza EventsManager/nametag.yml al entrar y Skript con
# "core-cast nametag_equipo <jugador>" cuando alguien usa /team.
nametag_equipo:
  Mechanics:
  - 'command{c="ntequipo {caster_name} %justteams_name%";runas=console} @Self'
nametag_equipo_entrar:
  Delay: 40
  Mechanics:
  - 'command{c="ntequipo {caster_name} %justteams_name%";runas=console} @Self'
