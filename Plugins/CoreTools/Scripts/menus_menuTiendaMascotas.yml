# Tienda de Mascotas (MCPets) con Shards. Si ya tienes el permiso de la mascota se abre /mcpets;
# si no, se compra con Shards y LuckPerms da el permiso de MCPets.
tmasc_a_pet_griffon_griffon:
  Conditions:
  - 'Permission{p=mcpet.Pet_Griffon_Griffon} falseElse tmasc_a_pet_griffon_griffon_comprar'
  Mechanics:
  - 'closeinventory{} @Self'
  - 'command{c="mcpets";runas=player} @Self'
tmasc_a_pet_griffon_griffon_comprar:
  Conditions:
  - 'currency{m=check;c=coinsengine-shards;a=3000} falseElse tmasc_sin_shards'
  Mechanics:
  - 'currency{m=remove;c=coinsengine-shards;a=3000} @Self'
  - 'command{c="lp user {caster_name} permission set mcpet.Pet_Griffon_Griffon true";runas=console} @Self'
  - 'playsound{sound="minecraft:entity.player.levelup";volume=1;pitch=1.2} @Self'
  - 'message{m="<dark_gray>┃ <gold><bold>Mascotas</bold> <dark_gray>» <#C9CDD6>Has adoptado a <gradient:#FFE29A:#FFB347>Grifo</gradient> <#C9CDD6>por <#D89BFF>✦ 3000<#C9CDD6>. Invócala en <#FFD36B>/mcpets"} @Self'
