# Acciones del menú Más Opciones (menuOpciones.yml)
menumain_opciones_click:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:item.bundle.insert";volume=1;pitch=1} @Self'
  - 'command{c="core-menu menuOpciones {caster_name}";runas=console} @Self'
opciones_buzon_click:
  Conditions: []
  Mechanics:
  - 'closeinventory{} @Self'
  - 'command{c="buzon";runas=player} @Self'
opciones_historia_click:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:item.book.page_turn";volume=1;pitch=1} @Self'
  - 'command{c="historia";runas=player} @Self'
opciones_subasta_click:
  Conditions: []
  Mechanics:
  - 'closeinventory{} @Self'
  - 'command{c="subasta info";runas=player} @Self'
opciones_duelos_click:
  Conditions: []
  Mechanics:
  - 'closeinventory{} @Self'
  - 'command{c="coinflip";runas=player} @Self'
  - 'message{m="<dark_gray>┃ <gold><bold>Duelos</bold> <dark_gray>» <#C9CDD6>Reto de Clicks: <#FFD36B>/retoclicks <jugador>"} @Self'
opciones_volver_click:
  Conditions: []
  Mechanics:
  - 'playsound{sound="minecraft:ui.button.click";volume=1;pitch=1} @Self'
  - 'command{c="core-menu menuMain {caster_name}";runas=console} @Self'
opciones_homes_click:
  Conditions: []
  Mechanics:
  - 'closeinventory{} @Self'
  - 'playsound{sound="minecraft:item.bundle.drop_contents";volume=1;pitch=1} @Self'
  - 'command{c="homes list";runas=player} @Self'
# Bossbar de seguimiento de misiones (TypeWriter, fact misiones_bossbar_oculta:
# 1 = oculta). Solo visual: la misión sigue activa. Un clic la cambia y el
# menú se vuelve a abrir para mostrar el estado nuevo en el tooltip.
opciones_bossbar_estado:
  Conditions:
  - 'comparator{v1="%typewriter_zi2Eg3h0p54qGzT%";v2="1"} trueElse opciones_bossbar_estado_on'
  Mechanics:
  - 'variable{a=set;v=bossbar_misiones;va="<#FF6B6B>Desactivado"} @Self'
opciones_bossbar_estado_on:
  Mechanics:
  - 'variable{a=set;v=bossbar_misiones;va="<#7FFF9E>Activado"} @Self'
opciones_bossbar_misiones_click:
  Conditions:
  - 'comparator{v1="%typewriter_zi2Eg3h0p54qGzT%";v2="1"} trueElse opciones_bossbar_ocultar'
  Mechanics:
  - 'command{c="typewriter facts set misiones_bossbar_oculta 0 {caster_name}";runas=console} @Self'
  - 'variable{a=set;v=bossbar_misiones;va="<#7FFF9E>Activado"} @Self'
  - 'playsound{sound="minecraft:block.note_block.pling";volume=1;pitch=1.6} @Self'
  - 'command{c="core-menu menuOpciones {caster_name}";runas=console} @Self'
opciones_bossbar_ocultar:
  Mechanics:
  - 'command{c="typewriter facts set misiones_bossbar_oculta 1 {caster_name}";runas=console} @Self'
  - 'variable{a=set;v=bossbar_misiones;va="<#FF6B6B>Desactivado"} @Self'
  - 'playsound{sound="minecraft:block.note_block.bass";volume=1;pitch=1} @Self'
  - 'command{c="core-menu menuOpciones {caster_name}";runas=console} @Self'
