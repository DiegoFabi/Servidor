# ---------- Tienda de Cosméticos (HMCCosmetics) ----------
# Si ya tiene hmccosmetics.<id> se equipa; si no, se compra con Shards (permiso por LuckPerms).
hcosm_cemetery_witch_hat_click:
  Conditions:
  - 'Permission{p=hmccosmetics.cemetery_witch_hat} falseElse hcosm_cemetery_witch_hat_comprar'
  Mechanics:
  - 'closeinventory{} @Self'
  - 'command{c="cosmetic apply cemetery_witch_hat {caster_name}";runas=console} @Self'
  - 'playsound{sound="minecraft:item.armor.equip_leather";volume=1;pitch=1.2} @Self'
hcosm_cemetery_witch_hat_comprar:
  Conditions:
  - 'currency{m=check;c=coinsengine-shards;a=2500} falseElse hcosm_sin_shards'
  Mechanics:
  - 'currency{m=remove;c=coinsengine-shards;a=2500} @Self'
  - 'command{c="lp user {caster_name} permission set hmccosmetics.cemetery_witch_hat true";runas=console} @Self'
  - 'playsound{sound="minecraft:entity.player.levelup";volume=1;pitch=1.2} @Self'
  - 'message{m="<dark_gray>┃ <gold><bold>Cosméticos</bold> <dark_gray>» <#C9CDD6>Has comprado <gradient:#B57BFF:#6B2FB3>Sombrero de la Bruja del Cementerio</gradient> <#C9CDD6>por <#D89BFF>✦ 2500"} @Self'
  - 'closeinventory{} @Self'
  - 'command{c="cosmetic apply cemetery_witch_hat {caster_name}";runas=console} @Self'
