# Réplica de AxVaults: un baúl de CoreTools por cada "Vault #N" de AxVaults.
# Mismo permiso que en AxVaults (axvaults.vault.N, modo 0: cada baúl el suyo),
# así LuckPerms no cambia. 6 filas, 1 página, sin botones (54 ranuras libres).
# Se abren desde el selector (MenuCreator/menuBaules.yml) o con /pv <número>.

