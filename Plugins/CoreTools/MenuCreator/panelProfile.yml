# Perfil del jugador "Tu Perfil" (fondo: Inventories/along:font/gui/perfil.png, carácter U+3290).
# Se abre con /perfil (botón "Mi Perfil" del menú principal): Skript guarda antes la armadura
# puesta en variables de CoreTools (pf_casco...) y abre este menú.
# Cabeza 2D mediana: player_head con custom_model_data 102 (centrada en el panel de la cabeza).
# Botón volver: flecha dibujada en el fondo; item transparente (diamond + CMD 1 de Inventories).
