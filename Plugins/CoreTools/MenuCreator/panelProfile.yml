# Perfil del jugador (diseño con textura: Inventories/along:font/gui/perfil.png, carácter U+3290).
# Cabeza 2D grande: player_head con custom_model_data 101 (pequeña, cabe en el panel 3x3) (pack 2DPlayerHeads + player_head.json de Inventories).
# Equipamiento: iconos fijos (los placeholders de objetos de PAPI fallan con el slot vacío).
# Botón volver: flecha dibujada en la textura; el item es transparente (diamond + CMD 1 de Inventories, como MainShop).
panelProfile:
