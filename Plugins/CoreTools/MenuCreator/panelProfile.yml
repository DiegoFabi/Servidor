# Perfil del jugador. Abrir: /coremenu panelProfile
# Equipamiento: botones fijos con descripción. NO se usan los placeholders de
# objetos de la expansión Player de PlaceholderAPI (armadura y manos): lanzan un
# NullPointerException con el slot vacío e impiden abrir el menú.
# (placeholders de PlaceholderAPI, expansion Player). Los dynamic_button
# anteriores construian el item con un placeholder como material y
# hacian fallar la apertura del menu.
# Habilidades: solo visuales, preparadas para AuraSkills (sin comandos).
panelProfile:
  permission: ''
  bottom_inventory: false
  name: '&8Mi Perfil'
  size: 5
  fill_material: AIR
  enable_animation: false
  buttons:
    eq_casco:
      location: top
      slots:
      - 10
      source: vanilla
      material: iron_helmet
      name: <white><glyph:shield> <gradient:#FFE29A:#FFB347>Casco</gradient>
      lore:
      - '<#C9CDD6>Protege tu cabeza.'
      - '<#C9CDD6>Mira tu inventario para ver tu cabeza.'
      flags:
      - HIDE_ATTRIBUTES
      - HIDE_ADDITIONAL_TOOLTIP
