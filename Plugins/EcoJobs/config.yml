level-gui:
  progression-slots:
    level-as-amount: true
    next-page:
      item: arrow name:"&fPágina siguiente"
      item-inactive: air
      location:
        column: 8
        row: 4
      locations: []
    pattern:
    - '000000000'
    - '000000000'
    - '000000000'
    - '001234500'
    - 006789a00
    locked:
      item: red_stained_glass_pane
      lore:
      - '&f'
      - '&fRecompensas:'
      - '%rewards%'
      name: '%job% &fNv. &a%level%'
    close:
      material: barrier
      name: '&cCerrar'
      location:
        column: 9
        row: 5
      locations: []
      enabled: true
    in-progress:
      item: yellow_stained_glass_pane
      lore:
      - '&f'
      - '&fRecompensas:'
      - '%rewards%'
      - '&f'
      - '&fProgreso:'
      - '&8» &e%percentage_progress%%'
      - '&8» &e%current_xp%&8/&7%required_xp% &fXP'
      name: '%job% &fNv. &a%level%'
    unlocked:
      item: lime_stained_glass_pane
      lore:
      - '&f'
      - '&fRecompensas:'
      - '%rewards%'
      - '&f'
      - '&aDESBLOQUEADO'
      name: '%job% &fNv. &a%level%'
    prev-page:
      item: arrow name:"&fPágina anterior"
      location:
        column: 2
        row: 4
      locations: []
    page-change-sound:
      volume: 1
      sound: ui_button_click
      pitch: 1
      category: MASTER
      enabled: true
  custom-slots:
  - item: nexo:medival_jobs_empty name:"&eVolver a Trabajos"
    lore:
    - '&f &7Click para volver al menú de trabajos'
    left-click:
    - jobs
    locations:
    - column: 2
      row: 1
    - column: 3
      row: 1
    - column: 4
      row: 1
    - column: 5
      row: 1
    - column: 6
      row: 1
    - column: 7
      row: 1
    - column: 8
      row: 1
    - column: 2
      row: 2
    - column: 3
      row: 2
    - column: 4
      row: 2
    - column: 5
      row: 2
    - column: 6
      row: 2
    - column: 7
      row: 2
    - column: 8
      row: 2
    - column: 2
      row: 3
    - column: 3
      row: 3
    - column: 4
      row: 3
    - column: 5
      row: 3
    - column: 6
      row: 3
    - column: 7
      row: 3
    - column: 8
      row: 3
    right-click:
    - jobs
  rows: 5
  title: '&f'
  mask:
    materials:
    - black_stained_glass_pane
    pattern:
    - '000000000'
    - '000000000'
    - '000000000'
    - '000000000'
    - '000000000'
jobs:
  prevent-levelling-while-afk: true
  limit: 3
  reset-on-quit-relocks: false
leaderboard:
  enabled: true
level-up:
  sound:
    volume: 0.8
    sound: entity_player_levelup
    pitch: 1.3
    category: PLAYER
    enabled: true
  message:
    message:
    - '&f'
    - ' &#964B00¡Has subido %job%&#964B00 al &eNivel %level%&#964B00!'
    - '&f'
    - ' &#964B00&lRECOMPENSAS:'
    - ' %level_up_messages%'
    - '&f'
    enabled: true
leave-gui:
  # Recuadro de abajo (5x2): izquierda verde = salir, centro gris = explicación,
  # derecha rojo = cancelar.
  cancel:
    item: red_stained_glass_pane
    lore:
    - ''
    - '&#C9CDD6Te quedas en el trabajo y'
    - '&#C9CDD6vuelves al menú de trabajos.'
    - ''
    - '&#FF8A8A✥ ¡Clic para &#FF8A8A&lCANCELAR&#FF8A8A!'
    name: '&#FF6B6B✘ Cancelar'
    location:
      column: 6
      row: 4
    locations:
    - column: 6
      row: 4
    - column: 7
      row: 4
    - column: 6
      row: 5
    - column: 7
      row: 5
  confirm:
    item: lime_stained_glass_pane
    lore:
    - ''
    - '&#C9CDD6Dejarás el trabajo &f%job%&#C9CDD6.'
    - '%leave_lore%'
    - ''
    - '&#7FFF9E✥ ¡Clic para &#7FFF9E&lSALIR&#7FFF9E!'
    name: '&#7FFF9E✔ Salir de %job%'
    location:
      column: 4
      row: 4
    locations:
    - column: 3
      row: 4
    - column: 4
      row: 4
    - column: 3
      row: 5
    - column: 4
      row: 5
  custom-slots:
  - item: gray_stained_glass_pane name:"&#E6E8EE¿Salir del trabajo?"
    lore:
    - ''
    - '&#7FFF9E◀ Verde: &#C9CDD6sales del trabajo.'
    - '&#FF6B6B▶ Rojo: &#C9CDD6te quedas en él.'
    - ''
    - '&#9EA3AEPuede que pierdas el progreso'
    - '&#9EA3AEsegún la configuración del trabajo.'
    column: 5
    row: 4
  - item: gray_stained_glass_pane name:"&#E6E8EE¿Salir del trabajo?"
    lore:
    - ''
    - '&#7FFF9E◀ Verde: &#C9CDD6sales del trabajo.'
    - '&#FF6B6B▶ Rojo: &#C9CDD6te quedas en él.'
    - ''
    - '&#9EA3AEPuede que pierdas el progreso'
    - '&#9EA3AEsegún la configuración del trabajo.'
    column: 5
    row: 5
  rows: 5
  title: '&f'
  mask:
    materials:
    - black_stained_glass_pane
    pattern:
    - '000000000'
    - '000000000'
    - '000000000'
    - '000000000'
    - '000000000'
