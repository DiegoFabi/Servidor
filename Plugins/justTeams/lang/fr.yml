help_menu:
- <gradient:#4C9DDE:#FFD700>Commandes JustTeams</gradient>
- <gray>/team gui <white>- Ouvre l'interface d'équipe.
- <gray>/team create <tag> <name> <white>- Crée une équipe (le nom peut contenir des espaces).
- <gray>/team disband <white>- Dissout votre équipe.
- <gray>/team invite <player> <white>- Invite un joueur.
- <gray>/team join <teamName> <white>- Rejoint une équipe publique.
- <gray>/team leave <white>- Quitte votre équipe actuelle.
- <gray>/team info [team] <white>- Affiche les infos de l'équipe.
- <gray>/team sethome <white>- Définit le domicile de l'équipe.
- <gray>/team home <white>- Se téléporte au domicile de l'équipe.
- <gray>/team bank <white>- Gère la banque de l'équipe.
- <gray>/team enderchest <white>- Ouvre le coffre de l'End de l'équipe.
- <gray>/team top <white>- Affiche les classements des équipes.
- <gray>/team chat <white>- Bascule le mode chat d'équipe.
- <gray>/team admin home <team> <white>- Téléportation admin au domicile.
- <gray>/team admin enderchest <team> <white>- Consultation admin du coffre de l'End.
- <click:suggest_command:/team help ><hover:show_text:'<gray>Cliquez pour plus de commandes !'><yellow>Tapez /team help pour la liste complète.</yellow></hover></click>
help_entries:
  gui: Ouvre l'interface d'équipe.
  create: <tag> <name> - Crée une équipe (le nom peut contenir des espaces).
  create_no_tag: <name> - Crée une équipe.
  disband: Dissout votre équipe.
  invite: <player> - Invite un joueur.
  kick: <player> - Expulse un joueur.
  leave: Quitte votre équipe actuelle.
  promote: <player> - Promeut un membre en Co-chef.
  demote: <player> - Rétrograde un Co-chef en Membre.
  info: '[team] - Affiche les infos de l''équipe.'
  sethome: Définit le domicile de l'équipe.
  delhome: Supprime le domicile de l'équipe.
  home: Se téléporte au domicile de l'équipe.
  settag: <tag> - Change le tag de l'équipe.
  setdesc: <description> - Change la description de l'équipe.
  rename: <newName> - Renomme l'équipe (délai applicable).
  transfer: <player> - Transfère la propriété.
  pvp: Bascule le PvP d'équipe.
  bank: '[deposit|withdraw] [amount] - Gère la banque de l''équipe.'
  enderchest: Ouvre le coffre de l'End de l'équipe.
  quests: Ouvre le menu des quêtes d'équipe.
  top: Affiche les classements.
  join: <team> - Rejoint une équipe ou demande à la rejoindre.
  unjoin: <team> - Retire une demande d'adhésion.
  public: Bascule le statut public de votre équipe.
  requests: Affiche les demandes d'adhésion de votre équipe.
  setwarp: <name> [password] - Définit un warp d'équipe.
  delwarp: <name> - Supprime un warp d'équipe.
  warp: <name> [password] - Se téléporte à un warp d'équipe.
  warps: Liste tous les warps de l'équipe.
  blacklist: <player> [reason] - Ajoute un joueur à la liste noire de votre équipe.
  unblacklist: <player> - Retire un joueur de la liste noire de votre équipe.
  invites: Affiche vos invitations en attente.
  accept: '[team] - Accepte une invitation. Sans nom d''équipe, accepte votre seule invitation.'
  deny: '[team] - Refuse une invitation.'
  chat: '[message] - Active ou désactive le chat d''équipe, ou envoie un message à votre équipe.'
  allychat: <message> - Envoie un message à votre équipe et aux équipes alliées.
  glow: Active ou désactive la lueur d'équipe pour vous.
  settings: Ouvre les paramètres de l'équipe.
  usersettings: Ouvre vos paramètres personnels, comme la langue.
  setcolor: <color> - Change la couleur de l'équipe.
  ally: <add|accept|deny|remove|list> [team] - Gère les alliances.
  buffs: Ouvre le menu des bonus d'équipe.
  prices: Affiche les prix d'actions que vous pouvez définir.
  setprice: <action> <amount|reset> - Définit le prix de votre équipe pour une action.
  admin: admin - Ouvre le menu d'administration.
  admin_warps: admin warps <teamName> - Affiche les warps d'une équipe.
  admin_warp: admin warp <teamName> <warp> - Téléporte vers un warp d'équipe.
  chatspy: Affiche tous les chats d'équipe.
  reload: Recharge la configuration.
  admin_home: admin home <teamName> - Se téléporte au domicile de l'équipe.
  admin_enderchest: admin enderchest <teamName> - Consulte le coffre de l'End de l'équipe.
  admin_disband: admin disband <teamName> - Commande admin pour dissoudre une équipe.
  platform: Affiche les informations de votre plateforme (Java/Bedrock).
  debug_permissions: debug-permissions - Débogue les permissions actuelles de votre équipe.
  debug_placeholders: debug-placeholders - Teste tous les placeholders PlaceholderAPI de votre équipe.
  visibility: '[hide|show] - Toggles teammate visibility for yourself.'
  browse: Browse every team on the server.
  input: <answer> - Answers an open team prompt when chat does not work.
