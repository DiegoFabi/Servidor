help_menu:
- <gradient:#4C9DDE:#FFD700>Comandos de JustTeams</gradient>
- <gray>/team gui <white>- Abre la interfaz del equipo.
- <gray>/team create <tag> <name> <white>- Crea un equipo (el nombre puede tener espacios).
- <gray>/team disband <white>- Disuelve tu equipo.
- <gray>/team invite <player> <white>- Invita a un jugador.
- <gray>/team join <teamName> <white>- Únete a un equipo público.
- <gray>/team leave <white>- Abandona tu equipo actual.
- <gray>/team info [team] <white>- Muestra la info del equipo.
- <gray>/team sethome <white>- Establece el hogar del equipo.
- <gray>/team home <white>- Teletranspórtate al hogar del equipo.
- <gray>/team bank <white>- Gestiona el banco del equipo.
- <gray>/team enderchest <white>- Abre el cofre de ender del equipo.
- <gray>/team top <white>- Muestra las clasificaciones de equipos.
- <gray>/team chat <white>- Alterna el modo de chat de equipo.
- <gray>/team admin home <team> <white>- Teletransporte de admin al hogar.
- <gray>/team admin enderchest <team> <white>- Ver cofre de ender como admin.
- <click:suggest_command:/team help ><hover:show_text:'<gray>¡Haz clic para más comandos!'><yellow>Escribe /team help para ver la lista completa.</yellow></hover></click>
help_entries:
  gui: Abre la interfaz del equipo.
  create: <tag> <name> - Crea un equipo (el nombre puede tener espacios).
  create_no_tag: <name> - Crea un equipo.
  disband: Disuelve tu equipo.
  invite: <player> - Invita a un jugador.
  kick: <player> - Expulsa a un jugador.
  leave: Abandona tu equipo actual.
  promote: <player> - Asciende a un miembro a Co-Dueño.
  demote: <player> - Degrada a un Co-Dueño a Miembro.
  info: '[team] - Muestra la info del equipo.'
  sethome: Establece el hogar del equipo.
  delhome: Elimina el hogar del equipo.
  home: Teletranspórtate al hogar del equipo.
  settag: <tag> - Cambia la etiqueta del equipo.
  setdesc: <description> - Cambia la descripción del equipo.
  rename: <newName> - Renombra el equipo (se aplica enfriamiento).
  transfer: <player> - Transfiere la propiedad.
  pvp: Alterna el PvP del equipo.
  bank: '[deposit|withdraw] [amount] - Gestiona el banco del equipo.'
  enderchest: Abre el cofre de ender del equipo.
  quests: Abre el menú de misiones del equipo.
  top: Muestra las clasificaciones.
  join: <team> - Únete o solicita unirte a un equipo.
  unjoin: <team> - Retira una solicitud de unión.
  public: Alterna si tu equipo es público.
  requests: Ver las solicitudes de unión de tu equipo.
  setwarp: <name> [password] - Establece un warp de equipo.
  delwarp: <name> - Elimina un warp de equipo.
  warp: <name> [password] - Teletranspórtate a un warp de equipo.
  warps: Lista todos los warps del equipo.
  blacklist: <player> [reason] - Añade a un jugador a la lista negra de tu equipo.
  unblacklist: <player> - Quita a un jugador de la lista negra de tu equipo.
  invites: Muestra tus invitaciones pendientes.
  accept: '[team] - Acepta una invitación. Sin nombre de equipo acepta tu única invitación.'
  deny: '[team] - Rechaza una invitación.'
  chat: '[message] - Activa o desactiva el chat de equipo, o envía un mensaje a tu equipo.'
  allychat: <message> - Envía un mensaje a tu equipo y a los equipos aliados.
  glow: Activa o desactiva el brillo del equipo para ti.
  settings: Abre los ajustes del equipo.
  usersettings: Abre tus ajustes personales, como el idioma.
  setcolor: <color> - Cambia el color del equipo.
  ally: <add|accept|deny|remove|list> [team] - Gestiona las alianzas.
  buffs: Abre el menú de mejoras del equipo.
  prices: Muestra los precios de acciones que puedes fijar.
  setprice: <action> <amount|reset> - Fija el precio de tu equipo para una acción.
  admin: admin - Abre el menú de administración.
  admin_warps: admin warps <teamName> - Muestra los warps de un equipo.
  admin_warp: admin warp <teamName> <warp> - Teletransporta a un warp del equipo.
  chatspy: Muestra todos los chats de equipo.
  reload: Recarga la configuración.
  admin_home: admin home <teamName> - Teletranspórtate al hogar del equipo.
  admin_enderchest: admin enderchest <teamName> - Ver el cofre de ender del equipo.
  admin_disband: admin disband <teamName> - Comando de admin para disolver un equipo.
  platform: Muestra la información de tu plataforma (Java/Bedrock).
  debug_permissions: debug-permissions - Depura los permisos actuales de tu equipo.
  debug_placeholders: debug-placeholders - Prueba todos los placeholders de PlaceholderAPI de tu equipo.
  visibility: '[hide|show] - Toggles teammate visibility for yourself.'
  browse: Browse every team on the server.
  input: <answer> - Answers an open team prompt when chat does not work.
