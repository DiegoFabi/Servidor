  daily_zombie_slayer:
    name: Zombiejäger
    description:
    - Jagt gemeinsam Zombies.
    - Jeder Kill zählt für das Ziel.
  daily_skeleton_slayer:
    name: Skelettjäger
    description:
    - Besiegt gemeinsam Skelette.
  arena_warriors:
    name: Arenakrieger
    description:
    - Besiegt gegnerische Spieler im PvP.
  miners_pact:
    name: Bergbaupakt
    description:
    - Baut gemeinsam Stein ab.
  builders_guild:
    name: Baugilde
    description:
    - Platziert Blöcke für ein gemeinsames Bauwerk.
  long_haul:
    name: Lange Reise
    description:
    - Reist gemeinsam durch die Welt.
  monster_hunt:
    name: Monsterjagd
    description:
    - Besiegt gemeinsam Monster.
    - Jeder Monster-Kill zählt.
  creeper_cleanup:
    name: Creeper-Säuberung
    description:
    - Erledigt die Creeper, bevor sie euch erledigen.
  spider_squashers:
    name: Spinnenschreck
    description:
    - Räumt gemeinsam die Spinnen aus dem Weg.
  void_walkers:
    name: Leerenwanderer
    description:
    - Jagt gemeinsam Endermen.
  nether_purge:
    name: Nether-Säuberung
    description:
    - Löscht die Lohen im Nether.
  wither_hunters:
    name: Witherjäger
    description:
    - Besiegt Witherskelette in der Festung.
  deep_delvers:
    name: Tiefengräber
    description:
    - Baut gemeinsam tief unten Tiefenschiefer ab.
  master_builders:
    name: Baumeister
    description:
    - Platziert Blöcke für ein großes Bauwerk.
  globetrotters:
    name: Weltenbummler
    description:
    - Legt gemeinsam eine riesige Strecke zurück.
  champions_arena:
    name: Arena der Champions
    description:
    - Beweist euer Team im PvP gegen andere Spieler.

