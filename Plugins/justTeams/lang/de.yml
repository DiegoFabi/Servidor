help_format: <gray>/team <command> <white>- <description>
help_page: <gray>Seite <white><page></white> von <white><pages></white>.</gray>
help_page_next: <gray>Seite <white><page></white> von <white><pages></white>. <click:run_command:/team help <next>><hover:show_text:'<gray>Nächste Seite anzeigen'><yellow>Tippe /team help <next> für mehr.</yellow></hover></click></gray>
help_menu:
- <gradient:#4C9DDE:#FFD700>JustTeams-Befehle</gradient>
- <gray>/team gui <white>- Öffnet die Team-GUI.
- <gray>/team create <tag> <name> <white>- Erstellt ein Team (Name kann Leerzeichen enthalten).
- <gray>/team disband <white>- Löst dein Team auf.
- <gray>/team invite <player> <white>- Lädt einen Spieler ein.
- <gray>/team join <teamName> <white>- Tritt einem öffentlichen Team bei.
- <gray>/team leave <white>- Verlässt dein aktuelles Team.
- <gray>/team info [team] <white>- Zeigt Team-Infos an.
- <gray>/team sethome <white>- Legt das Team-Zuhause fest.
- <gray>/team home <white>- Teleportiert zum Team-Zuhause.
- <gray>/team bank <white>- Verwaltet die Team-Bank.
- <gray>/team enderchest <white>- Öffnet die Team-Enderkiste.
- <gray>/team top <white>- Zeigt die Team-Bestenlisten an.
- <gray>/team chat <white>- Schaltet den Team-Chat-Modus um.
- <gray>/team admin home <team> <white>- Admin-Teleport zum Zuhause.
- <gray>/team admin enderchest <team> <white>- Admin-Ansicht der Enderkiste.
- <click:suggest_command:/team help ><hover:show_text:'<gray>Klicke für mehr Befehle!'><yellow>Tippe /team help für eine vollständige Liste.</yellow></hover></click>
help_entries:
  gui: Öffnet die Team-GUI.
  create: <tag> <name> - Erstellt ein Team (Name kann Leerzeichen enthalten).
  create_no_tag: <name> - Erstellt ein Team.
  disband: Löst dein Team auf.
  invite: <player> - Lädt einen Spieler ein.
  kick: <player> - Wirft einen Spieler hinaus.
  leave: Verlässt dein aktuelles Team.
  promote: <player> - Befördert ein Mitglied zum Co-Besitzer.
  demote: <player> - Stuft einen Co-Besitzer zum Mitglied herab.
  info: '[team] - Zeigt Team-Infos an.'
  sethome: Legt das Team-Zuhause fest.
  delhome: Löscht das Team-Zuhause.
  home: Teleportiert zum Team-Zuhause.
  settag: <tag> - Ändert das Team-Kürzel.
  setdesc: <description> - Ändert die Team-Beschreibung.
  rename: <newName> - Benennt das Team um (Abklingzeit gilt).
  transfer: <player> - Überträgt die Besitzerschaft.
  pvp: Schaltet Team-PvP um.
  bank: '[deposit|withdraw] [amount] - Verwaltet die Team-Bank.'
  enderchest: Öffnet die Team-Enderkiste.
  quests: Öffnet das Team-Quests-Menü.
  top: '[kills|points|balance|members] - Zeigt Bestenlisten an.'
  input: <antwort> - Beantwortet eine offene Team-Eingabe, wenn der Chat nicht geht.
  join: <team> - Tritt einem Team bei oder fragt einen Beitritt an.
  unjoin: <team> - Zieht eine Beitrittsanfrage zurück.
  public: Schaltet um, ob dein Team öffentlich ist.
  requests: Zeigt Beitrittsanfragen für dein Team an.
  setwarp: <name> [password] - Legt einen Team-Warp fest.
  delwarp: <name> - Löscht einen Team-Warp.
  warp: <name> [password] - Teleportiert zu einem Team-Warp.
  warps: Listet alle Team-Warps auf.
  blacklist: <player> [reason] - Setzt einen Spieler auf die schwarze Liste deines Teams.
  unblacklist: <player> - Entfernt einen Spieler von der schwarzen Liste deines Teams.
  invites: Zeigt deine offenen Einladungen.
  accept: '[team] - Nimmt eine Einladung an. Ohne Teamnamen wird deine einzige Einladung angenommen.'
  deny: '[team] - Lehnt eine Einladung ab.'
  chat: '[message] - Schaltet den Team-Chat um oder sendet eine Nachricht an dein Team.'
  allychat: <message> - Sendet eine Nachricht an dein Team und verbündete Teams.
  glow: Schaltet das Team-Leuchten für dich um.
  settings: Öffnet die Team-Einstellungen.
  usersettings: Öffnet deine persönlichen Einstellungen, z. B. die Sprache.
  setcolor: <color> - Ändert die Teamfarbe.
  ally: <add|accept|deny|remove|list> [team] - Verwaltet Bündnisse.
  buffs: Öffnet das Menü für Team-Buffs.
  prices: Zeigt die Aktionspreise, die du festlegen kannst.
  setprice: <action> <amount|reset> - Legt den Preis deines Teams für eine Aktion fest.
  admin: admin - Öffnet das Admin-Menü.
  admin_warps: admin warps <teamName> - Zeigt die Warps eines Teams.
  admin_warp: admin warp <teamName> <warp> - Teleportiert zu einem Team-Warp.
  chatspy: Zeigt alle Team-Chats.
  reload: Lädt die Konfiguration neu.
  admin_home: admin home <teamName> - Teleport zum Team-Zuhause.
  admin_enderchest: admin enderchest <teamName> - Ansicht der Team-Enderkiste.
  admin_disband: admin disband <teamName> - Admin-Befehl zum Auflösen eines Teams.
  platform: Zeigt deine Plattform-Informationen an (Java/Bedrock).
  debug_permissions: debug-permissions - Debuggt die aktuellen Berechtigungen deines Teams.
  debug_placeholders: debug-placeholders - Testet alle PlaceholderAPI-Platzhalter für dein Team.
  visibility: '[hide|show] - Toggles teammate visibility for yourself.'
  browse: Browse every team on the server.
