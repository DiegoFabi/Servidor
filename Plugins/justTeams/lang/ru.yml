help_menu:
- <gradient:#4C9DDE:#FFD700>Команды JustTeams</gradient>
- <gray>/team gui <white>- Открывает GUI команды.
- <gray>/team create <tag> <name> <white>- Создаёт команду (название может содержать пробелы).
- <gray>/team disband <white>- Распускает вашу команду.
- <gray>/team invite <player> <white>- Приглашает игрока.
- <gray>/team join <teamName> <white>- Вступает в открытую команду.
- <gray>/team leave <white>- Покидает вашу текущую команду.
- <gray>/team info [team] <white>- Показывает информацию о команде.
- <gray>/team sethome <white>- Устанавливает дом команды.
- <gray>/team home <white>- Телепортирует в дом команды.
- <gray>/team bank <white>- Управляет банком команды.
- <gray>/team enderchest <white>- Открывает эндер-сундук команды.
- <gray>/team top <white>- Показывает таблицы лидеров команд.
- <gray>/team chat <white>- Переключает режим командного чата.
- <gray>/team admin home <team> <white>- Админ-телепорт в дом.
- <gray>/team admin enderchest <team> <white>- Админ-просмотр эндер-сундука.
- <click:suggest_command:/team help ><hover:show_text:'<gray>Нажмите для просмотра других команд!'><yellow>Введите /team help для полного списка.</yellow></hover></click>
help_entries:
  gui: Открывает GUI команды.
  create: <tag> <name> - Создаёт команду (название может содержать пробелы).
  create_no_tag: <name> - Создаёт команду.
  disband: Распускает вашу команду.
  invite: <player> - Приглашает игрока.
  kick: <player> - Исключает игрока.
  leave: Покидает вашу текущую команду.
  promote: <player> - Повышает участника до совладельца.
  demote: <player> - Понижает совладельца до участника.
  info: '[team] - Показывает информацию о команде.'
  sethome: Устанавливает дом команды.
  delhome: Удаляет дом команды.
  home: Телепортирует в дом команды.
  settag: <tag> - Изменяет тег команды.
  setdesc: <description> - Изменяет описание команды.
  rename: <newName> - Переименовывает команду (действует перезарядка).
  transfer: <player> - Передаёт владение.
  pvp: Переключает командное PvP.
  bank: '[deposit|withdraw] [amount] - Управляет банком команды.'
  enderchest: Открывает эндер-сундук команды.
  quests: Открывает меню заданий команды.
  top: Показывает таблицы лидеров.
  join: <team> - Вступает или подаёт заявку на вступление в команду.
  unjoin: <team> - Отменяет заявку на вступление.
  public: Переключает, открыта ли ваша команда.
  requests: Просмотр заявок на вступление в вашу команду.
  setwarp: <name> [password] - Устанавливает варп команды.
  delwarp: <name> - Удаляет варп команды.
  warp: <name> [password] - Телепортирует к варпу команды.
  warps: Показывает все варпы команды.
  blacklist: <player> [reason] - Заносит игрока в чёрный список команды.
  unblacklist: <player> - Убирает игрока из чёрного списка команды.
  invites: Показывает ваши активные приглашения.
  accept: '[team] - Принимает приглашение. Без названия команды принимает ваше единственное приглашение.'
  deny: '[team] - Отклоняет приглашение.'
  chat: '[message] - Переключает командный чат или отправляет одно сообщение команде.'
  allychat: <message> - Отправляет сообщение вашей команде и союзным командам.
  glow: Переключает свечение команды для вас.
  settings: Открывает настройки команды.
  usersettings: Открывает ваши личные настройки, например язык.
  setcolor: <color> - Изменяет цвет команды.
  ally: <add|accept|deny|remove|list> [team] - Управляет союзами.
  buffs: Открывает меню баффов команды.
  prices: Показывает цены действий, которые вы можете задать.
  setprice: <action> <amount|reset> - Задаёт цену вашей команды для действия.
  admin: admin - Открывает меню администратора.
  admin_warps: admin warps <teamName> - Показывает варпы команды.
  admin_warp: admin warp <teamName> <warp> - Телепортирует к варпу команды.
  chatspy: Показывает все командные чаты.
  reload: Перезагружает конфигурацию.
  admin_home: admin home <teamName> - Телепорт к дому команды.
  admin_enderchest: admin enderchest <teamName> - Просмотр эндер-сундука команды.
  admin_disband: admin disband <teamName> - Админ-команда для роспуска команды.
  platform: Показывает информацию о вашей платформе (Java/Bedrock).
  debug_permissions: debug-permissions - Отладка текущих прав вашей команды.
  debug_placeholders: debug-placeholders - Проверяет все плейсхолдеры PlaceholderAPI для вашей команды.
  visibility: '[hide|show] - Toggles teammate visibility for yourself.'
