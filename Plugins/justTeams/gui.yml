# ===================================================================
# GUI for the team tier upgrade system
# ===================================================================
# Placeholders available in this GUI (for lore):
#   <current_tier>         Team's current tier (e.g. 3)
#   <max_tier>             Highest tier configured in team_upgrades
#   <next_tier>            Current tier + 1 (or "MAX" at max)
#   <current_max_members>, <next_max_members>
#   <current_enderchest_rows>, <next_enderchest_rows>
#   <current_damage_bonus>, <next_damage_bonus>   (shown as "5%")
#   <current_home_reduction>, <next_home_reduction>
#   <upgrade_cost>         Money cost for next upgrade, "-" if maxed
#   <upgrade_points_cost>  Points cost for next upgrade, "-" if maxed
#   <upgrade_cost_display> Cost shown per team_upgrades.cost_type
#                          (e.g. "$10,000", "100 points", or "$10,000 + 100 points")
#   <team_balance>         Current team bank balance
#   <team_points>          Current team points
# ===================================================================
upgrades-gui:
  title: ᴛᴇᴀᴍ ᴜᴘɢʀᴀᴅᴇs - ᴛɪᴇʀ <current_tier>/<max_tier>
  size: 45
  items:
    current-tier:
      slot: 11
      material: EMERALD_BLOCK
      name: '<gradient:#4C9DDE:#4C96D2><bold>ᴄᴜʀʀᴇɴᴛ ᴛɪᴇʀ: <current_tier></bold></gradient>'
      lore:
      - '<gray>Max Members: <white><current_max_members></white>'
      - '<gray>Ender Chest Rows: <white><current_enderchest_rows></white>'
      - '<gray>Damage Bonus: <white><current_damage_bonus></white>'
      - '<gray>Home Cooldown Reduction: <white><current_home_reduction></white>'
    next-tier:
      slot: 15
      material: DIAMOND_BLOCK
      name: '<gradient:#FFD700:#FFA500><bold>ɴᴇxᴛ ᴛɪᴇʀ: <next_tier></bold></gradient>'
      lore:
      - '<gray>Max Members: <green><next_max_members></green>'
      - '<gray>Ender Chest Rows: <green><next_enderchest_rows></green>'
      - '<gray>Damage Bonus: <green><next_damage_bonus></green>'
      - '<gray>Home Cooldown Reduction: <green><next_home_reduction></green>'
      - ''
      - '<gray>Cost: <gold><upgrade_cost_display></gold>'
      - '<gray>Team Balance: <yellow><team_balance></yellow>'
      - '<gray>Team Points: <yellow><team_points></yellow>'
    max-tier:
      # Shown instead of next-tier when the team is at max tier
      slot: 15
      material: BEACON
      name: <gradient:#FFD700:#FFA500><bold>ᴍᴀxɪᴍᴜᴍ ᴛɪᴇʀ</bold></gradient>
      lore:
      - <gray>Your team has reached the</gray>
      - <gray>highest tier available.</gray>
    upgrade-button:
      slot: 22
      material: NETHER_STAR
      name: <gradient:#55FF55:#00AA00><bold>ᴘᴜʀᴄʜᴀsᴇ ᴜᴘɢʀᴀᴅᴇ</bold></gradient>
      lore:
      - '<gray>Upgrade to tier <green><next_tier></green>'
      - '<gray>Cost: <gold><upgrade_cost_display></gold>'
      - '<gray>Money: enabled bank first, then your wallet.</gray>'
      - ''
      - <yellow>Click to purchase upgrade.</yellow>
      - <red>Only the team owner can purchase.</red>
      action: upgrade-purchase
    upgrade-button-locked:
      # Shown to non-owners instead of upgrade-button
      slot: 22
      material: BARRIER
      name: <red><bold>ᴏᴡɴᴇʀ ᴏɴʟʏ</bold></red>
      lore:
      - <gray>Only the team owner can purchase upgrades.</gray>
      action: upgrade-locked
    back-button:
      slot: 40
      material: ARROW
      name: <gray><bold>◀ ʙᴀᴄᴋ</bold></gray>
      lore:
      - <yellow>Click to return to the team menu.</yellow>
      action: back-button
  fill-item:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
