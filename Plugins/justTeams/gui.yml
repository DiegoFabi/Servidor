      lore:
      - <gray>Start your own team and invite your friends!</gray>
      - ''
      - <yellow>Click to begin the creation process.</yellow>
    team-list:
      slot: 13
      enabled: true
      material: PLAYER_HEAD
      name: <gradient:#4C9DDE:#4C96D2><bold>ʙʀᴏᴡsᴇ ᴛᴇᴀᴍs</bold></gradient>
      lore:
      - <gray>See every team on the server.</gray>
      - <gray>Click a public team to join it.</gray>
      - ''
      - <yellow>Click to browse all teams.</yellow>
    leaderboards:
      slot: 15
      enabled: true
      material: EMERALD
      name: <gradient:#4C9DDE:#4C96D2><bold>ᴠɪᴇᴡ ʟᴇᴀᴅᴇʀʙᴏᴀʀᴅs</bold></gradient>
      lore:
      - <gray>See the top teams on the server.</gray>
      - ''
      - <yellow>Click to view leaderboards.</yellow>
  fill-item:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  
  # ═══════════════════════════════════════════════════════════════════════════
  # CUSTOM DUMMY ITEMS - Decorative items with no click functionality
  # ═══════════════════════════════════════════════════════════════════════════
  # Place decorative items anywhere in your GUI! These are purely cosmetic.
  # Perfect for: Borders, separators, decorations, themed items
  #
  # Configuration options:
  #   slot: Single slot number OR list of slots [1, 2, 3]
  #   material: Any valid Bukkit material name
  #   name: Display name (supports MiniMessage formatting)
  #   lore: List of lore lines (supports MiniMessage formatting)
  #   custom-model-data: (Optional) Custom model data for resource packs
  #   enchanted: (Optional) true/false - adds enchantment glint effect
  #   commands: (Optional) List of commands to run when the item is clicked.
  #             Prefix each line with [player] (default) or [console]. Use [close]
  #             to close the menu. %player% is replaced with the clicker's name,
  #             and PlaceholderAPI placeholders work if it is installed.
  #             Example - a button that opens a zMenu menu:
  #               commands:
  #                 - "[player] menu mymenu"
  #             Example - a console reward plus a message:
  #                 - "[console] give %player% diamond 1"
  #                 - "[player] msg %player% Enjoy!"
  # ═══════════════════════════════════════════════════════════════════════════
  dummy-items:
    # Example: Decorative diamond in the top-left corner
    #decoration-diamond:
    #  slot: 0
    #  material: DIAMOND
    #  name: <gradient:#00FFFF:#0080FF><bold>✦ PREMIUM SERVER ✦</bold></gradient>
    #  lore:
    #    - <gray>Welcome to our awesome server!</gray>
    #    - <dark_gray>━━━━━━━━━━━━━━━━━━━━</dark_gray>
    #  enchanted: true
    #
    # Example: Multiple skull decorations
    #corner-skulls:
    #  slot: [0, 8, 18, 26]  # All four corners
    #  material: PLAYER_HEAD
    #  name: <red>☠</red>
    #
    # Example: Colored glass separator
    #separator:
    #  slot: [9, 17]
