# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  justTeams · gui.yml                                                     ║
# ║                                                                          ║
# ║  Customise every menu: layout, materials, names and lore. Names and      ║
# ║  lore support MiniMessage. Use standard Bukkit material names.           ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# This file allows you to customize every aspect of the plugin's GUIs.
#
# CUSTOMIZATION:
# - Use standard Bukkit Material names (e.g., DIAMOND_SWORD, PLAYER_HEAD).
# - A full list can be found here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# - Names and lores support MiniMessage formatting for colors and effects.
# - Placeholders like <player>, <balance>, <status_indicator> will be replaced where applicable.
# - Add "enabled: false" to any item to hide it from the GUI completely.
# - PlaceholderAPI placeholders (%...%) work in menu titles, item names and lore when
#   PlaceholderAPI is installed. They are resolved for the player looking at the menu.
#
# ITEM LOOK (works on every item that has its own section, buttons included):
#   custom-model-data: 1201            # number for your resource pack
#   item-model: "myserver:team_icon"   # Minecraft 1.21.4+ item model id
#   nexo-id: team_menu_icon            # a Nexo item, needs Nexo; falls back to material
#   enchanted: true                    # enchantment glint
#   item-flags: [HIDE_ATTRIBUTES]      # replaces default-item-flags for this item, [] shows everything
#
# CUSTOM SLOT LAYOUTS FOR DYNAMIC ITEMS:
# - Sections that hold dynamic/list items (player-head, warp-item, team-icon, ally-team, etc.)
#   support a "slots:" list to precisely control where each entry is placed.
# - Slot indices are 0-based, left-to-right, top-to-bottom:
#     Row 1: 0-8     Row 2: 9-17    Row 3: 18-26    Row 4: 27-35    Row 5: 36-44    Row 6: 45-53
# - Example: slots: [10, 11, 12, 13, 14, 15, 16] limits heads to the middle of row 2.
# - Remove the slots: line entirely to use the default full range (slots 9-44).
# - When more items exist than configured slots, extra items are truncated (not shown).
# ---------------------------------------------------- #

# GUI VERSION - DO NOT CHANGE THIS
gui-version: 25

# Tooltip parts hidden on every menu item, for example the attack damage lines of a sword or the
# effects of a potion. Remove an entry to show that part again, or use ALL to add every flag.
# An item's own item-flags list replaces this list for that item.
default-item-flags:
- HIDE_ATTRIBUTES
- HIDE_ENCHANTS
- HIDE_STORED_ENCHANTS
- HIDE_UNBREAKABLE
- HIDE_ADDITIONAL_TOOLTIP

# Filler for every menu that has no fill-item section of its own. A menu's own fill-item wins.
# Materials can be written as RED_STAINED_GLASS_PANE, red_stained_glass_pane or
# minecraft:red_stained_glass_pane. Old names like STAINED_GLASS_PANE with data: 14
# (or STAINED_GLASS_PANE:14) are turned into the matching coloured item.
default-fill-item:
  material: GRAY_STAINED_GLASS_PANE
  name: ' '

