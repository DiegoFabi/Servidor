# Team Prices menu (team settings, Team Prices button). Its texts are in messages.yml (prices_gui_*).
team-prices:
  # What each click does on the buttons of this menu. none = the click does nothing.
  # LEFT, SHIFT_LEFT, RIGHT, SHIFT_RIGHT, MIDDLE (mouse wheel), DROP (Q), CONTROL_DROP (Ctrl+Q),
  # NUMBER_KEY (1-9) and SWAP_OFFHAND (F). When you change them, also change the click hints in
  # messages.yml: prices_gui_left_set_price, prices_gui_right_reset, prices_gui_left_set_amount,
  # prices_gui_right_enable and prices_gui_right_disable.
  click-actions:
    # set = type a new price in chat, reset = go back to the server price
    price:
      LEFT: set
      SHIFT_LEFT: set
      RIGHT: reset
      SHIFT_RIGHT: reset
      MIDDLE: set
      DROP: set
      CONTROL_DROP: set
      NUMBER_KEY: set
      SWAP_OFFHAND: set
    # set = type a new amount in chat, toggle = turn the join fee on or off
    join-fee:
      LEFT: set
      SHIFT_LEFT: set
      RIGHT: toggle
      SHIFT_RIGHT: toggle
      MIDDLE: set
      DROP: set
      CONTROL_DROP: set
      NUMBER_KEY: set
      SWAP_OFFHAND: set
    # toggle = allow or stop co-owners editing prices
    co-owner-access:
      LEFT: toggle
      SHIFT_LEFT: toggle
      RIGHT: toggle
      SHIFT_RIGHT: toggle
      MIDDLE: toggle
      DROP: toggle
      CONTROL_DROP: toggle
      NUMBER_KEY: toggle
      SWAP_OFFHAND: toggle

