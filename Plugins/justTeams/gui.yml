      slot: 0
      material: KNOWLEDGE_BOOK
    browse-teams:
      # Opens the browse-all-teams list, the same one players without a team see.
      # Set enabled: false to hide it, or move the slot to fit your layout.
      slot: 51
      material: SPYGLASS
      name: <gradient:#4C9DDE:#4C96D2><bold>ʙʀᴏᴡsᴇ ᴛᴇᴀᴍs</bold></gradient>
      lore:
      - <gray>Look through every team on the server.</gray>
      - ''
      - <yellow>Click to browse teams.</yellow>
      action: browse-teams
  fill-item:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  
  dummy-items:
