World-Fallback:
  # Controls whether to fallback to specified world if RTP is not configured for the player's world.
  Enabled: true
  # World to fallback to if enabled.
  World: world
Lookup:
  # Max amount of attempts to lookup for a valid location.
  Max-Attempts: 5
  # Sets whether to lookup generated chunks only.
  # [*] Your world must be pre-generated for this feature to work.
  Generated_Chunks_Only: true
  # Sets whether to lookup loaded chunks only.
  Loaded_Chunks_Only: false
  # Per-world RTP range configuration.
  Ranges:
    world:
      Start_X: 0
      Start_Z: 0
      Distance_Min: 1000
      Distance_Max: 10000
      Directions:
      - WEST
      - NORTH
      - SOUTH
      - EAST
    world_nether:
      Start_X: 0
      Start_Z: 0
      Distance_Min: 1000
      Distance_Max: 5000
      Directions:
      - WEST
      - NORTH
      - SOUTH
      - EAST
    world_the_end:
      Start_X: 0
      Start_Z: 0
      Distance_Min: 1000
      Distance_Max: 5000
      Directions:
      - WEST
      - NORTH
      - SOUTH
      - EAST
