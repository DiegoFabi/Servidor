Command:
  Argument:
    Name:
      Slot: Ranura
      Enchant: Encantamiento
      Level: Nivel
      Target: Objetivo
      Type: Tipo
      Time: Tiempo
      Mode: Modo
      IPAddress: Dirección
      Radius: Radio
      Text: Texto
      Position: Posición
      X: x
      Y: y
      Z: z
      Reason: Razón
      IPorName: Nombre | Dirección
      State: state
      Command: command
  # Por Jose :3
  Air:
    Add:
      Desc: Añadir ticks de aire.
    Set:
      Desc: Establecer ticks de aire.
      Target: '<lgray>Se establecieron <lyellow>%amount%</lyellow> ticks de aire para <lyellow>%player_display_name%</lyellow>. Nuevos ticks de aire: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>Tus ticks de aire se establecieron en <lyellow>%amount%</lyellow>: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Remove:
      Desc: Quitar ticks de aire.
    Give:
      Target: '<lgray>Se agregaron <lyellow>%amount%</lyellow> ticks de aire a <lyellow>%player_display_name%</lyellow>. Nuevos ticks de aire: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>Obtuviste <lyellow>%amount%</lyellow> ticks de aire: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Take:
      Target: '<lgray>Se quitaron <lyellow>%amount%</lyellow> ticks de aire de <lyellow>%player_display_name%</lyellow>. Nuevos ticks de aire: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>Perdiste <lyellow>%amount%</lyellow> ticks de aire: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Root:
      Desc: Add commands.
  Anvil:
    Desc: Abrir yunque portátil.
    Target: <lgray>Se abrió el yunque portátil para <lyellow>%player_display_name%</lyellow>.</lgray>
    Notify:
    - <output:"action_bar">
    - <lgray>Abriste un yunque portátil.</lgray>
  Broadcast:
    Desc: Transmitir un mensaje.
  Condense:
    Desc: Condensar objetos en bloques.
    Error:
      Nothing:
      - <sound:"entity_villager_no">
      - <lgray>Nada que condensar.</lgray>
      NotEnough: <lgray>No hay suficientes objetos para convertir <lred>%source%</lred> en <lred>%result%</lred>. Se necesitan al menos <lred>%amount%</lred>.</lgray>
    Done: <lgray>Se convirtieron <lyellow>x%total% %source%</lyellow> en <lyellow>x%amount% %result%</lyellow>.</lgray>
  Disposal:
    Desc: Abrir un menú de eliminación.
    Target: <lgray>Se abrió la eliminación para <lyellow>%player_display_name%</lyellow>.</lgray>
    Notify:
    - <output:"action_bar"><sound:"block_chest_open">
    - <lgray>Abriste la eliminación.</lgray>
  Dimension:
    Desc: Teletransportarse a un mundo.
    Target: <lgray>Se teletransportó a <lyellow>%player_display_name%</lyellow> al <lyellow>%world%</lyellow>.</lgray>
    Notify:
    - <output:"action_bar"><sound:"entity_enderman_teleport">
    - <lgray>Viajaste al <lyellow>%world%</lyellow>.</lgray>
  Enchant:
    Desc: (Des)encantar objeto en una ranura.
    Error:
      NoItem: <lred>¡No hay ningún objeto para encantar!</lred>
    Enchanted:
      Target:
      - <sound:"block_enchantment_table_use">
      - <lgray>¡Se encantó <lyellow>%item%</lyellow> con <lyellow>%name% %amount%</lyellow> en la ranura <lyellow>%type%</lyellow> de <lyellow>%player_display_name%</lyellow>!</lgray>
      Notify:
      - <sound:"block_enchantment_table_use">
      - <lgray>¡Tu <lyellow>%item%</lyellow> se ha encantado con <lyellow>%name% %amount%</lyellow>!</lgray>
    Disenchanted:
      Target:
      - <sound:"block_grindstone_use">
      - <lgray>El encantamiento <lyellow>%name%</lyellow> se ha eliminado de <lyellow>%item%</lyellow> en la ranura <lyellow>%type%</lyellow> de <lyellow>%player_display_name%</lyellow>.</lgray>
      Notify:
      - <sound:"block_grindstone_use">
      - <lgray>¡Tu <lyellow>%item%</lyellow> se ha desencantado de <lyellow>%name%</lyellow>!</lgray>
    EmptySlot: <gray>There is no item in the <white>%player_display_name%</white>'s <soft_red>%slot%</soft_red> slot.</gray>
  Enchanting:
    Desc: Abrir mesa de encantamiento portátil.
    Notify:
    - <output:"action_bar">
    - <lgray>Abriste la mesa de encantamiento.</lgray>
    Target: <lgray>Se abrió la mesa de encantamiento para <lyellow>%player_display_name%</lyellow>.</lgray>
  Experience:
    Add:
      Desc: Añadir puntos o niveles de experiencia.
      Info:
      - <noprefix>
      - ' '
      - <lgray>Se agregaron <lyellow>%amount%</lyellow> %type% a <lyellow>%player_display_name%</lyellow>.</lgray>
      - '<lgray>Nuevo nivel: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Experiencia total: <lyellow>%total%</lyellow></lgray>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <lgray>¡Se han añadido <lyellow>%amount%</lyellow> %type% a tu experiencia!</lgray>
      - '<lgray>Nuevo nivel: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Experiencia total: <lyellow>%total%</lyellow></lgray>'
      - ' '
    Remove:
      Desc: Quitar puntos o niveles de experiencia.
      Info:
      - <noprefix>
      - ' '
      - <lgray>Se quitaron <lyellow>%amount%</lyellow> %type% de <lyellow>%player_display_name%</lyellow>.</lgray>
      - '<lgray>Nuevo nivel: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Experiencia total: <lyellow>%total%</lyellow></lgray>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <lgray>¡Se han eliminado <lyellow>%amount%</lyellow> %type% de tu experiencia!</lgray>
      - '<lgray>Nuevo nivel: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Experiencia total: <lyellow>%total%</lyellow></lgray>'
      - ' '
    Set:
      Desc: Establecer puntos o niveles de experiencia.
      Info:
      - <noprefix>
      - ' '
      - <lgray>Se establecieron <lyellow>%amount%</lyellow> %type% para <lyellow>%player_display_name%</lyellow>.</lgray>
      - '<lgray>Nuevo nivel: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Experiencia total: <lyellow>%total%</lyellow></lgray>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <lgray>¡Se han establecido <lyellow>%amount%</lyellow> %type% como tu experiencia!</lgray>
      - '<lgray>Nuevo nivel: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Experiencia total: <lyellow>%total%</lyellow></lgray>'
      - ' '
    View:
      Desc: Ver estado de experiencia.
      Info:
        Info:
        - <noprefix>
        - ' '
        - <lyellow><b>Experiencia de %player_display_name%:</b></lyellow>
        - '<lgray>Nivel: <lyellow>%level%</lyellow></lgray>'
        - '<lgray>Experiencia total: <lyellow>%total%</lyellow></lgray>'
        - '<lgray>Para el siguiente nivel: <lyellow>%max%</lyellow></lgray>'
        - ' '
    Root:
      Desc: Experience commands.
    AddLevel:
      Desc: Add XP levels.
      Feedback: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have added <soft_green>%value%</soft_green> XP levels to <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have been given <soft_green>%value%</soft_green> XP levels.</gray>'
    SetLevel:
      Desc: Set XP levels.
      Feedback: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have set <white>%player_display_name%</white>''s XP level to <soft_yellow>%value%</soft_yellow> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>Your XP level has been set to <soft_yellow>%value%</soft_yellow>.</gray>'
    RemoveLevel:
      Desc: Remove XP levels.
      Feedback: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have took <soft_red>%value%</soft_red> XP levels from <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have been taken <soft_red>%value%</soft_red> XP levels.</gray>'
    AddXP:
      Desc: Add experience points.
      Feedback: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have added <soft_green>%value%</soft_green> XP to <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have been given <soft_green>%value%</soft_green> XP.</gray>'
    SetXP:
      Desc: Set experience points.
      Feedback: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have set <white>%player_display_name%</white>''s total XP to <soft_yellow>%value%</soft_yellow> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>Your total XP has been set to <soft_yellow>%value%</soft_yellow>.</gray>'
    RemoveXP:
      Desc: Remove experience points.
      Feedback: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have took <soft_red>%value%</soft_red> XP from <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have been taken <soft_red>%value%</soft_red> XP.</gray>'
  Enderchest:
    Clear:
      Desc: Limpiar cofre ender.
      Done:
        Target:
        - <sound:"block_fire_extinguish">
        - <lgray>¡Se limpió el cofre ender de <lyellow>%player_display_name%</lyellow>!</lgray>
        Notify:
        - <sound:"block_fire_extinguish">
        - <lgray>¡Tu cofre ender se ha limpiado!</lgray>
    Copy:
      Desc: Copiar cofre ender de un jugador.
      Done:
        Executor:
        - <sound:"item_armor_equip_leather">
        - <lgray>Se copió el cofre ender de <lyellow>%player_display_name%</lyellow>.</lgray>
        Others:
        - <sound:"item_armor_equip_leather">
        - <lgray>Se copió el contenido del cofre ender de <lyellow>%source%</lyellow> al cofre ender de <lyellow>%target%</lyellow>.</lgray>
    Fill:
      Desc: Llenar el cofre ender con el objeto especificado.
      Done:
        Executor:
        - <sound:"entity_item_pickup">
        - <lgray>Se llenó el cofre ender de <lyellow>%player_display_name%</lyellow> con <lyellow>%item%</lyellow>.</lgray>
    Open:
      Desc: Abrir cofre ender.
      Done:
        Executor:
        - <sound:"block_ender_chest_open">
        - <lgray>Se abrió el cofre ender de <lyellow>%player_display_name%</lyellow>.</lgray>
      Notify: '[sound="minecraft:block.ender_chest.open;0.8;1.0"]<gray>You have opened your <soft_purple>Ender Chest.</soft_purple></gray>'
      Targetted: '[sound="minecraft:block.ender_chest.open;0.8;1.0"]<gray>You have opened <white>%player_display_name%</white>''s <soft_purple>Ender Chest.</soft_purple></gray>'
    Repair:
      Desc: Reparar todos los objetos del cofre ender.
      Notify:
      - <sound:"block_anvil_use">
      - <lgray>¡Se repararon todos los objetos del cofre ender!</lgray>
      Target:
      - <sound:"block_anvil_use">
      - <lgray>¡Se repararon todos los objetos del cofre ender de <lyellow>%player_display_name%</lyellow>!</lgray>
    Hub:
      Desc: Ender Chest commands.
  Hat:
    Desc: Poner un objeto en la cabeza.
    Done:
    - <sound:"item_armor_equip_leather">
    - <lgray>¡Disfruta de tu nuevo sombrero!</lgray>
    EmptyHand: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>You must hold an item in your hand to equip it!</gray>'
  Fly:
    Desc: Activar/desactivar vuelo.
    Target: <lgray>Se configuró el vuelo para <lyellow>%player_display_name%</lyellow> en <lyellow>%state%</lyellow>.</lgray>
    Notify: <lgray>Vuelo <lyellow>%state%</lyellow>.</lgray>
    Root:
      Desc: Fly commands.
    Toggle:
      Desc: Toggle fly.
    'On':
      Desc: Enable fly.
    'Off':
      Desc: Disable fly.
  FlySpeed:
    Desc: Cambiar la velocidad de vuelo.
    Done:
      Notify: <lgray>Tu velocidad de vuelo se ha establecido en <lyellow>%amount%</lyellow>.</lgray>
      Target: <lgray>Se estableció la velocidad de vuelo en <lyellow>%amount%</lyellow> para <lyellow>%player_display_name%</lyellow>.</lgray>
  Fire:
    Set:
      Desc: Establecer ticks de fuego.
      Info: '<lgray>Se establecieron los ticks de fuego de <lyellow>%player_display_name%</lyellow> en <lyellow>%amount%</lyellow>, es decir, se incendió durante: <lyellow>%time%</lyellow>s.</lgray>'
      Target: <lgray>Has sido incendiado durante <lyellow>%time%</lyellow>s.</lgray>
    Reset:
      Desc: Restablecer ticks de fuego.
      Info:
      - <sound:"block_fire_extinguish">
      - <lgray>Se restableció el valor de los ticks de fuego de <lyellow>%player_display_name%</lyellow>, es decir, se extinguió.</lgray>
      Target:
      - <sound:"block_fire_extinguish">
      - <lgray>Has sido extinguido.</lgray>
  Food:
    Add:
      Desc: Añadir puntos de comida.
    Set:
      Desc: Establecer el nivel de comida.
      Target: <lgray>Se estableció el nivel de comida de <lyellow>%player_display_name%</lyellow> en <lyellow>%amount%</lyellow>.</lgray>
      Notify: <lgray>Tu nivel de comida se ha establecido en <lyellow>%amount%</lyellow>.</lgray>
    Remove:
      Desc: Quitar puntos de comida.
    Restore:
      Desc: Restaurar el nivel de comida.
      Notify:
      - <sound:"entity_generic_eat">
      - <lgray>¡Se ha restaurado tu nivel de comida!</lgray>
      Info:
      - <sound:"entity_generic_eat">
      - <lgray>¡Se restauró el nivel de comida de <lyellow>%player_display_name%</lyellow>!</lgray>
    Give:
      Target: '<lgray>Se agregaron <lyellow>%amount%</lyellow> puntos de comida a <lyellow>%player_display_name%</lyellow>. Nuevo nivel de comida: <lyellow>%current%</lyellow>.</lgray>'
      Notify: <lgray>Tu nivel de comida ha aumentado en <lyellow>%amount%</lyellow>.</lgray>
    Take:
      Target: '<lgray>Se quitaron <lyellow>%amount%</lyellow> puntos de comida a <lyellow>%player_display_name%</lyellow>. Nuevo nivel de comida: <lyellow>%current%</lyellow>.</lgray>'
      Notify: <lgray>Tu nivel de comida ha disminuido en <lyellow>%amount%</lyellow>.</lgray>
    Root:
      Desc: Food level commands.
  Grindstone:
    Desc: Abrir piedra de afilar portátil.
    Notify:
    - <output:"action_bar">
    - <lgray>Abriste la piedra de afilar.</lgray>
    Target: <lgray>Se abrió la piedra de afilar para <lyellow>%player_display_name%</lyellow>.</lgray>
  GameMode:
    Type:
      Desc: Establecer modo de juego en %type%.
    Notify: <lgray>Tu modo de juego se ha establecido en <lyellow>%type%</lyellow>.</lgray>
    Target: <lgray>Se estableció el modo de juego <lyellow>%type%</lyellow> para <lyellow>%player_display_name%</lyellow>.</lgray>
    Root:
      Desc: Game Mode commands.
  Health:
    Add:
      Desc: Añadir puntos de salud.
      Target: '<lgray>Se agregaron <lyellow>%amount%</lyellow> puntos de salud a <lyellow>%player_display_name%</lyellow>. Nueva salud: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>Obtuviste <lyellow>%amount%</lyellow> puntos de salud: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Set:
      Desc: Establecer puntos de salud.
      Target: '<lgray>Se establecieron <lyellow>%amount%</lyellow> puntos de salud para <lyellow>%player_display_name%</lyellow>. Nueva salud: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - <lgray>Tu salud se ha establecido en <lyellow>%amount%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Remove:
      Desc: Quitar puntos de salud.
      Target: '<lgray>Se quitaron <lyellow>%amount%</lyellow> puntos de salud a <lyellow>%player_display_name%</lyellow>. Nueva salud: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>Perdiste <lyellow>%amount%</lyellow> puntos de salud: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Restore:
      Desc: Restaurar salud.
      Notfiy: <lgray>¡Has sido curado!</lgray>
      Info: <lgray>El jugador <lyellow>%player_display_name%</lyellow> ha sido curado.</lgray>
    Root:
      Desc: Health commands.
    Revive:
      Feedback: '[sound="minecraft:item.totem.use;0.8;1.0"]<gray>You have been revived.</gray>'
      Notify: '[sound="minecraft:item.totem.use;0.8;1.0"]<gray>You have revived <white>%player_display_name%</white>.</gray>'
    TargetDead:
      Feedback: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray><white>%player_display_name%</white>''s health can not modified, because they are dead.</gray>'
      Notify: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>You can''t change your health while you are dead.</gray>'
  Ignore:
    Add:
      Desc: Añadir jugador a la lista negra.
      Done:
      - <noprefix>
      - <lyellow><b>¡Jugador bloqueado!</b></lyellow>
      - <lgray>Se agregó el jugador <lyellow>%player_display_name%</lyellow> a la lista negra.</lgray>
      - <lgray>Puedes cambiar la configuración o desbloquearlos usando <lyellow>/ignorelist</lyellow></lgray>
      Error:
        AlreadyIn: <lgray>El jugador ya está bloqueado.</lgray>
    List:
      Desc: Abrir la lista negra de jugadores.
    Remove:
      Desc: Eliminar jugador de la lista negra.
      Done: <lgray>El jugador <lyellow>%player_name%</lyellow> ha sido desbloqueado.</lgray>
      Error:
        NotIn: <lgray>El jugador no está bloqueado.</lgray>
  Inventory:
    Clear:
      Desc: Limpiar inventario.
      Done:
        Target:
        - <sound:"block_fire_extinguish">
        - <lgray>¡Se limpió el inventario de <lyellow>%player_display_name%</lyellow>!</lgray>
        Notify:
        - <sound:"block_fire_extinguish">
        - <lgray>¡Tu inventario se ha limpiado!</lgray>
    Copy:
      Desc: Copiar inventario de un jugador.
      Done:
        Notify:
        - <sound:"item_armor_equip_leather">
        - <lgray>Se copió el inventario de <lyellow>%player_display_name%</lyellow>.</lgray>
        Target:
        - <sound:"item_armor_equip_leather">
        - <lgray>Se copió el inventario de <lyellow>%source%</lyellow> al inventario de <lyellow>%target%</lyellow>.</lgray>
    Fill:
      Desc: Llenar el inventario con objetos específicos.
      Done:
      - <sound:"entity_item_pickup">
      - <lgray>Se llenó el inventario de <lyellow>%player_display_name%</lyellow> con <lyellow>%item%</lyellow>.</lgray>
    Open:
      Desc: Abrir el inventario de un jugador.
      Done:
      - <sound:"block_chest_open">
      - <lgray>Se abrió el inventario de <lyellow>%player_display_name%</lyellow>.</lgray>
    Repair:
      Desc: Reparar todos los objetos del inventario.
      Notify:
      - <sound:"block_anvil_use">
      - <lgray>¡Se repararon todos los objetos del inventario!</lgray>
      Target:
      - <sound:"block_anvil_use">
      - <lgray>¡Se repararon todos los objetos del inventario de <lyellow>%player_display_name%</lyellow>!</lgray>
    Root:
      Desc: Inventory management commands.
  Item:
    Amount:
      Desc: Cambiar la cantidad de objetos.
      Done:
      - <sound:"entity_item_pickup">
      - <lgray>Se estableció la cantidad de la pila de <lyellow>%item%</lyellow> en x<lyellow>%amount%</lyellow>.</lgray>
    Damage:
      Desc: Cambiar el daño del objeto.
      Done:
      - <sound:"block_anvil_use">
      - <lgray>Se estableció el daño de <lyellow>%item%</lyellow> en <lyellow>%amount%</lyellow>.</lgray>
    Enchant:
      Desc: (Des)encantar un objeto en la mano.
      Done:
        Enchanted:
        - <sound:"block_enchantment_table_use">
        - <lgray>¡<lyellow>%item%</lyellow> encantado con <lyellow>%name% %level%</lyellow>!</lgray>
        Disenchanted:
        - <sound:"block_enchantment_table_use">
        - <lgray>¡Se ha eliminado el encantamiento <lyellow>%name%</lyellow> de <lyellow>%item%</lyellow>!</lgray>
      Error:
        NotCompatible: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray><soft_red>%enchantment%</soft_red> is not compatible with <white>%item%</white>.</gray>'
        Overpowered: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>Max. level for <soft_red>%enchantment%</soft_red> enchantment is <soft_red>%level%</soft_red>.</gray>'
    Get:
      Desc: Obtener la pila de objetos especificada.
      Done:
      - <sound:"entity_item_pickup">
      - <lgray>¡Obtuviste <lyellow>x%amount% %type%</lyellow>!</lgray>
    Give:
      Desc: Dar la pila de objetos especificada a un jugador.
      Done:
      - <sound:"entity_item_pickup">
      - <lgray>¡Se agregaron <lyellow>x%amount% %type%</lyellow> a <lyellow>%player_display_name%</lyellow>!</lgray>
      Notify:
      - <sound:"entity_item_pickup">
      - <lgray>¡Se han agregado <lyellow>x%amount% %type%</lyellow> a tu inventario!</lgray>
    Take:
      Desc: Quitar objeto a un jugador.
      Done:
      - <sound:"entity_glow_item_frame_remove_item">
