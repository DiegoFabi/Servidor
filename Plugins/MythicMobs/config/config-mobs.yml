Configuration:
  MobDrops:
    DefaultDropMethod: VANILLA
    DoLootsplosionByDefault: false
    DoHologramNameByDefault: false
    DoItemGlowByDefault: false
    DoItemBeamByDefault: false
    DoItemVFXByDefault: false
    DefaultItemVFX:
      Material: POTION
      Model: 1
    DoPerPlayerDropsByDefault: false
    DoClientsideDropsByDefault: false
    MinimumDamagePercentForDrops: 1%
    DefaultDeathHologram: []
    DefaultLeaderboardTimeout: 6000
    DefaultDeathChatMessage: []
  MobEggs:
    Material: PIG_SPAWN_EGG
    DefaultDisplay: <mob.name> Spawn Egg
    DefaultLore:
    - <dark_gray>A Mythical Egg that can</dark_gray>
    - <dark_gray>be used to resurrect a</dark_gray>
    - <dark_gray><mob.name></dark_gray>
    Model: 0
  Mobs:
    CancelDamageIfZero: false
    KillMessagePrefix: ''
  DefaultMobOptions:
    Despawn: true
    PreventOtherDrops: false
    PreventVanillaDamage: false
  Holograms:
    GlobalOffset: 0.15
    CastBar:
      InfoBackground: 0,0,0,0
      InfoBillboarding: VERTICAL
      CastBackground: 0,0,0,0
      CastBillboarding: VERTICAL
      Offset: 1
    HealthBar:
      Background: 0,0,0,0
      Billboarding: VERTICAL
      Offset: -0.05
      Length: 50
      Scale: 0.4,0.4,0.4
    Nameplate:
      Background: 0,0,0,60
      Billboarding: VERTICAL
      Offset: 0
    Speech:
      Background: 100,100,100,60
      Billboarding: VERTICAL
      LinePrefix: <white>
      Offset: 0.4
  MobLeveling:
    # Élites (pack Elites, niveles 1-250). Lineal para que el nivel 250 no se
    # dispare: vida x9,7 y daño x4 al nivel 250. Solo afecta a mobs con nivel > 1.
    ScalingEquations:
      Health: V * (1 + (L-1) * 0.035)
      Damage: V * (1 + (L-1) * 0.012)
    DefaultLevelModifiers:
      Health: 0.1
      Armor: 0
      Damage: 0
      KnockbackResistance: 0
      Power: 0
    WorldScaling:
      Default:
        Enabled: true
        ScaleVanillaMobs: true
        PerBlocksFromSpawn: 250
      # Nivel de los élites según la distancia al spawn del mundo:
      # survivalMain 1 nivel cada 32 bloques (nivel 250 a ~8000 bloques),
      # nether 1 cada 4 (escala 1:8) y end 1 cada 24.
      survivalMain:
        Enabled: true
        PerBlocksFromSpawn: 32
      world_nether:
        Enabled: true
        PerBlocksFromSpawn: 4
      world_the_end:
        Enabled: true
        PerBlocksFromSpawn: 24
