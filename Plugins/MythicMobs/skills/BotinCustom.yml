# =====================================================================
# BOTÍN CUSTOM (items de ItemJoin, no son items de Skript).
# Se entrega al jugador que mata al mob (onDeath -> @trigger). Si el creeper
# explota solo o lo mata otra cosa, no hay botín (TargetConditions isplayer).
# Común 10-15% · Raro 2-5% · Mítico 0.5-1%. Nada de cuero ni carne.
# =====================================================================

# Común a todos los creepers custom: restos de la explosión
Botin_Creeper_Base:
  TargetConditions:
  - isplayer true
  Skills:
  - command{c="itemjoin get botin_ender_powder <target.name> 1";asop=false} @target 0.02
  - command{c="itemjoin get botin_wither_dust <target.name> 1";asop=false} @target 0.003

