# -- Spawn & Death -- # 

bl_frankie_spawn:
  Skills:
  - defaultstate{t=idle;s=not_active} @self 
  - lockmodel{l=true;delay=2} @self
  - setspeed{s=0} @self 
  - addtag{t=bl_frankie_not_active} @self
  - partvis{mid=bl_frankie;p=stars;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=electrical;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=electrical_eyes;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=wave;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=wave_electrical;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=explosion;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=dust;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=vomiting;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=pan4;v=false;child=true} @self
  - partvis{mid=bl_frankie;p=vomiting_ball10;v=false;child=true} @self
  - BodyClamp{mh=25;rde=0;rdu=0} @self
  
bl_frankie_death:
  Skills:
  - sound{s=bl_frankie.vomiting;v=3;p=0.7;delay=1} @self
  - sound{s=bl_frankie.step_walk;v=3;p=0.9;delay=10} @self
  - sound{s=bl_frankie.step_walk;v=3;p=0.7;delay=18} @self
  - sound{s=bl_frankie.slime;v=3;p=0.9;delay=3} @self

bl_frankie_tesla_death:
  Skills:
  - sound{s=bl_frankie.woosh_projectile;v=3;p=1.2;delay=2} @self
  - sound{s=bl_frankie.step_walk;v=3;p=0.7;delay=6} @self

# -- States -- # 

bl_frankie_active:
  Cooldown: 10
  Conditions:
  - targetwithin{d=20} true
  - hastag{t=bl_frankie_active} false
  Skills:
  - gcd{ticks=135} @self
  - setspeed{s=0} @self
  - state{s=active} @self
  - sound{s=bl_frankie.step_walk;v=3;p=0.8;delay=20} @self
  - sound{s=bl_frankie.slime;v=3;p=0.6;delay=55} @self
  - lockmodel{l=false;delay=110} @self 
  - defaultstate{t=idle;s=idle} @self
  - addtag{t=bl_frankie_active} @self
  - delay 135
  - removetag{t=bl_frankie_not_active} @self
  - setspeed{s=0.8} @self

bl_frankie_phase2:
  Conditions:
  - offgcd
  - hastag{t=bl_frankie_phase2} false
  - health{h=<250} true
  - targetwithin{d=32} true
  Skills:
  - gcd{ticks=12} @self
  - state{s=transformation} @self
  - setspeed{s=0} @self
  - sound{s=bl_frankie.electro1;v=3;p=0.8;delay=5} @self
  - partvis{mid=bl_frankie;p=electrical;v=true;child=true;delay=5} @self
  - partvis{mid=bl_frankie;p=electrical_eyes;v=true;child=true;delay=5} @self
  - partvis{mid=bl_frankie;p=eyes;v=false;child=true;delay=5} @self
  - addtag{t=bl_frankie_phase2} @self
  - delay 12
  - setspeed{s=0.8} @self
  
# -- General -- # 

bl_frankie_phase1_skills:
  Conditions:
  - hastag{t=bl_frankie_phase2} false
  - hastag{t=bl_frankie_not_active} false
  Skills:
  - randomskill{s=bl_frankie_pan_hit,bl_frankie_hand_hit,bl_frankie_mucus_clot,bl_frankie_burping,bl_frankie_grab_try,bl_frankie_ass_explosion} @target
  
bl_frankie_phase2_skills:
  Conditions:
  - hastag{t=bl_frankie_phase2} true
  Skills:
  - randomskill{s=bl_frankie_pan_hit,bl_frankie_hand_hit,bl_frankie_mucus_clot,bl_frankie_burping,bl_frankie_grab_try,bl_frankie_ass_explosion_p2,bl_frankie_tesla} @target

bl_frankie_step:
  Conditions:
  - moving true
  - inblock{b=WATER,LAVA} false
  - offgcd
  Skills:
  - randomskill{s=bl_frankie_step1,bl_frankie_step2}
  
bl_frankie_step1:
  Skills:
  - sound{s=bl_frankie.step_walk;v=3;p=1} @self
  
bl_frankie_step2:
  Skills:
  - sound{s=bl_frankie.step_walk;v=3;p=0.9} @self

bl_frankie_hurt:
  Conditions:
  - offgcd
  - chance{c=0.6} true
  Skills:
  - randomskill{s=bl_frankie_hurt1,bl_frankie_hurt2}

bl_frankie_hurt1:
  Skills:
  - sound{s=bl_frankie.punching;v=3;p=0.9} @self
  
bl_frankie_hurt2:
  Skills:
  - sound{s=bl_frankie.punching;v=3;p=0.8} @self

