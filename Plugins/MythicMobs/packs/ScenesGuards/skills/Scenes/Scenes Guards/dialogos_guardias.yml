# ============================================================
#  dialogos_guardias.yml - Diálogos aleatorios de los NPCs del pack ScenesGuards
#  Clic derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Hologramas sobre el NPC (hologramas_guardias.yml) + partículas.
#   - Voz de aldeano según la respuesta (yes / no / trade / ambient)
#     con un tono propio por rol.
#   - Chat solo para el jugador que interactuó (message @trigger).
#  Uso en el mob:  - skill{s=dialogo_<rol>} @trigger ~onInteract
#  Anti-duplicado: cooldown invisible de 5 s por NPC (variable caster.dialogo_cd).
#  Sin temporizadores: solo al interactuar.
# ============================================================

# ---------- ⛨ Guardia | paleta #C3D3EA -> #5B7DB1 ----------
# NPCs: scene_guard_stand, scene_guard_interactive, scene_guard_salute, scene_guard_salute_2, scene_guard_walk_1, scene_guard_walk_2, scene_guard_walk_3, scene_guard_march_1, scene_guard_march_2, scene_guard_march_3, scene_guards_duo
dialogo_guardia:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - sound{s=item.armor.equip_iron;v=0.5;p=1} @self
  - particles{p=crit;a=10;hs=0.4;vs=0.3;y=2.2} @self
  - randomskill{s=dialogo_guardia_frase1,dialogo_guardia_frase2,dialogo_guardia_frase3,dialogo_guardia_frase4,dialogo_guardia_frase5,dialogo_guardia_frase6} @trigger

dialogo_guardia_frase1:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.85} @self
  - skill{s=scene_bocadillo_quitar} @Passenger
  - summonpassenger{type=scene_bocadillo} @self
  - settextdisplay{text="<#5B7DB1>⛨ <gradient:#C3D3EA:#5B7DB1>Guardia</gradient> <#5B7DB1>⛨<newline><#EEF2F9>Todo tranquilo por aquí. Como debe<newline><#EEF2F9>ser.";delay=1} @Passenger
  - message{m="<#5B7DB1>⛨ <gradient:#C3D3EA:#5B7DB1>Guardia</gradient> <dark_gray>» <#EEF2F9>Todo tranquilo por aquí. Como debe ser."} @trigger

