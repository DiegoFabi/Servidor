  - summon{m=holo_guardia_f2_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_guardia_f2_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#5B7DB1>⛨ <gradient:#C3D3EA:#5B7DB1><bold>Guardia</bold></gradient> <dark_gray>» <#EEF2F9>Circula, viajero. Y nada de problemas, ¿eh?"} @trigger

