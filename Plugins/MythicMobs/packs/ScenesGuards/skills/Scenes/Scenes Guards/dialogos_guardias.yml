  - sound{s=entity.villager.no;v=0.8;p=0.85} @self
  - summon{m=holo_guardia_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_guardia_f4_l1;a=1} @selflocation{y=2.35}
  - message{m="<dark_gray>┃ <#5B7DB1>⛨ <gradient:#C3D3EA:#5B7DB1><bold>Guardia</bold></gradient> <dark_gray>» <#EEF2F9>Si ves algo sospechoso, avísame."} @trigger

dialogo_guardia_frase5:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.85} @self
