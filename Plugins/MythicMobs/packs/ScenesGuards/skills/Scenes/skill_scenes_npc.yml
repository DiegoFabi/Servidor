movescene:
  Skills:
  - teleportto{location=@selflocation} @target
  - matchrotation{target=@selflocation} @target
  
deletenpc:
  Skills:
  - remove @target

rotatescene:
  Skills:
  - matchrotation{target=@selflocation} @target

scene_openmenu:
  TargetConditions:
  - crouching true
  Skills:
  - command{command="dm open scene_edit <trigger.name>"}

