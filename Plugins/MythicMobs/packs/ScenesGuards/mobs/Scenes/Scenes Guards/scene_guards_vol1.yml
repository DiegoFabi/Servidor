  - changepart{m=scene_guards;pid=left_item;nm=<global.var.leftitem<caster.uuid>>;npid=left_item;delay=20} @self ~onLoad
  - changepart{m=scene_guards;pid=backpack;nm=<global.var.backpack<caster.uuid>>;npid=backpack;delay=20} @self ~onLoad
  - changepart{m=scene_guards;pid=hat;nm=<global.var.hat<caster.uuid>>;npid=hat;delay=20} @self ~onLoad
  - changepart{m=scene_guards;pid=left_pant;nm=<global.var.leftpant<caster.uuid>>;npid=left_pant;delay=20} @self ~onLoad
  - changepart{m=scene_guards;pid=right_pant;nm=<global.var.rightpant<caster.uuid>>;npid=right_pant;delay=20} @self ~onLoad
  - skill{s=scene_openmenu} ~onInteract
  - skill{s=dialogo_guardia} @trigger ~onInteract
  - cancelevent{sync=true} @self ~onDamaged
