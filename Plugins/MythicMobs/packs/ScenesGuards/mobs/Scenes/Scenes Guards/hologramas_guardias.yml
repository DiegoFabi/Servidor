# ============================================================
#  hologramas_guardias.yml - Hologramas de los NPCs del pack ScenesGuards
#  Armor stands invisibles tipo marcador (sin hitbox) que solo
#  muestran su nombre; se borran solos y no se guardan al reiniciar.
#  Cada rol tiene su paleta e icono propios.
#  Nombres:  holo_<rol>_nombre  |  holo_<rol>_f<frase>_l<linea>
#  Los usa: dialogos_guardias.yml
# ============================================================

# ---------- ⛨ Guardia (scene_guard_stand, scene_guard_interactive, scene_guard_salute, scene_guard_salute_2, scene_guard_walk_1, scene_guard_walk_2, scene_guard_walk_3, scene_guard_march_1, scene_guard_march_2, scene_guard_march_3, scene_guards_duo) | paleta #C3D3EA -> #5B7DB1 ----------
holo_guardia_nombre:
  Type: ARMOR_STAND
  Display: '<#5B7DB1>⛨ <gradient:#C3D3EA:#5B7DB1><bold>Guardia</bold></gradient> <#5B7DB1>⛨'
  Health: 1
  Options:
    Invisible: true
    Marker: true
    HasGravity: false
    CanMove: false
    Collidable: false
    Invincible: true
    Silent: true
    AlwaysShowName: true
    Despawn: true
    Persistent: false
  Skills:
  - remove{delay=70} @self ~onSpawn


