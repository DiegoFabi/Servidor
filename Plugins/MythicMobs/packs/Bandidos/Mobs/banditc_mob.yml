  - sound{s=entity.pillager.hurt;p=1.25;v=1} @selflocation ~onDamaged 1 #Hurtmechanic SOUND
  - skill{s=hurt1banditemc} @self ~onDamaged 0.92 #Hurtmechanic

  - velocity{m=set;x=0;y=0;z=0} @self ~onDamaged
