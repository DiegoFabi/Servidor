  - skill{s=pulling1_banditemc;delay=0} @Trigger ~onSignal:DEBUG_TEST 1
  - skill{s=banditemc_rage_trigger;delay=0} @Trigger ~onSignal:DEBUG_TEST2 1
  
  - CancelEvent{sync=true} @self ~onAttack 1 #CANCEL ATTACKS
  - CancelEvent{sync=true} @self ~onShoot 1 #CANCEL ATTACKS

#  - skill{s=meleebanditemctrigger;sync=false} @LivingInCone{a=110.0;r=6.5;rot=0.0;ignore=samefaction} ~onTimer:30 0.56 ?!variableEquals{var=caster.parrying;value="1"} ###### 0.6
