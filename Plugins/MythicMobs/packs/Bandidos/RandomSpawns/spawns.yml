# Probabilidades x1,5 (aumento moderado de mobs custom; máx. 0,6)
# Bandidos: grupos en caminos y zonas abiertas de survivalMain (sustituyen a parte de los
# zombis/esqueletos/saqueadores). Máx. 3 en 48 bloques. Priority 300 (no son élites).
banditema1_em_natural:
  Type: banditema1_em
  Worlds: survivalMain
  Chance: 0.018
  Priority: 300
  Action: REPLACE
  UseWorldScaling: false
  Biomes: PLAINS,SUNFLOWER_PLAINS,SAVANNA,SAVANNA_PLATEAU,BADLANDS,WOODED_BADLANDS,DESERT,TAIGA,MEADOW,FOREST
  Conditions:
  - entitytype{t=ZOMBIE,SKELETON,HUSK,PILLAGER} true
  - outside true
  - mobsinradius{t=banditema1_em,banditema2_em,banditema3_em,banditema_em,banditemb1_em,banditemb2_em,banditemb3_em,banditemb_em,banditemc1_em,banditemc2_em,banditemc3_em,banditemc_em;a=<3;r=48} true

