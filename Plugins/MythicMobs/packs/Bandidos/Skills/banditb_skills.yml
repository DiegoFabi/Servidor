    - DefaultState{type=WALK;state=walk_combat;li=10;lo=15} @self
    - DefaultState{type=IDLE;state=idle_combat;li=14;lo=15;delay=1} @self
    - setspeed{speed=1;type=walking} @self];sync=true} @self 0.16 ############## 0.25

