#RAGETRIGGERS

banditemb_rage_trigger:
  Cooldown: 10
  Conditions:
  - variableEquals{var=caster.skillxd;value="hurtedvbad"} false
  - stance{s=casting} false
  - stance{s=normal} true
  - variableEquals{var=caster.hurtened;value="1"} false
  - variableEquals{var=caster.skillxd;value="decapitation"} false
  - variableEquals{var=caster.casting;value="1"} false
#  - variableInRange{var=caster.runstacks;value=>5} true
  Skills:
  - sound{s=entity.pillager.celebrate;p=<random.float.0.9to1.1>;v=1.5;delay=2} @SelfLocation
  - potion{type=SLOW;duration=1;level=0;p=false;force=true} @Self

  - look{headOnly=false;immediately=false;repeat=10;repeatInterval=1} @TargetedTarget

  - Aura{auraName=shielderbanditemb;onTick=banditemb_sdppcheck;interval=7;duration=140;mergeSameCaster=true} @self 0.8
  - DefaultState{type=WALK;state=walk_fast;li=10;lo=10} @self ?!variableEquals{var=caster.running;value="2"} ?!variableEquals{var=caster.running;value="1"}
  - setspeed{speed=1.45;type=walking} @Self ?!variableEquals{var=caster.running;value="2"} ?!variableEquals{var=caster.running;value="1"}
  - Aura{desot=true;auraName=checkragebanditemb;onTick=banditemb_rageproximitycheck;onEnd=banditemb_rageproximitycheckEND;interval=15;duration=400} @self
  - setvariable{var=caster.ragestacks;value="11";t=integer} @Self ?variableInRange{var=caster.ragestacks;value=<10}
  - setvariable{var=caster.rage;value="1";t=integer} @Self
  - delay 34

  - randomskill{s=bruttack1_banditemb,bruttack1_banditemb,bruttack1_banditemb,bruttack2_banditemb,bruttack2_banditemb,bruttack4_banditemb;repeat=3;repeatinterval=6} @LivingInCone{a=110.0;r=5;rot=0.0;ignore=samefaction} 0.5

  


banditemb_rageproximitycheck:
  Conditions:
  - targetwithin{d=4} castinstead banditemb_rageproximitycheckb
  - incombat orElseCast banditemb_rageproximitycheck_nocombat
  - variableInRange{var=caster.ragestacks;value=<1} castinstead banditemb_rageproximitycheckc
  Skills:
  - variablesubtract{var=caster.ragestacks;amount=1} @self 0.7
  - message{m="ragestax <caster.var.ragestacks> STACKS"} @PlayersNearOrigin{r=75} 0 #DEBUGMESSAGE
banditemb_rageproximitycheck_nocombat:
  Conditions:
  - variableEquals{var=caster.parrying;value="1"} true
  - incombat false
  Skills:
  - auraremove{aura=checkragebanditemb} @self
  - auraremove{aura=checkragebanditemb1b} @self
  - Aura{auraName=ragecooldown;duration=40} @self
  - effect:particles{particle=reddust;color=#e2eb32;amount=15;hS=0.1;vS=0.1;size=0.8;repeat=2;repeatinterval=1} @Origin{y=2.4} 0 #DEBUG
  - setvariable{var=caster.parrying;value="0";t=integer} @Self
  - state{state=parrying_to_normal;li=2;lo=3} @self
  - potion{type=SLOW;duration=8;level=5;p=false;force=true} @Self
  - DefaultState{type=WALK;state=walk;li=10;lo=15} @self ?!variableEquals{var=caster.running;value="2"} ?!variableEquals{var=caster.running;value="1"}
  - DefaultState{type=IDLE;state=idle;li=14;lo=15;delay=1} @self
  - setspeed{speed=1;type=walking} @self
