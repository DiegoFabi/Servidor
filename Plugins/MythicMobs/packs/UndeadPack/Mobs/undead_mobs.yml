

Ghoul:
  Type: ZOMBIE
  Display: "&6ɢʜᴏᴜʟ ᴅᴇ ɴɪᴇᴠᴇ  &7(&a<caster.level> ⇪ &7| &c<caster.hp{round=0}> ❤&7)"
  Health: 25
  Damage: 3
  Armor: 2
  LevelModifiers:
    Health: 0
    Armor: 0
    Damage: 0  #  Read more about it here https://git.mythiccraft.io/mythiccraft/MythicMobs/-/wikis/Mobs/Power
    KnockbackResistance: 0.1
    MovementSpeed: 0
    Power: 0
  Faction: Undead
  Options:
    PreventOtherDrops: true
    MovementSpeed: 0.23
    ShowHealth: true
    PreventRandomEquipment: true
    AlwaysShowName: true
    MovementSpeed: 0.2
    MaxCombatDistance: 25
    Despawn: true
    FollowRange: 25
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  AITargetSelectors:
  - clear
  - players
  Skills:
  - model{mid=ghoul;step=1;tint=false;usm=true} @self ~onSpawn
  - setstance{stance=Walking} @self
  - effect:sound{s=entity.husk.ambient;volume=0.75;pitch=0.8} @self ~onTimer:140 0.35
  - effect:sound{s=entity.husk.ambient;volume=0.75;pitch=1} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Ghoul_Attack} ~onTimer:20
  - skill{s=Ghoul_Dash} ~onTimer:40 0.7
  - skill{s=Ghoul_Hit} ~onDamaged
  - effect:sound{s=entity.player.attack.crit;volume=0.55;pitch=0.33} @self ~onDamaged
  Drops:
  - rotten_flesh 1-2 1
  - bone 1-2 0.6
  - snowball 1-3 0.5
  - iron_nugget 1-2 0.2

