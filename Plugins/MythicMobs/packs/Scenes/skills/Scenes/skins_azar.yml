# Skin al azar para cada NPC de Scenes (skin_1..skin_27 en ModelEngine/blueprints/Scenes/Scenes/Skins).
# Solo se elige una vez: se guarda en global.skin<uuid> igual que el editor de Scenes.
scene_skin_azar:
  Conditions:
  - variableisset{var=global.skin<caster.uuid>} false
  Skills:
  - randomskill{s=scene_skin_set_1,scene_skin_set_2,scene_skin_set_3,scene_skin_set_4,scene_skin_set_5,scene_skin_set_6,scene_skin_set_7,scene_skin_set_8,scene_skin_set_9,scene_skin_set_10,scene_skin_set_11,scene_skin_set_12,scene_skin_set_13,scene_skin_set_14,scene_skin_set_15,scene_skin_set_16,scene_skin_set_17,scene_skin_set_18,scene_skin_set_19,scene_skin_set_20,scene_skin_set_21,scene_skin_set_22,scene_skin_set_23,scene_skin_set_24,scene_skin_set_25,scene_skin_set_26,scene_skin_set_27} @self
scene_skin_set_1:
  Skills:
  - setvariable{var=global.skin<caster.uuid>;value=skin_1;type=STRING;save=true} @self
