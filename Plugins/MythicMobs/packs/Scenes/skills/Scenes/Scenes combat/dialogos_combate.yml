  - message{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <dark_gray>» <#FFE2E2>No se trata de golpear fuerte, sino de golpear bien."} @trigger

dialogo_luchador_frase4:
