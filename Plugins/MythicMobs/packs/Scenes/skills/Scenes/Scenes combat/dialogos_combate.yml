  - speak{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <#E04848>✠\n<#FFE2E2>Si quieres entrenar, espera tu\n<#FFE2E2>turno. Hay cola.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
