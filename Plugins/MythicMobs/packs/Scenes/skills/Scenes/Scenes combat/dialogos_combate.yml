  - sound{s=entity.villager.ambient;v=0.8;p=0.95} @self
  - speak{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <#E04848>✠\n<#FFE2E2>Mantén la guardia arriba, es lo\n<#FFE2E2>primero que se olvida.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <dark_gray>» <#FFE2E2>Mantén la guardia arriba, es lo primero que se olvida."} @trigger

