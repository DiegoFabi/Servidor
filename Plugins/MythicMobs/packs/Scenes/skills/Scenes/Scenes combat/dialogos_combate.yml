  - speak{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <#E04848>✠\n<#FFE2E2>Mi compañero es rápido, pero yo\n<#FFE2E2>aguanto más.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
