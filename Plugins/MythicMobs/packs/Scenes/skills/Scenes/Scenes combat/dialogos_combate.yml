# ============================================================
#  dialogos_combate.yml - Diálogos aleatorios de los NPCs del pack Scenes
#  Clic derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Hologramas sobre el NPC (hologramas_combate.yml) + partículas.
#   - Voz de aldeano según la respuesta (yes / no / trade / ambient)
#     con un tono propio por rol.
#   - Chat solo para el jugador que interactuó (message @trigger).
#  Uso en el mob:  - skill{s=dialogo_<rol>} @trigger ~onInteract
#  Anti-duplicado: cooldown invisible de 5 s por NPC (variable caster.dialogo_cd).
#  Sin temporizadores: solo al interactuar.
# ============================================================

# ---------- ✠ Luchador | paleta #FF9A9A -> #E04848 ----------
# NPCs: scene_combat_swords_dual, scene_combat_shields_dual, scene_combat_boxing_dual
dialogo_luchador:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - sound{s=entity.player.attack.sweep;v=0.5;p=1} @self
  - particles{p=crit;a=10;hs=0.4;vs=0.3;y=2.2} @self
  - randomskill{s=dialogo_luchador_frase1,dialogo_luchador_frase2,dialogo_luchador_frase3,dialogo_luchador_frase4,dialogo_luchador_frase5,dialogo_luchador_frase6} @trigger

dialogo_luchador_frase1:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=0.95} @self
  - speak{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <#E04848>✠\n<#FFE2E2>Otra ronda y descanso. Bueno, eso\n<#FFE2E2>dije hace tres rondas.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <dark_gray>» <#FFE2E2>Otra ronda y descanso. Bueno, eso dije hace tres rondas."} @trigger

dialogo_luchador_frase2:
