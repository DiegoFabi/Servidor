  - sound{s=entity.villager.yes;v=0.8;p=0.95} @self
  - speak{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <#E04848>✠\n<#FFE2E2>Mañana me va a doler todo, pero vale\n<#FFE2E2>la pena.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#E04848>✠ <gradient:#FF9A9A:#E04848>Luchador</gradient> <dark_gray>» <#FFE2E2>Mañana me va a doler todo, pero vale la pena."} @trigger

dialogo_luchador_frase5:
