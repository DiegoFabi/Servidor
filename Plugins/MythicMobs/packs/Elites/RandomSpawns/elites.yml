# ============================================================
#  Conversión natural: cada hostil vanilla que aparece de forma natural
#  se REEMPLAZA por su élite. Priority 1: las RandomSpawns de los demás
#  packs (prioridad x100) siguen teniendo preferencia.
#  Nivel = 1 + escala por distancia del mundo (config-mobs.yml).
# ============================================================
elite_zombie_natural:
  Type: elite_zombie
  Action: REPLACE
  Chance: 1
  Priority: 1
  Level: 1
  UseWorldScaling: true
  Worlds: survivalMain,world_nether,world_the_end
  Conditions:
  - entitytype{t=ZOMBIE} true

