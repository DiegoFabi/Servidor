# ============================================================
#  NÚCLEO DE ÉLITES: aparición, rango, nombre, tamaño, estilo,
#  equipo y reparto de poderes. Sin temporizadores por mob.
# ============================================================
elite_aparecer:
  Skills:
  - setlevel{a=add;l=<random.0to4>} @self
  - setlevel{a=set;l=250} @self ?level{l=>250}
  - skill{s=elite_rango} @self
  - skill{s=elite_nombre} @self
  - attribute{attribute=SCALE;a="0.86 + <caster.var.rango> * 0.07 + <random.0to8> / 100"} @self
  - skill{s=elite_estilo} @self
  - skill{s=elite_asignar_poderes} @self

# Rango (1-5) y color del nombre según el nivel
elite_rango:
  Skills:
  - setvariable{var=caster.rango;value=1;type=INTEGER} @self ?level{l=<25}
  - setvariable{var=caster.rango;value=2;type=INTEGER} @self ?level{l=25to74}
  - setvariable{var=caster.rango;value=3;type=INTEGER} @self ?level{l=75to124}
  - setvariable{var=caster.rango;value=4;type=INTEGER} @self ?level{l=125to189}
  - setvariable{var=caster.rango;value=5;type=INTEGER} @self ?level{l=>189}
  - setvariable{var=caster.color;value="<#9EE37D>";type=STRING} @self ?variableequals{var=caster.rango;value=1}
  - setvariable{var=caster.color;value="<#7FB2FF>";type=STRING} @self ?variableequals{var=caster.rango;value=2}
  - setvariable{var=caster.color;value="<#C38BFF>";type=STRING} @self ?variableequals{var=caster.rango;value=3}
  - setvariable{var=caster.color;value="<#FFB347>";type=STRING} @self ?variableequals{var=caster.rango;value=4}
  - setvariable{var=caster.color;value="<#FF5C5C>";type=STRING} @self ?variableequals{var=caster.rango;value=5}

# Nombre vanilla (solo se ve al mirarlo): "Nv 57 Zombi"
elite_nombre:
  Skills:
  - setname{n="<caster.var.color>Nv <caster.level> <white><caster.var.nombre>"} @self

# Al recibir daño: el nombre muestra la vida actual
elite_nombre_vida:
  Skills:
  - setname{n="<caster.var.color>Nv <caster.level> <white><caster.var.nombre> <#FF5C5C>❤ <caster.hp{round=0}><#7E848F>/<caster.mhp{round=0}>";delay=1} @self

# Estilo por rango: Legendario puede arder sin quemarse, Mítico brilla y corre más
elite_estilo:
  Skills:
  - skill{s=elite_fuego_eterno} @self ?level{l=>124} 0.35
  - potion{type=GLOWING;duration=2147483000;level=0;hasParticles=false;hasIcon=false} @self ?variableequals{var=caster.rango;value=5}
  - potion{type=SPEED;duration=2147483000;level=0;hasParticles=false;hasIcon=false} @self ?variableequals{var=caster.rango;value=5}
elite_fuego_eterno:
  Skills:
  - potion{type=FIRE_RESISTANCE;duration=2147483000;level=0;hasParticles=false;hasIcon=false} @self
  - ignite{ticks=2147483000} @self

# ---------- Eventos ----------
elite_al_atacar:
  Skills:
  - skill{s=elite_of} @target
elite_al_recibir:
  Skills:
  - skill{s=elite_nombre_vida} @self
  - skill{s=elite_def} @trigger
  - skill{s=elite_esp} @trigger
  - skill{s=elite_may} @trigger
elite_al_morir:
  Skills:
  - effect:particles{p=soul;a=10;hs=0.4;vs=0.6;s=0.03;y=0.8;vd=32} @self
  - skill{s=elite_muerte_mitica} @self ?variableequals{var=caster.rango;value=5}
elite_muerte_mitica:
  Skills:
  - effect:particlering{particle=soul_fire_flame;radius=1.6;points=20;amount=1;y=0.2;vd=32} @self
  - effect:particles{p=totem_of_undying;a=30;hs=0.6;vs=0.8;s=0.3;y=1;vd=32} @self
  - sound{s=entity.wither.death;v=0.6;p=1.6} @self

