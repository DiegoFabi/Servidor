# ============================================================
#  PODERES OFENSIVOS GENÉRICOS (al golpear o disparar)
#  Daño extra = 1 + nivel x 0,03 (nivel 250: +8,5). Efectos más largos con el rango.
#  Partículas: cantidades bajas y vd=32 (solo las ven jugadores cercanos).
# ============================================================
po_fuego:
  Skills:
  - ignite{ticks="40 + <caster.var.rango> * 20"} @target
  - effect:particlering{p=flame;r=1.1;points=14;a=1;y=0.1;vd=32} @target
  - effect:particles{p=lava;a=4;hs=0.3;vs=0.3;y=1;vd=32} @target
  - sound{s=item.firecharge.use;v=0.7;p=1.2} @target
po_hielo:
  Skills:
  - freeze{ticks="60 + <caster.var.rango> * 20"} @target
  - potion{type=SLOWNESS;duration="30 + <caster.var.rango> * 10";level=1;hasParticles=false} @target
  - effect:particlesphere{p=snowflake;r=1;a=24;vd=32} @target
  - sound{s=block.glass.break;v=0.6;p=1.6} @target
po_veneno:
