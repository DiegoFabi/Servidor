# ============================================================
#  BOTÍN DE ÉLITES Y JEFES (items de ItemJoin, al jugador que mata)
#  Mismo sistema que Skills/BotinCustom.yml de los mobs custom.
#  - Élites: botín de su familia (según el mob) + postres (todos) +
#    por rango: runas normales y pergaminos (Épico+), elixires y anillos
#    (Legendario+), runas poderosas y bastones (Mítico, muy raro).
#  - Jefes de evento: 3 premios garantizados + extras raros.
# ============================================================
elite_botin:
  TargetConditions:
  - isplayer true
  Skills:
  - skill{s=elite_botin_zombi} @target ?variableequals{var=caster.fam;value=zombi}
  - skill{s=elite_botin_esqueleto} @target ?variableequals{var=caster.fam;value=esqueleto}
  - skill{s=elite_botin_arana} @target ?variableequals{var=caster.fam;value=arana}
  - skill{s=elite_botin_creeper} @target ?variableequals{var=caster.fam;value=creeper}
  - skill{s=elite_botin_mago} @target ?variableequals{var=caster.fam;value=mago}
  - skill{s=elite_botin_ender} @target ?variableequals{var=caster.fam;value=ender}
  - skill{s=elite_botin_fuego} @target ?variableequals{var=caster.fam;value=fuego}
  - skill{s=elite_botin_illager} @target ?variableequals{var=caster.fam;value=illager}
  - skill{s=elite_botin_piglin} @target ?variableequals{var=caster.fam;value=piglin}
  - skill{s=elite_botin_agua} @target ?variableequals{var=caster.fam;value=agua}
  - skill{s=elite_botin_volador} @target ?variableequals{var=caster.fam;value=volador}
  - skill{s=elite_botin_plaga} @target ?variableequals{var=caster.fam;value=plaga}
  - randomskill{s=eb_postre_chocolate1,eb_postre_chocolate2,eb_postre_candy1,eb_postre_candy2,eb_postre_cake1,eb_postre_cake2,eb_postre_donut,eb_postre_icecream1,eb_postre_icecream2} @target 0.04
  - randomskill{s=eb_item_12,eb_item_32,eb_item_33,eb_item_34,eb_item_35,eb_item_36,eb_item_40,eb_item_41,eb_item_42,eb_item_43,eb_item_44,eb_item_45} @target ?level{l=>74} 0.03
  - randomskill{s=eb_item_20,eb_item_21,eb_item_22,eb_item_23,eb_item_15,eb_item_24,eb_item_25,eb_item_26,eb_item_27,eb_item_28,eb_item_37,eb_item_38,eb_item_39} @target ?level{l=>124} 0.025
  - randomskill{s=eb_item_46,eb_item_47,eb_item_48,eb_item_49,eb_item_50} @target ?level{l=>189} 0.01
  - randomskill{s=eb_item_6,eb_item_8,eb_item_13,eb_item_7} @target ?level{l=>189} 0.004

