# ============================================================
#  SELECTORES DE PODERES
#  Al aparecer se eligen los poderes del élite (variables) según el nivel:
#    of  (1-12)   ofensivo genérico      -> desde nivel 1, al ATACAR
#    def (1-7)    defensivo genérico     -> desde nivel 25, al RECIBIR daño
#    esp (texto)  especial de su familia -> desde nivel 75
#    may (texto)  mayor de su familia    -> desde nivel 125
#  Cada élite define esp1/esp2/may1/may2 en Mobs/elites.yml.
#  Los enfriamientos limitan cuántas partículas genera cada mob.
# ============================================================
elite_asignar_poderes:
  Skills:
  - randomskill{s=elite_of_1,elite_of_2,elite_of_3,elite_of_4,elite_of_5,elite_of_6,elite_of_7,elite_of_8,elite_of_9,elite_of_10,elite_of_11,elite_of_12} @self
  - randomskill{s=elite_def_1,elite_def_2,elite_def_3,elite_def_4,elite_def_5,elite_def_6,elite_def_7} @self ?level{l=>24}
  - setvariable{var=caster.esp;value="<caster.var.esp2>";type=STRING} @self ?level{l=>74}
  - setvariable{var=caster.esp;value="<caster.var.esp1>";type=STRING} @self ?level{l=>74} 0.5
  - setvariable{var=caster.may;value="<caster.var.may2>";type=STRING} @self ?level{l=>124}
  - setvariable{var=caster.may;value="<caster.var.may1>";type=STRING} @self ?level{l=>124} 0.5
  - skill{s=elite_def_pasivo} @self ?level{l=>24}

# Ofensivo: al golpear (máx. 1 cada 4 s por mob, 60 % de las veces)
elite_of:
  Cooldown: 3
  Skills:
  - skill{s=po_fuego} @target ?variableequals{var=caster.of;value=1} 0.75
  - skill{s=po_hielo} @target ?variableequals{var=caster.of;value=2} 0.75
  - skill{s=po_veneno} @target ?variableequals{var=caster.of;value=3} 0.75
  - skill{s=po_wither} @target ?variableequals{var=caster.of;value=4} 0.75
  - skill{s=po_debilidad} @target ?variableequals{var=caster.of;value=5} 0.75
  - skill{s=po_rayo} @target ?variableequals{var=caster.of;value=6} 0.75
  - skill{s=po_empuje} @target ?variableequals{var=caster.of;value=7} 0.75
  - skill{s=po_atraccion} @target ?variableequals{var=caster.of;value=8} 0.75
  - skill{s=po_gravedad} @target ?variableequals{var=caster.of;value=9} 0.75
  - skill{s=po_ceguera} @target ?variableequals{var=caster.of;value=10} 0.75
  - skill{s=po_mareo} @target ?variableequals{var=caster.of;value=11} 0.75
  - skill{s=po_descarga} @target ?variableequals{var=caster.of;value=12} 0.75

# Defensivo: al recibir daño (máx. 1 cada 6 s)
elite_def:
  Cooldown: 6
  Skills:
  - skill{s=pd_escudo} @trigger ?variableequals{var=caster.def;value=1} 0.5
  - skill{s=pd_anti_flechas} @trigger ?variableequals{var=caster.def;value=2} 0.5
  - skill{s=pd_invisibilidad} @trigger ?variableequals{var=caster.def;value=3} 0.5
  - skill{s=pd_curacion} @trigger ?variableequals{var=caster.def;value=4} 0.5
  - skill{s=pd_salto_lunar} @trigger ?variableequals{var=caster.def;value=5} 0.5
  - skill{s=pd_aura_helada} @trigger ?variableequals{var=caster.def;value=6} 0.5
  - skill{s=pd_piel_ignea} @trigger ?variableequals{var=caster.def;value=7} 0.5

# Efectos permanentes de algunos defensivos (se aplican una vez al aparecer)
elite_def_pasivo:
  Skills:
  - potion{type=JUMP_BOOST;duration=2147483000;level=1;hasParticles=false;hasIcon=false} @self ?variableequals{var=caster.def;value=5}
  - potion{type=FIRE_RESISTANCE;duration=2147483000;level=0;hasParticles=false;hasIcon=false} @self ?variableequals{var=caster.def;value=7}

