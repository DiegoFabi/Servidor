# ============================================================
#  PODERES ESPECIALES Y MAYORES DE FAMILIA (nivel 75+ y 125+)
#  @trigger = jugador que golpeó al élite. Daño escalado por nivel.
#  Los ataques fuertes avisan antes (círculo o sonido) para poder esquivarlos.
# ============================================================

# ---------- Invocaciones (límite: 4 esbirros en 16 bloques) ----------
pf_invocar_aliados:
  Conditions:
  - mobsinradius{types=elite_esbirro_zombi,elite_esbirro_esqueleto;a=<4;r=16} true
  Skills:
  - effect:particlering{p=soul;r=2;points=16;a=1;y=0.1;vd=32} @self
  - sound{s=entity.zombie_villager.converted;v=0.6;p=0.7} @self
  - summon{type=elite_esbirro_zombi;amount=2;radius=3;delay=15} @self
pf_horda:
  Conditions:
  - mobsinradius{types=elite_esbirro_zombi,elite_esbirro_esqueleto;a=<4;r=16} true
  Skills:
  - effect:particlering{p=soul_fire_flame;r=3;points=20;a=1;y=0.1;vd=32} @self
  - effect:particles{p=sculk_soul;a=12;hs=1.5;vs=0.3;y=0.2;vd=32} @self
  - sound{s=entity.warden.emerge;v=0.5;p=1.4} @self
  - summon{type=elite_esbirro_zombi;amount=2;radius=4;delay=20} @self
  - summon{type=elite_esbirro_esqueleto;amount=1;radius=4;delay=20} @self
pf_nido:
  Conditions:
  - mobsinradius{types=elite_esbirro_arana;a=<4;r=16} true
  Skills:
  - effect:particles{p=item_slime;a=14;hs=0.8;vs=0.2;y=0.2;vd=32} @self
  - sound{s=entity.spider.ambient;v=0.8;p=1.6} @self
  - summon{type=elite_esbirro_arana;amount=3;radius=2;delay=10} @self
pf_pilar_huesos:
  Skills:
  - sound{s=entity.skeleton.ambient;v=0.8;p=0.6}
  - summon{type=elite_marca_pilar;amount=1}

# ---------- Golpes de área ----------
pf_golpe_suelo:
  Skills:
  - velocity{m=SET;x=0;y=1;z=0} @self
  - sound{s=entity.ravager.roar;v=0.4;p=1.6} @self
  - skill{s=pf_golpe_suelo_impacto;delay=18} @self
pf_golpe_suelo_impacto:
  Skills:
  - effect:particlering{p=explosion;r=2.5;points=10;a=1;y=0.1;vd=32} @self
  - effect:particlering{p=cloud;r=3.5;points=20;a=1;y=0.1;vd=32} @self
  - damage{a="2 + <caster.level> * 0.04"} @PIR{r=4}
  - throw{velocity=4;velocityY=1} @PIR{r=4}
  - sound{s=entity.generic.explode;v=0.6;p=1.4} @self
pf_hinchazon:
  Skills:
  - attribute{attribute=SCALE;a="<caster.var.rango> * 0.07 + 1.4";duration=60} @self
  - effect:particles{p=item_slime;a=16;hs=0.6;vs=0.8;y=1;vd=32} @self
  - sound{s=entity.puffer_fish.blow_up;v=0.8;p=0.6} @self
  - skill{s=pf_hinchazon_estallido;delay=40} @self
pf_hinchazon_estallido:
  Skills:
  - effect:particles{p=explosion;a=3;hs=0.8;vs=0.5;y=1;vd=32} @self
  - throw{velocity=7;velocityY=1.4} @PIR{r=5}
  - damage{a="1 + <caster.level> * 0.03"} @PIR{r=5}
  - sound{s=entity.puffer_fish.blow_out;v=1;p=0.6} @self
pf_onda_explosiva:
  Skills:
  - effect:particlering{p=smoke;r=1.5;points=14;a=1;y=0.2;vd=32} @self
  - sound{s=entity.creeper.primed;v=1;p=0.6} @self
  - skill{s=pf_onda_explosiva_golpe;delay=25} @self
pf_onda_explosiva_golpe:
  Skills:
  - effect:particlering{p=explosion;r=3;points=8;a=1;y=0.3;vd=32} @self
  - damage{a="2 + <caster.level> * 0.05"} @PIR{r=4.5}
  - throw{velocity=6;velocityY=1.2} @PIR{r=4.5}
  - sound{s=entity.generic.explode;v=0.8;p=1} @self
pf_implosion:
  Skills:
  - effect:particles{p=reverse_portal;a=40;hs=2.5;vs=1;s=0.4;y=1;vd=32} @self
  - pull{velocity=5} @PIR{r=7}
  - sound{s=block.beacon.deactivate;v=0.8;p=1.6} @self
  - skill{s=pf_onda_explosiva_golpe;delay=20} @self
pf_pulso_helado:
  Skills:
  - effect:particlering{p=snowflake;r=1.5;points=14;a=1;y=0.2;vd=32} @self
  - effect:particlering{p=snowflake;r=3;points=22;a=1;y=0.2;delay=4;vd=32} @self
  - effect:particlering{p=snowflake;r=4.5;points=30;a=1;y=0.2;delay=8;vd=32} @self
  - freeze{ticks=100} @PIR{r=5}
  - potion{type=SLOWNESS;duration=60;level=2;hasParticles=false} @PIR{r=5}
  - sound{s=block.glass.break;v=1;p=0.6} @self

# ---------- Proyectiles ----------
