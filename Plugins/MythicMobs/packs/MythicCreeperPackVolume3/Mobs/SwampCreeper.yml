MSO_Creeper_Swamp:
  Type: CREEPER
  Display: '&aSwamp Creeper'
  Health: 20
  Damage: 30
  Drops:
  - GUNPOWDER 0-2 1
  - BONE 0-2 1
  Skills:
  - skill{s=Botin_Creeper_Swamp} @trigger ~onDeath
  - skill:MSO_CreeperPrime @self ~onPrime
  # Spawn model
  - model{m=creeper_swamp;n=false} @self ~onSpawn
  - potion{type=INVISIBILITY;delay=1;l=1;force=true} @Self ~onSpawn
  # Enchant the armor
  - enchant{m=creeper_swamp;pid=armor;en=true;em=false} @self ~onSpawn
  # Hide the armor on spawn
  - partvisibility{m=creeper_swamp;p=armor;v=false;em=false} @self ~onSpawn
  # Show the armor on charge
  - partvisibility{m=creeper_swamp;p=armor;v=true;em=false} @self ~onCharged