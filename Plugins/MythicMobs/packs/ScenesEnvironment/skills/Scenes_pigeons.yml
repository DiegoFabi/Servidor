
pigeons_fly:
  Cooldown: 240
  TargetConditions:
  - isplayer
  Conditions:
  - targets{a=>0}  
  # 5 s de gracia tras aparecer para que se vean al invocarlas cerca
  - variableisset{var=caster.paloma_lista} true
  Skills:
  - state{s=fly;li=3;lo=3} @self
  - sound{s=entity.bat.takeoff} @self
  # En vez de borrarse (pensado para spawners), vuelven a aterrizar en su sitio
  - state{s=land;li=10;lo=10;delay=140} @self


pigeon_skin_1:
  Skills:
  - model{mid=scenes_pigeon1;save=true} @self ~onSpawn
  - model{mid=scenes_pigeon1;save=true} @self ~onLoad

pigeon_skin_2:
  Skills:
  - model{mid=scenes_pigeon2;save=true} @self ~onSpawn
  - model{mid=scenes_pigeon2;save=true} @self ~onLoad

pigeon_skin_3:
  Skills:
  - model{mid=scenes_pigeon3;save=true} @self ~onSpawn
  - model{mid=scenes_pigeon3;save=true} @self ~onLoad

pigeon_fly:
  Cooldown: 220
  TargetConditions:
  - isplayer
  Conditions:
  - targets{a=>0}  
  # 5 s de gracia tras aparecer para que se vean al invocarlas cerca
  - variableisset{var=caster.paloma_lista} true
  Skills:
  - state{s=fly} @self
  - sound{s=entity.bat.takeoff} @self
  - state{s=land;li=10;lo=10;delay=120} @self

deleteb:
