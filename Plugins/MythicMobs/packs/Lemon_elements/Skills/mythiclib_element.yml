
lemon_water_element_null:
  Skills:
  
  

lemon_fire_element_attack:
  Skills:
  - effect:particles{p=dust_color_transition;color1=#cc0000;color2=#ff9900;amount=10;hS=0.8;vS=1} 
  - effect:particles{p=flame;s=0.001;amount=3;hS=0.8;vS=1;d=true;dir=0,90,0} 
  - skill{skill=lemon_fire_element_attack_extra} 0.2
  
lemon_fire_element_attack_extra:
  Skills:
  - ignite{ticks=100}
  
lemon_fire_element_attack_crit:
  Skills:
  - Aura{auraName=element_fire_aura;duration=60} 
  - skill{skill=lemon_magma_element_attack}
  - skill{skill=lemon_combustion_element_attack}
  


lemon_water_element_attack:
  Skills:
  - effect:particles{p=dust_color_transition;color1=#3333ff;color2=#00ffff;amount=10;hS=0.8;vS=1} 
  - effect:particles{p=splash;s=0.001;amount=3;hS=0.8;vS=1;d=true;dir=0,90,0} 
  - skill{skill=lemon_water_element_attack_extra} 0.08
lemon_water_element_attack_extra:
  Skills:
  - sound{s=block.respawn_anchor.charge;v=1;p=2} @self
  - heal{amount=2.5,oh=true} @self

lemon_water_element_attack_crit:
  Skills:
  - Aura{auraName=element_water_aura;duration=60}
  - skill{skill=lemon_ice_element_attack}
  - skill{skill=lemon_plant_element_attack}
  
  

lemon_earth_element_attack:
  Skills:
  - effect:particles{p=dust_color_transition;color1=#666633;color2=#00cc00;amount=10;hS=0.8;vS=1} 
  - effect:particles{p=spore_blossom_air;s=0.001;amount=2;hS=0.8;vS=1;d=true;dir=0,90,0}  
  - skill{skill=lemon_earth_element_attack_extra} 0.1
lemon_earth_element_attack_extra:
  Skills:
  - sound{s=block.beacon.power_select;v=1;p=2} @self
  - potion{type=DAMAGE_RESISTANCE;duration=80;level=4;p=false} @self
  

lemon_earth_element_attack_crit:
  Skills:
  - Aura{auraName=element_earth_aura;duration=60}
  - skill{skill=lemon_plant_element_attack}
  - skill{skill=lemon_magma_element_attack}
  
  

lemon_wind_element_attack:
  Skills:
  - effect:particles{p=dust_color_transition;color1=#c2d6d6;color2=#f0f5f5;amount=10;hS=0.8;vS=1} 
  - effect:particles{p=instant_effect;s=0.001;amount=3;hS=0.8;vS=1;d=true;dir=0,90,0} 
  - skill{skill=lemon_wind_element_attack_extra} 0.2
lemon_wind_element_attack_extra:
  Skills:
  - sound{s=block.beacon.power_select;v=1;p=2} @self
  - potion{type=SPEED;duration=80;level=1;p=false} @self
  

lemon_wind_element_attack_crit:
  Skills:
  - Aura{auraName=element_wind_aura;duration=60}
  - skill{skill=lemon_ice_element_attack}
  - skill{skill=lemon_combustion_element_attack}
  
  

lemon_ice_element_attack:
  TargetConditions:
  - hasaura{n=no_element_combo} false
  
  - hasaura{n=element_wind_aura} true
  - hasaura{n=element_water_aura} true
  
  - faction{faction=Boss} false 
  
  Skills:
  - stun{d=100;f=true;ai=true} 
  - freeze{ticks=80}
  - Aura{auraName=element_ice_aura;duration=80;onTick=lemon_ice_element_attack-Tick}
  - Aura{auraName=no_element_combo;duration=100}
  - orbital{points=1;interval=1;duration=70;hp=false;onTick=lemon_ice_element_attack-Tick;bulletType=MOB;mob=lemon_ice;r=0;oy=1.3;onEnd=lemon_ice_element_attack-End} 
  
lemon_ice_element_attack-Tick:
  Skills:
  - effect:particles{p=snowflake;amount=5;speed=0;hS=0.2;vS=0.5} @origin
  - sound{s=entity.player.hurt_freeze;v=1;p=0.1;cooldown=1} @origin
  
lemon_ice_element_attack-End:
  Skills:
  - effect:particles{p=block;m=ice;amount=15;speed=0.27;hS=0.8;vS=0.6} @origin
  - delay 5
  - sound{s=block.glass.break;v=1;p=1.5} @origin
  - delay 3
  - sound{s=block.glass.break;v=1;p=2} @origin
  - delay 3
  - sound{s=block.glass.break;v=1;p=1.8} @origin
  

lemon_combustion_element_attack:
  TargetConditions:
  - hasaura{n=no_element_combo} false
  
  - hasaura{n=element_fire_aura} true
  - hasaura{n=element_wind_aura} true
  
  
  Skills:
  - Aura{auraName=no_element_combo;duration=100}
  - setvariable{var=caster.combustion_damage;value="0";type=INTEGER} @self
  
  - sound{s=entity.generic.explode;v=1;p=2}
  - setvariable{var=caster.fire_damage;value="%mythiclib_stat_FIRE_DAMAGE%";type=INTEGER} @self
  - setvariable{var=caster.wind_damage;value="%mythiclib_stat_WIND_DAMAGE%";type=INTEGER} @self
  - variableMath{var=caster.combustion_damage;equation="<caster.var.fire_damage> + <caster.var.wind_damage>"} @self
  
  - totem{ch=1;i=1;md=8;onTick=[- mmodamage{amount="<caster.var.combustion_damage>";types=dot;element=COMBUSTION} @EntitiesNearOrigin{r=3}]} 
  
  - effect:particles{particle=lava;amount=6;hS=1;vS=1;speed=0.5} 
  - effect:particles{particle=smoke;amount=16;hS=2;vS=1;speed=0.05;directional=true;dir=0,5,0} 
  - effect:particles{particle=flash;amount=1;hS=0;vS=0;speed=0.5} 
  - effect:particles{particle=explosion_emitter;amount=1;hS=0;vS=0;speed=0.5} 
  - delay 2
  - sound{s=entity.generic.extinguish_fire;v=1;p=0.5} 
  
  

lemon_magma_element_attack:
  TargetConditions:
  - hasaura{n=no_element_combo} false
  
  - hasaura{n=element_fire_aura} true
  - hasaura{n=element_earth_aura} true
  
  
  Skills:
  - Aura{auraName=no_element_combo;duration=100}
  - Aura{auraName=lemon_magma_effect_aura;duration=80;onTick=lemon_magma_effect_aura-Tick}
  - sound{s=block.lava.ambient;v=1;p=1.2} 

lemon_magma_effect_aura-Tick:
  Skills:
  - setvariable{var=caster.fire_damage;value="%mythiclib_stat_FIRE_DAMAGE%";type=INTEGER} @self
  
  - mmodamage{amount="<caster.var.fire_damage>";types=dot;element=MAGMA}
  - effect:particles{particle=lava;amount=2;hS=0.5;vS=1;speed=0.5;cooldown=1} 
  - effect:particles{particle=falling_dripstone_lava;amount=13;hS=0.5;vS=1.5;speed=0.01;cooldown=0.5} 
  

lemon_plant_element_attack:
  TargetConditions:
  
  - hasaura{n=element_earth_aura} true
  - hasaura{n=element_water_aura} true
  - hasaura{n=lemon_plant_effect_aura} castinstead lemon_plant_element_attack_2
  
  
  Skills:
  - orbital{auraName=lemon_plant_effect_aura;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant}
  
lemon_plant_element_attack_2:
  TargetConditions:
  - hasaura{n=lemon_plant_effect_aura_2} castinstead lemon_plant_element_attack_3
  Skills:
  - orbital{auraName=lemon_plant_effect_aura;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant}
  
  - orbital{auraName=lemon_plant_effect_aura_2;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant;ox=-2}
  
lemon_plant_element_attack_3:
  TargetConditions:
  - hasaura{n=lemon_plant_effect_aura_3} castinstead lemon_plant_element_attack_4
  Skills:
  - orbital{auraName=lemon_plant_effect_aura;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant}
  
  - orbital{auraName=lemon_plant_effect_aura_2;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant;ox=-2}
  
  - orbital{auraName=lemon_plant_effect_aura_3;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant;ox=-1;oz=1}
  
lemon_plant_element_attack_4:
  TargetConditions:
  - hasaura{n=lemon_plant_effect_aura_4} castinstead lemon_plant_element_attack_5
  Skills:
  - orbital{auraName=lemon_plant_effect_aura;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant}
  
  - orbital{auraName=lemon_plant_effect_aura_2;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant;ox=-2}
  
  - orbital{auraName=lemon_plant_effect_aura_3;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant;ox=-1;oz=1}
  
  - orbital{auraName=lemon_plant_effect_aura_4;points=1;interval=1;duration=100;r=1;hp=false;rd=true;oy=1.6;bulletType=MOB;mob=lemon_plant;ox=-1;oz=-1}
  
lemon_plant_element_attack_5:
  Skills:
  - auraremove{aura=lemon_plant_effect_aura} 
  - auraremove{aura=lemon_plant_effect_aura_2} 
  - auraremove{aura=lemon_plant_effect_aura_3} 
  - auraremove{aura=lemon_plant_effect_aura_4} 
  
  - skill{skill=lemon_plant_element_attack_6}
  
lemon_plant_element_attack_6:
  TargetConditions:
  - hasaura{n=no_element_combo} false
  Skills:
  - setvariable{var=caster.water_damage;value="%mythiclib_stat_WATER_DAMAGE%";type=INTEGER} @self
  - setvariable{var=caster.earth_damage;value="%mythiclib_stat_EARTH_DAMAGE%";type=INTEGER} @self
  - variableMath{var=caster.plant_damage;equation="<caster.var.water_damage>*2 + <caster.var.earth_damage>"} @self
  
  - Aura{auraName=no_element_combo;duration=100}
  - Aura{auraName=lemon_plant_effect_aura_final;duration=100;onTick=lemon_plant_effect_aura_final-Tick}

lemon_plant_effect_aura_final-Tick:
  Skills:
  - mmodamage{amount="<caster.var.plant_damage>";types=dot;element=PLANT}
  - effect:particles{particle=spore_blossom_air;amount=2;hS=0.5;vS=1;speed=0.5;cooldown=1} 
  - effect:particles{particle=sculk_charge_pop;amount=8;hS=0.5;vS=1.5;speed=0.01;directional=true;dir=0,5,0;cooldown=0.5} 
  - sound{s=block.chorus_flower.grow;v=1;p=1.8;cooldown=0.8} 