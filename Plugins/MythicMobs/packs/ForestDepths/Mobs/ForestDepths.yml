Feral_Spirit:
  Type: VINDICATOR
  Display: Feral Spirit
  Health: 65
  Faction: Forest Depths
  Damage: 0
  Armor: 0
  DamageModifiers:
  - FALL 0
  Modules:
   ThreatTable: true
  Options:
    PreventOtherDrops: true
    Despawn: false
    MaxCombatDistance: 256
    PreventRandomEquipment: true
    PreventSunburn: true
    AttackSpeed: 0.18
    Collidable: true
    FollowRange: 80
    KnockbackResistance: 100
    MovementSpeed: 0.38
    AttackSpeed: 1
    Invincible: false
    NoAI: false
    Silent: true
  Skills:
  - randomskill{s=Feral1 0.5, Feral2 0.5, Feral3 1, Feral4 1} ~onTimer:10
  - gcd{ticks=100} @self ~onSpawn
  - setAI{ai=false} @self ~onSpawn
  - setAI{ai=true;delay=90} @self ~onSpawn
  - cancelevent @self ~onAttack
  - model{modelid=feral_spirit;damagetint=false} @Self ~onSpawn
  - state{state=damage} @Self ~onDamaged
  - sound{s=entity.husk.hurt;p=0;v=0.5} @Self ~onDamaged
  - sound{s=entity.allay.hurt;p=0.6;v=0.5;delay=15} @Self ~onDeath
  - sound{s=entity.husk.death;p=0;v=0.5} @Self ~onDeath
  - sound{s=item.armor.equip_elytra;p=0.2;v=0.5;delay=35} @Self ~onDeath
  - sound{s=entity.blaze.ambient;p=2;v=0.7} @Self ~onSpawn
  - sound{s=block.beacon.ambient;p=0.3;v=1;delay=5} @Self ~onSpawn
  - sound{s=block.respawn_anchor.ambient;p=2;v=1;delay=3} @Self ~onSpawn
  - sound{s=block.basalt.fall;p=0.2;v=1;delay=80} @Self ~onSpawn
