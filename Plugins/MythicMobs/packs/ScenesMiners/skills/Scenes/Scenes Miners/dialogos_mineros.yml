dialogo_minero_frase6:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.85} @self
  - summon{m=holo_minero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_minero_f6_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_minero_f6_l2;a=1} @selflocation{y=2.10}
