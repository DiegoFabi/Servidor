interact_miner_sleep:
  Cooldown: 7
  Skills:
  # - sound{s=your_sound_name} @self
  - state{s=sleep;mid=scene_miner_1;r=true} @self
  - state{s=wakeup;mid=scene_miner_1} @self
  - state{s=wakeup;mid=scene_miner_1;r=true;delay=140} @self
  - state{s=sleep;mid=scene_miner_1;delay=140} @self
  - lockhead{lp=true} @self
  - throw{velocity=8;fromorigin=true;delay=6} @PIR{radius=3}

# Replace your_sound_name with the name of a sound of your choice, and remove # 
interact_miner:
  Cooldown: 7
  Skills:
  # - sound{s=your_sound_name} @self
  - state{s=idle;mid=scene_miner_3;r=true} @self
  - state{s=interact;mid=scene_miner_3} @self
  - state{s=interact;mid=scene_miner_3;r=true;delay=140} @self
  - state{s=idle;mid=scene_miner_3;delay=129} @self
  - lockhead{lp=true} @self

