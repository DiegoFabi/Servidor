scene_miner_undead:
  Type: ZOMBIE
  Display: 'Undead Miner'
  Health: 30
  Damage: 0
  AITargetSelectors:
  - players
  Options:
    MaxCombatDistance: 32 
    Silent: true
    PreventOtherDrops: true
    KnockbackResistance: 0.2
    FollowRange: 32
    MovementSpeed: 0.23
  Skills:
  - model{mid=scene_miner_4;save=true} @self ~onSpawn
  - model{mid=scene_miner_4;save=true;delay=5} @self ~onLoad
  - randomskill{skills=undeadskinminer1,undeadskinminer2,undeadskinminer3,undeadskinminer4,undeadskinminer5,undeadskinminer6,undeadskinminer7,undeadskinminer8,undeadskinminer9,undeadskinminer10} @self ~onSpawn
  - randomskill{skills=undeadskinminer1,undeadskinminer2,undeadskinminer3,undeadskinminer4,undeadskinminer5,undeadskinminer6,undeadskinminer7,undeadskinminer8,undeadskinminer9,undeadskinminer10;delay=10} @self ~onLoad 
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onLoad
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onSpawn
  - light{m=scene_miner_3;p=miner_hat_e;block=15} @self ~onSpawn
  - light{m=scene_miner_2;p=lantern_light;block=15} @self ~onSpawn
  - lockhead{lp=true} @self ~onSpawn
  - randomskill{skills=minerundeadattack2,minerundeadattack1;cooldown=2} @self ~onAttack
  - state{m=scene_miner_4;s=death;li=2;lo=2} @self ~onDeath
  - meleeHit{triggerskills=true;cooldown=3} @target ~onTimer:5 ?targetWithin{distance=3} 
  - state{m=scene_miner_4;s=hit} @self ~onDamaged
  - lockmodel{l=true} @self ~onDamaged
  - lockmodel{l=false;delay=20} @self ~onDamaged
