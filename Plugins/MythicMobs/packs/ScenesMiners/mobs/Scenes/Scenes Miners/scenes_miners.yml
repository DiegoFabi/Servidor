
scene_miner_sleep:
  Type: PIG
  Display: ''
  Health: 5
  Damage: 0
  AIGoalSelectors:
  - clear
  Options:
    Despawn: persistent
    KnockbackResistance: 10
    Collidable: false
    MovementSpeed: 0
    Invincible: true
    Silent: true
    PreventLeashing: true
    AlwaysShowName: true
  Skills:
  - model{mid=scene_miner_1;save=true} @self ~onSpawn
  - model{mid=scene_miner_1;save=true;delay=5} @self ~onLoad
  - state{s=sleep;delay=30} @self ~onLoad
  - defaultstate{m=scene_miner_1;t=idle;s=sleep} @self ~onSpawn
  - defaultstate{m=scene_miner_1;t=idle;s=sleep;delay=10} @self ~onLoad
  - remapmodel{m=scene_miner_1;n=<global.var.skin<caster.uuid>|scene_miner_1>;delay=10} @self ~onLoad
  - changepart{m=scene_miner_1;pid=right_item;nm=<global.var.rightitem<caster.uuid>>;npid=right_item} @self ~onLoad
  - changepart{m=scene_miner_1;pid=left_item;nm=<global.var.leftitem<caster.uuid>>;npid=left_item} @self ~onLoad
  - changepart{m=scene_miner_1;pid=backpack;nm=<global.var.backpack<caster.uuid>>;npid=backpack} @self ~onLoad
  - changepart{m=scene_miner_1;pid=hat;nm=<global.var.hat<caster.uuid>>;npid=hat} @self ~onLoad
  - changepart{m=scene_miner_1;pid=left_pant;nm=<global.var.leftpant<caster.uuid>>;npid=hat} @self ~onLoad
  - changepart{m=scene_miner_1;pid=right_pant;nm=<global.var.rightpant<caster.uuid>>;npid=hat} @self ~onLoad
  - cancelevent{sync=true} @self ~onDamaged
  - skill{s=interact_miner_sleep} ~onInteract
  - skill{s=dialogo_minero_cansado} @trigger ~onInteract
  - skill{s=scene_openmenu} ~onInteract
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onLoad
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onSpawn
  - light{m=scene_miner_1;p=miner_hat_e;block=15} @self ~onSpawn
  - setvariable{var=global.skinchange;value=scene_miner_1;type=STRING;save=true} @self ~onInteract

