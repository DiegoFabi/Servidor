# ============================================================
#  hologramas_mineros.yml - Hologramas de los NPCs del pack ScenesMiners
#  Armor stands invisibles tipo marcador (sin hitbox) que solo
#  muestran su nombre; se borran solos y no se guardan al reiniciar.
#  Cada rol tiene su paleta e icono propios.
#  Nombres:  holo_<rol>_nombre  |  holo_<rol>_f<frase>_l<linea>
#  Los usa: dialogos_mineros.yml
# ============================================================

# ---------- ⛏ Minero (scene_miner_slab, scene_miner_block, scene_miner_wall, scene_miner_walk, scene_miner_walk2, scene_miner_walk3, scene_miner_interactive) | paleta #D9CCBE -> #8D7B68 ----------
holo_minero_nombre:
  Type: ARMOR_STAND
  Display: '<#8D7B68>⛏ <gradient:#D9CCBE:#8D7B68><bold>Minero</bold></gradient> <#8D7B68>⛏'
  Health: 1
  Options:
    Invisible: true
    Marker: true
    HasGravity: false
    CanMove: false
    Collidable: false
    Invincible: true
    Silent: true
    AlwaysShowName: true
    Despawn: true
    Persistent: false
  Skills:
  - remove{delay=70} @self ~onSpawn


