# ============================================================
#  dialogos_npcpack.yml - Diálogos aleatorios de los NPCs del pack NPCPack
#  Clic derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Hologramas sobre el NPC (hologramas_npcpack.yml) + partículas.
#   - Voz de aldeano según la respuesta (yes / no / trade / ambient)
#     con un tono propio por rol.
#   - Chat solo para el jugador que interactuó (message @trigger).
#  Uso en el mob:  - skill{s=dialogo_<rol>} @trigger ~onInteract
#  Anti-duplicado: cooldown invisible de 5 s por NPC (variable caster.dialogo_cd).
#  Sin temporizadores: solo al interactuar.
# ============================================================

# ---------- ⚒ Herrero | paleta #FFBE7A -> #E8590C ----------
# NPCs: npc_dwarf, khansnpcs_bromnar_the_blacksmith
dialogo_herrero:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - sound{s=block.anvil.use;v=0.5;p=1} @self
  - particles{p=flame;a=10;hs=0.4;vs=0.3;y=2.2} @self
  - randomskill{s=dialogo_herrero_frase1,dialogo_herrero_frase2,dialogo_herrero_frase3,dialogo_herrero_frase4,dialogo_herrero_frase5,dialogo_herrero_frase6} @trigger

dialogo_herrero_frase1:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=0.8} @self
  - summon{m=holo_herrero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_herrero_f1_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_herrero_f1_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#E8590C>⚒ <gradient:#FFBE7A:#E8590C><bold>Herrero</bold></gradient> <dark_gray>» <#FFECD9>El metal hay que trabajarlo caliente. Si se enfría, se resiste."} @trigger

dialogo_herrero_frase2:
