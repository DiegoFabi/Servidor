# ============================================================
#  dialogos_lenadores.yml - Diálogos aleatorios de los NPCs del pack ScenesLumberjacks
#  Clic derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Hologramas sobre el NPC (hologramas_lenadores.yml) + partículas.
#   - Voz de aldeano según la respuesta (yes / no / trade / ambient)
#     con un tono propio por rol.
#   - Chat solo para el jugador que interactuó (message @trigger).
#  Uso en el mob:  - skill{s=dialogo_<rol>} @trigger ~onInteract
#  Anti-duplicado: cooldown invisible de 5 s por NPC (variable caster.dialogo_cd).
#  Sin temporizadores: solo al interactuar.
# ============================================================

# ---------- ♣ Leñador | paleta #B5E08A -> #5E8C31 ----------
# NPCs: scene_lumberjack_log, scene_lumberjack_walk, scene_lumberjack_walk2, scene_lumberjack_walk3, scene_lumberjack_saw, scene_lumberjack_cut, scene_lumberjack_interactive
dialogo_lenador:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - sound{s=block.wood.break;v=0.5;p=1} @self
  - particles{p=composter;a=10;hs=0.4;vs=0.3;y=2.2} @self
  - randomskill{s=dialogo_lenador_frase1,dialogo_lenador_frase2,dialogo_lenador_frase3,dialogo_lenador_frase4,dialogo_lenador_frase5,dialogo_lenador_frase6} @trigger

dialogo_lenador_frase1:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=0.9} @self
  - speak{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <#5E8C31>♣\n<#EAF6DE>Un buen hachazo vale más que diez\n<#EAF6DE>flojos.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <dark_gray>» <#EAF6DE>Un buen hachazo vale más que diez flojos."} @trigger

dialogo_lenador_frase2:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.9} @self
  - speak{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <#5E8C31>♣\n<#EAF6DE>Siempre planto un árbol por cada uno\n<#EAF6DE>que corto.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <dark_gray>» <#EAF6DE>Siempre planto un árbol por cada uno que corto."} @trigger

dialogo_lenador_frase3:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=0.9} @self
  - speak{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <#5E8C31>♣\n<#EAF6DE>El roble cuesta, pero da la mejor\n<#EAF6DE>leña.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <dark_gray>» <#EAF6DE>El roble cuesta, pero da la mejor leña."} @trigger

dialogo_lenador_frase4:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=0.9} @self
  - speak{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <#5E8C31>♣\n<#EAF6DE>Cuidado, que este se cae para tu\n<#EAF6DE>lado.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <dark_gray>» <#EAF6DE>Cuidado, que este se cae para tu lado."} @trigger

dialogo_lenador_frase5:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.9} @self
  - speak{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <#5E8C31>♣\n<#EAF6DE>El bosque huele distinto después de\n<#EAF6DE>la lluvia.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <dark_gray>» <#EAF6DE>El bosque huele distinto después de la lluvia."} @trigger

dialogo_lenador_frase6:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.9} @self
  - speak{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <#5E8C31>♣\n<#EAF6DE>Al final del día lo único que quiero\n<#EAF6DE>es una sopa caliente.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#5E8C31>♣ <gradient:#B5E08A:#5E8C31>Leñador</gradient> <dark_gray>» <#EAF6DE>Al final del día lo único que quiero es una sopa caliente."} @trigger
