
scene_lumberjack_log:
  Type: PIG
  Display: ''
  Health: 5
  Damage: 0
  AIGoalSelectors:
  - clear
  Options:
    Despawn: persistent
    KnockbackResistance: 10
    Collidable: false
    MovementSpeed: 0
    Invincible: true
    Silent: true
    PreventLeashing: true
    AlwaysShowName: true
  Skills:
  - model{mid=scene_lumberjack;save=true} @self ~onSpawn
  - model{mid=scene_lumberjack;save=true;delay=5} @self ~onLoad
  - state{s=lumberjack_log;delay=10} @self ~onLoad
  - defaultstate{m=scene_lumberjack;t=idle;s=lumberjack_log} @self ~onSpawn
  - defaultstate{m=scene_lumberjack;t=idle;s=lumberjack_log;delay=10} @self ~onLoad
  - remapmodel{m=scene_lumberjack;n=<global.var.skin<caster.uuid>|scene_lumberjack>;delay=10} @self ~onLoad
  - skill{s=scene_skin_azar} @self ~onSpawn
  - remapmodel{m=scene_lumberjack;n=<global.var.skin<caster.uuid>|scene_lumberjack>;delay=12} @self ~onSpawn
  - changepart{m=scene_lumberjack;pid=right_item;nm=<global.var.rightitem<caster.uuid>>;npid=right_item} @self ~onLoad
  - changepart{m=scene_lumberjack;pid=left_item;nm=<global.var.leftitem<caster.uuid>>;npid=left_item} @self ~onLoad
  - changepart{m=scene_lumberjack;pid=backpack;nm=<global.var.backpack<caster.uuid>>;npid=backpack} @self ~onLoad
  - changepart{m=scene_lumberjack;pid=hat;nm=<global.var.hat<caster.uuid>>;npid=hat} @self ~onLoad
  - changepart{m=scene_lumberjack;pid=left_pant;nm=<global.var.leftpant<caster.uuid>>;npid=hat} @self ~onLoad
  - changepart{m=scene_lumberjack;pid=right_pant;nm=<global.var.rightpant<caster.uuid>>;npid=hat} @self ~onLoad
  - cancelevent{sync=true} @self ~onDamaged
  - skill{s=scene_openmenu} ~onInteract
  - skill{s=dialogo_lenador} @trigger ~onInteract
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onLoad
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onSpawn
  - setvariable{var=global.skinchange;value=scene_lumberjack;type=STRING;save=true} @self ~onInteract

