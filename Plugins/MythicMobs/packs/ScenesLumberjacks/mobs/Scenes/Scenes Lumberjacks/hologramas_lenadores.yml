# ============================================================
#  hologramas_lenadores.yml - Hologramas de los NPCs del pack ScenesLumberjacks
#  Armor stands invisibles tipo marcador (sin hitbox) que solo
#  muestran su nombre; se borran solos y no se guardan al reiniciar.
#  Cada rol tiene su paleta e icono propios.
#  Nombres:  holo_<rol>_nombre  |  holo_<rol>_f<frase>_l<linea>
#  Los usa: dialogos_lenadores.yml
# ============================================================

# ---------- ♣ Leñador (scene_lumberjack_log, scene_lumberjack_walk, scene_lumberjack_walk2, scene_lumberjack_walk3, scene_lumberjack_saw, scene_lumberjack_cut, scene_lumberjack_interactive) | paleta #B5E08A -> #5E8C31 ----------
holo_lenador_nombre:
  Type: ARMOR_STAND
  Display: '<#5E8C31>♣ <gradient:#B5E08A:#5E8C31><bold>Leñador</bold></gradient> <#5E8C31>♣'
  Health: 1
  Options:
    Invisible: true
    Marker: true
    HasGravity: false
    CanMove: false
    Collidable: false
    Invincible: true
    Silent: true
    AlwaysShowName: true
    Despawn: true
    Persistent: false
  Skills:
  - remove{delay=70} @self ~onSpawn


