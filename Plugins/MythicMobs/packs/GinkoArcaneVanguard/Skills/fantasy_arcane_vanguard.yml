# One-shot gestures override idle; each starts its sound once.

GinkoFantasyArcaneVanguardInit:
  Skills:
  - state{s=idle;l=LOOP;pr=0;li=2;lo=2} @self
GinkoFantasyArcaneVanguardWildwoodAlchemistIdle2:
  Conditions:
  - playernotwithin{d=5}
  - hasaura{aura=GinkoFantasyArcaneVanguardGesture} false
  Skills:
  - aura{auraName=GinkoFantasyArcaneVanguardGesture;duration=142} @self
  - state{s=idle2;pr=1;l=ONCE;ov=true;ez=true;li=2;lo=2} @self
  - sound{s=ginko_fantasy_arcane_vanguard:wildwood_alchemist.idle2;v=0.8;p=1;sc=VOICE;r=12} @self
