# ============================================================
#  dialogos_khans.yml - Diálogos aleatorios de los NPCs del pack Utils
#  Clic derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Hologramas sobre el NPC (hologramas_khans.yml) + partículas.
#   - Voz de aldeano según la respuesta (yes / no / trade / ambient)
#     con un tono propio por rol.
#   - Chat solo para el jugador que interactuó (message @trigger).
#  Uso en el mob:  - skill{s=dialogo_<rol>} @trigger ~onInteract
#  Anti-duplicado: cooldown invisible de 5 s por NPC (variable caster.dialogo_cd).
#  Sin temporizadores: solo al interactuar.
# ============================================================

# ---------- ✵ Mago | paleta #C2AEFF -> #6A4BD6 ----------
# NPCs: khansnpcs_quindle_the_mage
dialogo_mago:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - sound{s=block.enchantment_table.use;v=0.5;p=1} @self
  - particles{p=enchant;a=10;hs=0.4;vs=0.3;y=2.2} @self
  - randomskill{s=dialogo_mago_frase1,dialogo_mago_frase2,dialogo_mago_frase3,dialogo_mago_frase4,dialogo_mago_frase5,dialogo_mago_frase6} @trigger

dialogo_mago_frase1:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=0.9} @self
  - summon{m=holo_mago_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_mago_f1_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_mago_f1_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#6A4BD6>✵ <gradient:#C2AEFF:#6A4BD6><bold>Mago</bold></gradient> <dark_gray>» <#EDE8FF>No toques esa esfera, por favor. La última vez fue un desastre."} @trigger

dialogo_mago_frase2:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.9} @self
  - summon{m=holo_mago_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_mago_f2_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_mago_f2_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#6A4BD6>✵ <gradient:#C2AEFF:#6A4BD6><bold>Mago</bold></gradient> <dark_gray>» <#EDE8FF>La magia es como la cocina, un ingrediente de más y boom."} @trigger

dialogo_mago_frase3:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.9} @self
  - summon{m=holo_mago_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_mago_f3_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_mago_f3_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#6A4BD6>✵ <gradient:#C2AEFF:#6A4BD6><bold>Mago</bold></gradient> <dark_gray>» <#EDE8FF>Llevo semanas con este hechizo. Casi lo tengo."} @trigger

dialogo_mago_frase4:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=0.9} @self
  - summon{m=holo_mago_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_mago_f4_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_mago_f4_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#6A4BD6>✵ <gradient:#C2AEFF:#6A4BD6><bold>Mago</bold></gradient> <dark_gray>» <#EDE8FF>Las estrellas dicen que hoy es buen día. Para mí, al menos."} @trigger

dialogo_mago_frase5:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=0.9} @self
  - summon{m=holo_mago_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_mago_f5_l1;a=1} @selflocation{y=2.35}
