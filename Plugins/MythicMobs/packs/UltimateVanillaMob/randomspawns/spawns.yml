# Probabilidades x2,1 en total (dos aumentos moderados de mobs custom con textura; máx. 0,6)
# Ultimate Vanilla Mob: sustituyen a parte de los mobs vanilla de su bioma en survivalMain.
# Priority 300: por encima de los élites (Priority 1), no son élites.
ero_spider_natural:
  Type: ero_spider
  Worlds: survivalMain
  Chance: 0.105
  Priority: 300
  Action: REPLACE
  UseWorldScaling: false
  Biomes: JUNGLE,SPARSE_JUNGLE,BAMBOO_JUNGLE,DARK_FOREST,DRIPSTONE_CAVES,LUSH_CAVES,FOREST
  Conditions:
  - entitytype{t=SPIDER} true
  - mobsinradius{t=ero_spider;a=<2;r=48} true

