# ============================================================
#  hologramas_pescadores.yml - Hologramas de los NPCs del pack ScenesFishermen
#  Armor stands invisibles tipo marcador (sin hitbox) que solo
#  muestran su nombre; se borran solos y no se guardan al reiniciar.
#  Cada rol tiene su paleta e icono propios.
#  Nombres:  holo_<rol>_nombre  |  holo_<rol>_f<frase>_l<linea>
#  Los usa: dialogos_pescadores.yml
# ============================================================

# ---------- ⚓ Pescador (scene_fisherman_boat, scene_fisherman_stick, scene_fisherman_standing, scene_fisherman_sitting, scene_fisherman_interactive) | paleta #8FE3FF -> #2F7FE0 ----------
holo_pescador_nombre:
  Type: ARMOR_STAND
  Display: '<#2F7FE0>⚓ <gradient:#8FE3FF:#2F7FE0><bold>Pescador</bold></gradient> <#2F7FE0>⚓'
  Health: 1
  Options:
    Invisible: true
    Marker: true
    HasGravity: false
    CanMove: false
    Collidable: false
    Invincible: true
    Silent: true
    AlwaysShowName: true
    Despawn: true
    Persistent: false
  Skills:
  - remove{delay=70} @self ~onSpawn


