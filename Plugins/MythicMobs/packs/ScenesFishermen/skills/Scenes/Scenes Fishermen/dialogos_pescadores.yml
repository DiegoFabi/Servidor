  - settextdisplay{text="<#2F7FE0>⚓ <gradient:#8FE3FF:#2F7FE0>Pescador</gradient> <#2F7FE0>⚓<newline><#DFF7FF>La paciencia es el mejor cebo, eso<newline><#DFF7FF>decía mi padre.";delay=1} @Passenger
  - message{m="<#2F7FE0>⚓ <gradient:#8FE3FF:#2F7FE0>Pescador</gradient> <dark_gray>» <#DFF7FF>La paciencia es el mejor cebo, eso decía mi padre."} @trigger

