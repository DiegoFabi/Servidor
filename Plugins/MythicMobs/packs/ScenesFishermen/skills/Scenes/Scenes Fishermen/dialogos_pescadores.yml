  - sound{s=entity.villager.yes;v=0.8;p=0.95} @self
  - summon{m=holo_pescador_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_pescador_f4_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_pescador_f4_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#2F7FE0>⚓ <gradient:#8FE3FF:#2F7FE0><bold>Pescador</bold></gradient> <dark_gray>» <#DFF7FF>Al amanecer el agua está tranquila, es la mejor hora."} @trigger

