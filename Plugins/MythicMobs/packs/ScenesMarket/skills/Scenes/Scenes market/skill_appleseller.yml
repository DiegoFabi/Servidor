# ============================================================
#  Frutero (scene_market_appleseller) - Talk + minijuego
#
#  Click derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Sin diamantes en la mano -> habla con hologramas y explica.
#   - Diamantes en la mano, menos de 10 -> le avisa que faltan.
#   - Diamantes en la mano, 10 o más -> "Canasta de la Suerte":
#       cobra 10 diamantes, revisa las canastas con suspenso (2 s) y sortea:
#         60%  Manzana Dorada
#         15%  Manzana Dorada Encantada (se anuncia a los cercanos)
#         25%  Patata Envenenada
#     Racha de mala suerte: tras 3 patatas seguidas, la siguiente
#     canasta trae Manzana Dorada asegurada (variable por jugador).
#
#  Sin temporizadores: todo ocurre al hacer click. Los hologramas son
#  armor stands marcador que se borran solos (hologramas_market.yml).
#  Cooldown invisible de 5 s por jugador (variable target.appleseller_cd).
#  Cobro y premios con la librería global Skript/scripts/utils/items.sk
#  (itemquitar / itemdar; si el inventario está lleno, va al /buzon).
# ============================================================

appleseller_click:
  # Anti-duplicado: un clic puede disparar ~onInteract dos veces
  Conditions:
  - variableisset{var=caster.appleseller_tick} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.appleseller_tick;type=INTEGER;value=1;duration=5} @self
  - skill{s=appleseller_atender} @trigger

# Cooldown invisible de 5 s POR JUGADOR (variable temporal que caduca sola;
# mientras dure, el clic simplemente se ignora)
appleseller_atender:
  TargetConditions:
  - variableisset{var=target.appleseller_cd} false
  Skills:
  - setvariable{var=target.appleseller_cd;type=INTEGER;value=1;duration=100} @trigger
  - skill{s=appleseller_hablar} @trigger
  - skill{s=appleseller_pocos} @trigger
  - skill{s=appleseller_jugar} @trigger

# Limpia los hologramas del frutero que sigan visibles

# ---------- Talk ----------
appleseller_hablar:
  TargetConditions:
  - holding{m=DIAMOND} false
  Skills:
  - speak{m="<#FFD36B>✦ <gradient:#FFE29A:#FFB347>¡Manzanas de la Suerte!</gradient> <#FFD36B>✦\n<#C9CDD6>Canasta sorpresa por <#5FE3FF>10 ◆ diamantes\n<#7FB2FF>➜ Sostén diamantes y haz clic";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - sound{s=entity.villager.ambient;v=1;p=1.2} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#E6E8EE>¡Hola, <#FFE29A><trigger.name><#E6E8EE>! Vendo manzanas de la suerte."} @trigger
  - message{m="<#C9CDD6>Por <#5FE3FF>10 ◆ diamantes <#C9CDD6>eliges una canasta sorpresa."} @trigger
  - message{m="<#FFD36B>✦ Manzana Dorada <dark_gray>• <#FF9BE6>★ Encantada <dark_gray>• <#8FBF5A>☠ Patata Envenenada"} @trigger
  - message{m="<#7FB2FF>➜ Sostén diamantes en la mano y haz clic derecho."} @trigger

# ---------- Faltan diamantes ----------
appleseller_pocos:
  TargetConditions:
  - holding{m=DIAMOND} true
  - hasitem{m=DIAMOND;amount=>9} false
  Skills:
  - speak{m="<#FF6B6B>✖ ¡Son 10 diamantes, viajero!";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - sound{s=entity.villager.no;v=1;p=1} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#FF6B6B>Una canasta cuesta <#5FE3FF>10 ◆ diamantes<#FF6B6B>, vuelve cuando los tengas."} @trigger

# ---------- Minijuego ----------
appleseller_jugar:
  TargetConditions:
  - holding{m=DIAMOND} true
  - hasitem{m=DIAMOND;amount=>9} true
  Skills:
  # Cobro con la librería global (Skript/scripts/utils/items.sk)
  - command{c="itemquitar <trigger.name> 10 diamond"}
  - setvariable{var=target.appleseller_turno;type=INTEGER;value=1} @trigger
  - speak{m="<#FFE29A>✧ Revisando las canastas <#9EA3AE>. . .";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - sound{s=entity.villager.yes;v=0.8;p=1.1} @self
  - sound{s=block.barrel.open;v=1;p=1} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#E6E8EE>¡Trato hecho! Revisando las canastas..."} @trigger
  - sound{s=block.note_block.hat;v=1;p=0.8;delay=10} @self
  - particles{p=composter;a=8;hs=0.4;vs=0.3;y=1.4;delay=10} @self
  - sound{s=block.note_block.hat;v=1;p=1.1;delay=20} @self
  - particles{p=composter;a=8;hs=0.4;vs=0.3;y=1.4;delay=20} @self
  - sound{s=block.note_block.hat;v=1;p=1.5;delay=30} @self
  - particles{p=composter;a=8;hs=0.4;vs=0.3;y=1.4;delay=30} @self
  - delay 40
  - skill{s=appleseller_garantia} @trigger
  - skill{s=appleseller_sorteo} @trigger

# Racha: 3 patatas seguidas -> Manzana Dorada asegurada
appleseller_garantia:
  TargetConditions:
  - variableequals{var=target.appleseller_turno;value=1} true
  - variableinrange{var=target.appleseller_racha;value=>2} true
  Skills:
  - setvariable{var=target.appleseller_turno;type=INTEGER;value=0} @trigger
  - speak{m="<#9EA3AE>Por tu mala suerte... <#FFD36B>¡va de regalo!";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - skill{s=appleseller_premio_dorada} @trigger

appleseller_sorteo:
  TargetConditions:
  - variableequals{var=target.appleseller_turno;value=1} true
  Skills:
  - setvariable{var=target.appleseller_turno;type=INTEGER;value=0} @trigger
  # 20 entradas: 12 dorada (60%), 3 encantada (15%), 5 patata (25%)
  - randomskill{s=appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_dorada,appleseller_premio_encantada,appleseller_premio_encantada,appleseller_premio_encantada,appleseller_premio_patata,appleseller_premio_patata,appleseller_premio_patata,appleseller_premio_patata,appleseller_premio_patata} @trigger

# ---------- Premios ----------
appleseller_premio_dorada:
  Skills:
  - command{c="itemdar <trigger.name> 1 golden apple"}
  - setvariable{var=target.appleseller_racha;type=INTEGER;value=0;save=true} @trigger
  - speak{m="<#FFD36B>✦ <gradient:#FFE29A:#FFB347>¡Manzana Dorada!</gradient> <#FFD36B>✦";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - sound{s=entity.villager.yes;v=0.8;p=1.1} @self
  - sound{s=entity.player.levelup;v=1;p=1.2} @trigger
  - particles{p=happy_villager;a=25;hs=0.6;vs=0.5;y=1.6} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#FFD36B>✦ ¡Manzana Dorada! <#C9CDD6>Que te dé fuerzas en el camino."} @trigger

appleseller_premio_encantada:
  Skills:
  - command{c="itemdar <trigger.name> 1 enchanted golden apple"}
  - setvariable{var=target.appleseller_racha;type=INTEGER;value=0;save=true} @trigger
  - speak{m="<#FF9BE6>★ <gradient:#FFD36B:#FF6BD5:#B45CFF>¡Manzana Encantada!</gradient> <#FF9BE6>★";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - sound{s=entity.villager.celebrate;v=0.9;p=1.1} @self
  - sound{s=ui.toast.challenge_complete;v=1;p=1} @trigger
  - sound{s=block.amethyst_block.chime;v=1;p=1.4} @self
  - particles{p=totem_of_undying;a=60;hs=0.7;vs=0.8;s=0.3;y=1.6} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#FF9BE6>★ ¡No puede ser! <#FFE29A><trigger.name> <#FF9BE6>se llevó una <#FFD36B>Manzana Encantada<#FF9BE6>!"} @trigger

appleseller_premio_patata:
  Skills:
  - command{c="itemdar <trigger.name> 1 poisonous potato"}
  - variableadd{var=target.appleseller_racha;amount=1} @trigger
  - sound{s=entity.villager.no;v=1;p=0.9} @self
  - particles{p=smoke;a=20;hs=0.4;vs=0.3;y=1.5} @self
  # Excusa del frutero al azar (lore, sin decir "no ganaste")
  - randomskill{s=appleseller_mala_suerte_1,appleseller_mala_suerte_2,appleseller_mala_suerte_3} @trigger
  - message{m="<#9EA3AE>Mala racha <#E6E8EE><trigger.var.appleseller_racha>/3 <dark_gray>• <#9EA3AE>a la tercera te guardo una <#FFD36B>Manzana Dorada<#9EA3AE>."} @trigger

appleseller_mala_suerte_1:
  Skills:
  - speak{m="<#B7D98B>Vaya... <#C9CDD6>se me acabaron las buenas";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#B7D98B>Vaya... se me acabaron las buenas. <#C9CDD6>Solo me queda esta patata, perdona."} @trigger

appleseller_mala_suerte_2:
  Skills:
  - speak{m="<#B7D98B>Esta venía del fondo del carro...";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#B7D98B>Esta canasta venía del fondo del carro... <#C9CDD6>ni yo sé cómo llegó esta patata ahí."} @trigger

appleseller_mala_suerte_3:
  Skills:
  - speak{m="<#B7D98B>Los cuervos se llevaron las mejores";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#FFB347>Frutero <dark_gray>» <#B7D98B>Los cuervos se llevaron las mejores esta mañana. <#C9CDD6>Toma, al menos esta patata."} @trigger
