# ============================================================
#  dialogos_market.yml - Diálogos aleatorios de los NPCs del pack ScenesMarket
#  Clic derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Hologramas sobre el NPC (hologramas_market.yml) + partículas.
#   - Voz de aldeano según la respuesta (yes / no / trade / ambient)
#     con un tono propio por rol.
#   - Chat solo para el jugador que interactuó (message @trigger).
#  El Frutero (appleseller) tiene su propio minijuego: skill_appleseller.yml
#  Uso en el mob:  - skill{s=dialogo_<rol>} @trigger ~onInteract
#  Anti-duplicado: cooldown invisible de 5 s por NPC (variable caster.dialogo_cd).
#  Sin temporizadores: solo al interactuar.
# ============================================================

# ---------- ⚖ Comerciante | paleta #7FE3C4 -> #2FAF8A ----------
# NPCs: scene_market_merchant_interactive_1, scene_market_merchant_interactive_2, scene_market_merchant_sit_interactive_1, scene_market_merchant_sit_interactive_2, scene_market_merchant_counter_interactive_1, scene_market_merchant_counter_interactive_2
dialogo_pescadero:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - sound{s=entity.villager.ambient;v=0.5;p=1} @self
  - particles{p=splash;a=10;hs=0.4;vs=0.3;y=2.2} @self
  - randomskill{s=dialogo_pescadero_frase1,dialogo_pescadero_frase2,dialogo_pescadero_frase3,dialogo_pescadero_frase4,dialogo_pescadero_frase5,dialogo_pescadero_frase6} @trigger

dialogo_pescadero_frase1:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.05} @self
  - summon{m=holo_pescadero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_pescadero_f1_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_pescadero_f1_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC><bold>Pescadero</bold></gradient> <dark_gray>» <#DFF4FF>Pescado fresco de esta mañana. Mira esos ojos, brillan todavía."} @trigger

dialogo_pescadero_frase2:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.05} @self
  - summon{m=holo_pescadero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_pescadero_f2_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_pescadero_f2_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC><bold>Pescadero</bold></gradient> <dark_gray>» <#DFF4FF>El salmón se acaba rápido, si lo quieres no lo pienses mucho."} @trigger

dialogo_pescadero_frase3:
  Skills:
  - sound{s=entity.villager.trade;v=0.8;p=1.05} @self
  - summon{m=holo_pescadero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_pescadero_f3_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_pescadero_f3_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC><bold>Pescadero</bold></gradient> <dark_gray>» <#DFF4FF>Mi primo lo saca del río y yo lo vendo. Negocio de familia."} @trigger

dialogo_pescadero_frase4:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=1.05} @self
  - summon{m=holo_pescadero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_pescadero_f4_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_pescadero_f4_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC><bold>Pescadero</bold></gradient> <dark_gray>» <#DFF4FF>Con un poco de sal y fuego, cualquier pez sabe a gloria."} @trigger

dialogo_pescadero_frase5:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=1.05} @self
  - summon{m=holo_pescadero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_pescadero_f5_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_pescadero_f5_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC><bold>Pescadero</bold></gradient> <dark_gray>» <#DFF4FF>No te fíes del que vende pescado sin olor, algo esconde."} @trigger

dialogo_pescadero_frase6:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=1.05} @self
  - summon{m=holo_pescadero_nombre;a=1} @selflocation{y=2.60}
  - summon{m=holo_pescadero_f6_l1;a=1} @selflocation{y=2.35}
  - summon{m=holo_pescadero_f6_l2;a=1} @selflocation{y=2.10}
  - message{m="<dark_gray>┃ <#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC><bold>Pescadero</bold></gradient> <dark_gray>» <#DFF4FF>Hoy el mar estuvo generoso. Ojalá mañana también."} @trigger

