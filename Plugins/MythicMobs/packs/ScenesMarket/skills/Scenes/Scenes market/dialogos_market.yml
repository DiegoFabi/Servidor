# ============================================================
#  dialogos_market.yml - Diálogos aleatorios de los NPCs del pack ScenesMarket
#  Clic derecho (sin agacharse; agachado abre el editor de Scenes):
#   - Hologramas sobre el NPC (hologramas_market.yml) + partículas.
#   - Voz de aldeano según la respuesta (yes / no / trade / ambient)
#     con un tono propio por rol.
#   - Chat solo para el jugador que interactuó (message @trigger).
#  El Frutero (appleseller) tiene su propio minijuego: skill_appleseller.yml
#  Uso en el mob:  - skill{s=dialogo_<rol>} @trigger ~onInteract
#  Anti-duplicado: cooldown invisible de 5 s por NPC (variable caster.dialogo_cd).
#  Sin temporizadores: solo al interactuar.
# ============================================================

# ---------- ⚖ Comerciante | paleta #7FE3C4 -> #2FAF8A ----------
# NPCs: scene_market_merchant_interactive_1, scene_market_merchant_interactive_2, scene_market_merchant_sit_interactive_1, scene_market_merchant_sit_interactive_2, scene_market_merchant_counter_interactive_1, scene_market_merchant_counter_interactive_2
dialogo_pescadero:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - sound{s=entity.villager.ambient;v=0.5;p=1} @self
  - particles{p=splash;a=10;hs=0.4;vs=0.3;y=2.2} @self
  - randomskill{s=dialogo_pescadero_frase1,dialogo_pescadero_frase2,dialogo_pescadero_frase3,dialogo_pescadero_frase4,dialogo_pescadero_frase5,dialogo_pescadero_frase6} @trigger

dialogo_pescadero_frase1:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.05} @self
  - speak{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <#3A9BDC>≈\n<#DFF4FF>Pescado fresco de esta mañana. Mira\n<#DFF4FF>esos ojos, brillan todavía.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <dark_gray>» <#DFF4FF>Pescado fresco de esta mañana. Mira esos ojos, brillan todavía."} @trigger

dialogo_pescadero_frase2:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.05} @self
  - speak{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <#3A9BDC>≈\n<#DFF4FF>El salmón se acaba rápido, si lo\n<#DFF4FF>quieres no lo pienses mucho.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <dark_gray>» <#DFF4FF>El salmón se acaba rápido, si lo quieres no lo pienses mucho."} @trigger

dialogo_pescadero_frase3:
  Skills:
  - sound{s=entity.villager.trade;v=0.8;p=1.05} @self
  - speak{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <#3A9BDC>≈\n<#DFF4FF>Mi primo lo saca del río y yo lo\n<#DFF4FF>vendo. Negocio de familia.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <dark_gray>» <#DFF4FF>Mi primo lo saca del río y yo lo vendo. Negocio de familia."} @trigger

dialogo_pescadero_frase4:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=1.05} @self
  - speak{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <#3A9BDC>≈\n<#DFF4FF>Con un poco de sal y fuego,\n<#DFF4FF>cualquier pez sabe a gloria.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <dark_gray>» <#DFF4FF>Con un poco de sal y fuego, cualquier pez sabe a gloria."} @trigger

dialogo_pescadero_frase5:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=1.05} @self
  - speak{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <#3A9BDC>≈\n<#DFF4FF>No te fíes del que vende pescado sin\n<#DFF4FF>olor, algo esconde.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <dark_gray>» <#DFF4FF>No te fíes del que vende pescado sin olor, algo esconde."} @trigger

dialogo_pescadero_frase6:
  Skills:
  - sound{s=entity.villager.yes;v=0.8;p=1.05} @self
  - speak{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <#3A9BDC>≈\n<#DFF4FF>Hoy el mar estuvo generoso. Ojalá\n<#DFF4FF>mañana también.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#3A9BDC>≈ <gradient:#8FD8FF:#3A9BDC>Pescadero</gradient> <dark_gray>» <#DFF4FF>Hoy el mar estuvo generoso. Ojalá mañana también."} @trigger

