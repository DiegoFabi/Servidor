scene_market_stand:
  Type: PIG
  Display: ''
  Health: 5
  Damage: 0
  AIGoalSelectors:
  - clear
  Options:
    PreventKnockback: true
    Despawn: persistent
    KnockbackResistance: 10
    Collidable: false
    MovementSpeed: 0
    Invincible: true
    Silent: true
    PreventLeashing: true
    AlwaysShowName: true
  Skills:
  - model{mid=command;s=1} @self ~onSpawn
  - model{mid=command;s=1;delay=5} @self ~onLoad
  - cancelevent{sync=true} @self ~onDamaged


scene_market_fisherman:
  Type: PIG
  Display: ''
  Health: 5
  Damage: 0
  AIGoalSelectors:
  - clear
  - lookatplayers{r=6}
  Options:
    PreventKnockback: true
    Despawn: persistent
    KnockbackResistance: 10
    Collidable: false
    MovementSpeed: 0
    Invincible: true
    Silent: true
    PreventLeashing: true
    AlwaysShowName: true
  Skills:
  - model{mid=scene_market_3;s=1} @self ~onSpawn
  - model{mid=scene_market_3;s=1;delay=5} @self ~onLoad
  - remapmodel{m=scene_market_3;n=<global.var.skin<caster.uuid>|scene_market_3>;delay=10} @self ~onLoad
  - changepart{m=scene_market_3;pid=right_item;nm=<global.var.rightitem<caster.uuid>>;npid=right_item} @self ~onLoad
  - changepart{m=scene_market_3;pid=left_item;nm=<global.var.leftitem<caster.uuid>>;npid=left_item} @self ~onLoad
  - changepart{m=scene_market_3;pid=backpack;nm=<global.var.backpack<caster.uuid>>;npid=backpack} @self ~onLoad
  - changepart{m=scene_market_3;pid=hat;nm=<global.var.hat<caster.uuid>>;npid=hat} @self ~onLoad
  - changepart{m=scene_market_3;pid=left_pant;nm=<global.var.leftpant<caster.uuid>>;npid=hat} @self ~onLoad
  - changepart{m=scene_market_3;pid=right_pant;nm=<global.var.rightpant<caster.uuid>>;npid=hat} @self ~onLoad
  - cancelevent{sync=true} @self ~onDamaged
  - skill{s=scene_openmenu} ~onInteract
  - skill{s=dialogo_pescadero} @trigger ~onInteract
  - defaultstate{t=idle;s=vendor_fish} @self ~onSpawn
  - defaultstate{t=idle;s=vendor_fish;delay=10} @self ~onLoad
  - state{s=vendor_fish;delay=20} @self ~onLoad
  - state{s=vendor_fish} @self ~onSpawn
  - setvariable{var=global.skinchange;value=scene_market_3;type=STRING;s=GLOBAL} @self ~onInteract

