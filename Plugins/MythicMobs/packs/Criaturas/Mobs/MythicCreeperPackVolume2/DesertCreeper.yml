MSO_Creeper_Desert:
  Type: CREEPER
  Display: '&eDesert Creeper'
  Health: 20
  Damage: 30
  Drops:
  - CACTUS 0-2 1
  Skills:
  - skill{s=Botin_Creeper_Desert} @trigger ~onDeath
  - skill:MSO_CreeperPrime @self ~onPrime
  # Spawn model
  - model{m=creeper_desert;n=false} @self ~onSpawn
  - potion{type=INVISIBILITY;delay=1;l=1;force=true} @Self ~onSpawn
  # Enchant the armor
  - enchant{m=creeper_desert;pid=armor;en=true;em=false} @self ~onSpawn
  # Hide the armor on spawn
  - partvisibility{m=creeper_desert;p=armor;v=false;em=false} @self ~onSpawn
  # Show the armor on charge
  - partvisibility{m=creeper_desert;p=armor;v=true;em=false} @self ~onCharged
  - skill:MSO_DesertCreeperShear @Self ~onInteract