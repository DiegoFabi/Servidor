MSO_Creeper_Mushroom:
  Type: CREEPER
  Display: '&cMushroom Creeper'
  Health: 20
  Damage: 30
  Drops:
  - GUNPOWDER 0-2 1
  Skills:
  - skill{s=Botin_Creeper_Mushroom} @trigger ~onDeath
  - skill:MSO_CreeperPrime @self ~onPrime
  # Spawn model
  - model{m=creeper_mushroom;n=false} @self ~onSpawn
  - potion{type=INVISIBILITY;delay=1;l=1;force=true} @Self ~onSpawn
  # Enchant the armor
  - enchant{m=creeper_mushroom;pid=armor;en=true;em=false} @self ~onSpawn
  # Hide the armor on spawn
  - partvisibility{m=creeper_mushroom;p=armor;v=false;em=false} @self ~onSpawn
  # Show the armor on charge
  - partvisibility{m=creeper_mushroom;p=armor;v=true;em=false} @self ~onCharged
  - potion{type=POISON;l=1;d=100;sync=true} @Self ~onExplode