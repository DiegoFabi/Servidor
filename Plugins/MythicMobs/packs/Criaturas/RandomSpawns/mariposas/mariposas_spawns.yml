# ============================================================
#  Mariposas (ScenesEnvironment, mob "butterfly") - survivalMain.
#  REPLACE: GenerateSpawnPoints está desactivado, así que sustituyen
#  a una pequeña parte de los animales pasivos que aparecen de día en
#  biomas vanilla templados (flores, bosques, llanuras, selvas...).
