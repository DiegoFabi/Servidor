# Probabilidades x1,5 (aumento moderado de mobs custom; máx. 0,6)
# ============================================================
#  UndeadPack - aparición por biomas
#  Mundo: survivalMain (moderado: probabilidades bajas y límite de
#  mobs iguales alrededor para no saturar ni afectar el rendimiento).
#  REPLACE solo sustituye mobs hostiles vanilla (nunca animales).
# ============================================================

RandomGhoul:
  Type: Ghoul
  Worlds: survivalMain
  Chance: 0.45
  Priority: 500
  Action: REPLACE
  UseWorldScaling: false
  Biomes: SNOWY_PLAINS,SNOWY_TAIGA,SNOWY_SLOPES,GROVE,FROZEN_PEAKS,ICE_SPIKES
  Conditions:
  - entitytype{t=ZOMBIE,STRAY,SKELETON} true
  - night true
  - outside true
  - inblock{b=WATER,LAVA} false
  - mobsinradius{t=Ghoul;a=<3;r=40} true

