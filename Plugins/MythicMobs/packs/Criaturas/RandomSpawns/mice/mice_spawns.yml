# Probabilidades x1,5 (aumento moderado de mobs custom; máx. 0,6)
# ============================================================
#  Ratones (Mice Pack) - survivalMain, aparición moderada.
#  REPLACE: con GenerateSpawnPoints desactivado (config-spawning) ADD no
#  genera nada, así que sustituyen a una pequeña parte de los spawns
#  naturales de la superficie (animales pequeños de día y monstruos
#  comunes de noche). Máximo 3 ratones en 48 bloques.
#  Despawn activado en el mob para que no se acumulen.
#  Cubren todos los biomas vanilla de superficie del Overworld
#  (cada color en su grupo de biomas).
# ============================================================
Raton_black_mouse:
  Type: black_mouse
  Worlds: survivalMain
  Chance: 0.105
  Priority: 100
  Action: REPLACE
  UseWorldScaling: false
  Biomes: DARK_FOREST,PALE_GARDEN,OLD_GROWTH_SPRUCE_TAIGA,OLD_GROWTH_PINE_TAIGA,TAIGA,SWAMP,MANGROVE_SWAMP
  Conditions:
  - entitytype{t=CHICKEN,RABBIT,FOX,PIG,COW,SHEEP,ZOMBIE,SKELETON,SPIDER} true
  - outside true
  - inblock{b=WATER,LAVA} false
  - mobsinradius{t=black_mouse,brown_mouse,gray_mouse,white_mouse;a=<3;r=48} true

