# ============================================================
#  Ratones (Mice Pack) - survivalMain, aparición moderada.
#  ADD: se añaden ocasionalmente junto a otros spawns naturales en la
#  superficie de praderas, bosques y taigas. Máximo 3 ratones en 48 bloques.
#  Despawn activado en el mob para que no se acumulen.
# ============================================================
Raton_black_mouse:
  Type: black_mouse
  Worlds: survivalMain
  Chance: 0.01
  Priority: 1
  Action: ADD
  UseWorldScaling: false
  Biomes: DARK_FOREST,OLD_GROWTH_SPRUCE_TAIGA,TAIGA
  Conditions:
  - outside true
  - inblock{b=WATER,LAVA} false
  - mobsinradius{t=black_mouse,brown_mouse,gray_mouse,white_mouse;a=<3;r=48} true

