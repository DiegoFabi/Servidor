# ============================================================
#  hologramas_pueblo.yml - Hologramas de los NPCs del pack ScenesTown
#  Armor stands invisibles tipo marcador (sin hitbox) que solo
#  muestran su nombre; se borran solos y no se guardan al reiniciar.
#  Cada rol tiene su paleta e icono propios.
#  Nombres:  holo_<rol>_nombre  |  holo_<rol>_f<frase>_l<linea>
#  Los usa: dialogos_pueblo.yml
# ============================================================

# ---------- ▣ Mozo (scene_townsfolk_handler, scene_townsfolk_handler_stock, scene_townsfolk_handler_provider) | paleta #EDCFA6 -> #B5835A ----------
holo_mozo_nombre:
  Type: ARMOR_STAND
  Display: '<#B5835A>▣ <gradient:#EDCFA6:#B5835A><bold>Mozo</bold></gradient> <#B5835A>▣'
  Health: 1
  Options:
    Invisible: true
    Marker: true
    HasGravity: false
    CanMove: false
    Collidable: false
    Invincible: true
    Silent: true
    AlwaysShowName: true
    Despawn: true
    Persistent: false
  Skills:
  - remove{delay=70} @self ~onSpawn


