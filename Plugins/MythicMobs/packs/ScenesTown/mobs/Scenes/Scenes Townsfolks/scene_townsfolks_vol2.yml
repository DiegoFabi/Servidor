scene_townsfolk_handler:
  Type: PIG
  Display: ''
  Health: 5
  Damage: 0
  AIGoalSelectors:
    - opendoors: true
    - lookAtTarget{r=20;h=true}
  Options:
    Despawn: persistent
    KnockbackResistance: 10
    Collidable: false
    MovementSpeed: 0.175
    Invincible: true
    Silent: true
    PreventLeashing: true
    AlwaysShowName: true
  Skills:
  - skill{s=dialogo_mozo} @trigger ~onInteract
  - model{mid=scene_townsfolk_handler;save=true} @self ~onSpawn
  - model{mid=scene_townsfolk_handler;save=true;delay=5} @self ~onLoad
  - remapmodel{m=scene_townsfolk_handler;n=<global.var.skin<caster.uuid>|scene_townsfolk_handler>;delay=10} @self ~onLoad
  - skill{s=scene_skin_azar} @self ~onSpawn
  - remapmodel{m=scene_townsfolk_handler;n=<global.var.skin<caster.uuid>|scene_townsfolk_handler>;delay=12} @self ~onSpawn
  - skill{s=scene_openmenu} ~onInteract
  - cancelevent{sync=true} @self ~onDamaged
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onLoad
  - cullconfig{vc=false;bkc=false;blc=false} @self ~onSpawn
  - setStance{stance=empty} @self ~onSpawn 
  - defaultstate{m=scene_townsfolk_handler;t=idle;s=idle_empty} @self ~onSpawn
  - defaultstate{m=scene_townsfolk_handler;t=walk;s=walk_empty} @self ~onSpawn
  - setspeed{speed=0.7} @self ~onTimer:5 ?stance{stance=full} 
  - setspeed{speed=0.9} @self ~onTimer:5 ?stance{stance=empty} 
  - skill{skill=gotodrop} @self ~onTimer:5
  - goto{speedModifier=0.7;sh=0;sv=0} @MobsNearOrigin{r=100;types=scene_townsfolk_handler_provider} ~onTimer:10 ?stance{stance=empty}
  - goto{speedModifier=0.9;sh=0;sv=0} @MobsNearOrigin{r=100;types=scene_townsfolk_handler_stock} ~onTimer:10 ?stance{stance=full}
  - skill{skill=leapdrop} @self ~onTimer:5
  - skill{skill=leapprovider} @self ~onTimer:5
  - matchrotation{target=@PIR{radius=50}} @self ~onInteract
  - skill{skill=gotoprovider} @self ~onTimer:5
  - skill{skill=stanceskin} ~onTimer:5
  - setvariable{var=global.skinchange;value=scene_townsfolk_handler;type=STRING;save=true} @self ~onInteract
  - setStance{stance=<global.var.skin<caster.uuid>>} @MobsNearOrigin{r=3;types=scene_townsfolk_handler_provider} ~onTimer:5
  - setStance{stance=<global.var.skin<caster.uuid>>} @MobsNearOrigin{r=3;types=scene_townsfolk_handler_stock} ~onTimer:5

    

