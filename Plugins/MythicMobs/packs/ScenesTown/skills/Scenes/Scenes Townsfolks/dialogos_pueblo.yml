  - settextdisplay{text="<#B5835A>▣ <gradient:#EDCFA6:#B5835A>Mozo</gradient> <#B5835A>▣<newline><#F9F1E6>Si me ayudas con esto te invito a<newline><#F9F1E6>algo. Es broma, no tengo un duro.";delay=1} @Passenger
