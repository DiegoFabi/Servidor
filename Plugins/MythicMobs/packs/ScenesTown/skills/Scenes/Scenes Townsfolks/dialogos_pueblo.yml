  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.0} @self
  - skill{s=scene_bocadillo_quitar} @Passenger
  - summonpassenger{type=scene_bocadillo} @self
  - settextdisplay{text="<#B5835A>▣ <gradient:#EDCFA6:#B5835A>Mozo</gradient> <#B5835A>▣<newline><#F9F1E6>Hoy llegaron más pedidos de lo<newline><#F9F1E6>normal.";delay=1} @Passenger
  - message{m="<#B5835A>▣ <gradient:#EDCFA6:#B5835A>Mozo</gradient> <dark_gray>» <#F9F1E6>Hoy llegaron más pedidos de lo normal."} @trigger

dialogo_mozo_frase4:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=1.0} @self
