# Variantes del mozo: cada una con su skin al azar, personalidad, sonidos y partículas.
dialogo_mozo_veterano:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - effect:particles{p=campfire_cosy_smoke;a=10;hs=0.4;vs=0.3;y=2.2;vd=24} @self
  - randomskill{s=dialogo_mozo_veterano_frase1,dialogo_mozo_veterano_frase2,dialogo_mozo_veterano_frase3,dialogo_mozo_veterano_frase4,dialogo_mozo_veterano_frase5} @trigger

dialogo_mozo_veterano_frase1:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=1.05} @self
  - speak{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient>\n<#F4EBDD>Treinta años cargando cajas. Mis\n<#F4EBDD>rodillas lo cuentan cada mañana.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient> <dark_gray>» <#F4EBDD>Treinta años cargando cajas. Mis rodillas lo cuentan cada mañana."} @trigger

dialogo_mozo_veterano_frase2:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.10} @self
  - speak{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient>\n<#F4EBDD>Antes había un barco al día.\n<#F4EBDD>Ahora uno por semana, si hay suerte.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient> <dark_gray>» <#F4EBDD>Antes había un barco al día. Ahora uno por semana, si hay suerte."} @trigger

dialogo_mozo_veterano_frase3:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=1.15} @self
  - speak{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient>\n<#F4EBDD>El truco es levantar con\n<#F4EBDD>las piernas, no con el orgullo.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient> <dark_gray>» <#F4EBDD>El truco es levantar con las piernas, no con el orgullo."} @trigger

dialogo_mozo_veterano_frase4:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.00} @self
  - speak{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient>\n<#F4EBDD>Una vez cargué una\n<#F4EBDD>caja que hablaba. No preguntes.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient> <dark_gray>» <#F4EBDD>Una vez cargué una caja que hablaba. No preguntes."} @trigger

dialogo_mozo_veterano_frase5:
  Skills:
  - sound{s=entity.villager.no;v=0.8;p=1.05} @self
  - speak{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient>\n<#F4EBDD>Los jóvenes corren mucho y\n<#F4EBDD>cargan poco. Así no se hace.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#8C6A43>⚓ <gradient:#E8D9C0:#8C6A43>Mozo Veterano</gradient> <dark_gray>» <#F4EBDD>Los jóvenes corren mucho y cargan poco. Así no se hace."} @trigger

