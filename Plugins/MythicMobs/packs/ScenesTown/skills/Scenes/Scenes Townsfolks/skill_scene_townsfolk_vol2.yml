stanceskin:
  Conditions:
  - (mobsInRadius{types=scene_townsfolk_handler_provider;amount=1;radius=5} true || mobsInRadius{types=scene_townsfolk_handler_stock;amount=1;radius=5} true)
  Skills:
  - setStance{stance=skin_<global.var.stanceskin<caster.uuid>>} @MobsNearOrigin{r=5;types=scene_townsfolk_handler_stock}
  - setStance{stance=skin_<global.var.stanceskin<caster.uuid>>} @MobsNearOrigin{r=5;types=scene_townsfolk_handler_provider}

gotoprovider:
  cooldown: 10
  Conditions:
  - stance empty
  - mobsInRadius{types=scene_townsfolk_handler_provider;amount=1;radius=1} true
  Skills:
  - state{m=scene_townsfolk_handler_provider;s=provide;li=0;lo=0;delay=1} @MobsNearOrigin{r=20;types=scene_townsfolk_handler_provider}
  - setAI{ai=false;delay=1} @self
  - lockmodel{l=true;delay=1} @self
  - state{m=scene_townsfolk_handler;s=grab;li=0;lo=0;sp=0.8}
  - delay 90
  - state{m=scene_townsfolk_handler;s=grab;li=3;lo=0;sp=0.8;r=true;delay=10}
  - setAI{ai=true} @self
  - matchrotation{target=@MobsNearOrigin{r=4;types=scene_townsfolk_handler_provider};delay=2} @self
  - lockmodel{l=false} @self
  - setStance{stance=full} @self
  - defaultstate{m=scene_townsfolk_handler;t=walk;s=walk;li=0;lo=0} @self
  - defaultstate{m=scene_townsfolk_handler;t=idle;s=idle;li=0;lo=0} @self

gotodrop:
  cooldown: 10
  Conditions:
  - stance full
  - mobsInRadius{types=scene_townsfolk_handler_stock;amount=1;radius=1} true
  Skills:
  - state{m=scene_townsfolk_handler_stock;s=grab;li=0;lo=0} @MobsNearOrigin{r=20;types=scene_townsfolk_handler_stock}
  - setAI{ai=false;delay=10} @self
  - lockmodel{l=true;delay=10} @self
  - state{m=scene_townsfolk_handler;s=putdown;li=0;lo=0;sp=0.8}
  - delay 84
  - state{m=scene_townsfolk_handler;s=putdown;li=3;lo=0;sp=0.8;r=true;delay=7}
  - setAI{ai=true} @self
  - matchrotation{target=@MobsNearOrigin{r=4;types=scene_townsfolk_handler_provider};delay=2} @self
  - lockmodel{l=false} @self
  - setStance{stance=empty} @self
  - defaultstate{m=scene_townsfolk_handler;t=walk;s=walk_empty;li=0;lo=0} @self
  - defaultstate{m=scene_townsfolk_handler;t=idle;s=idle_empty;li=0;lo=0} @self

leapdrop:
  cooldown: 4
  Conditions:
  - stance full
  - mobsInRadius{types=scene_townsfolk_handler_stock;amount=1;radius=5} true
  Skills:
  - leap{velocity=90} @MobsNearOrigin{r=3;types=scene_townsfolk_handler_stock}  
leapprovider:
