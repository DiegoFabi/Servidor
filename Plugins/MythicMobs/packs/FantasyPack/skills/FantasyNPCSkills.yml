FantasyNPC_DMG:
  Conditions:
  - faction{faction=NPC} false
  Skills:
  - damage{a=5;hnp=true;hp=true;pi=true} @LivingNearTargetLocation{r=4}
  - throw{velocity=4;velocityY=4} @LivingNearTargetLocation{r=4}

FantasyNPC_NagaInteract:
  Conditions:
  - (stance interacting true || stance quirk true) castinstead FantasyNPC_NagaInteract_NO_ANIM
  Skills:
  - state{s=interact;li=3;lo=3} @Self
  - setstance{stance=interacting} @Self
  - message{m="<green>This is a configurable message sent to your players! Thanks for using Crescent Studios :)"}
  - delay 50
  - setstance{stance=idling} @Self

