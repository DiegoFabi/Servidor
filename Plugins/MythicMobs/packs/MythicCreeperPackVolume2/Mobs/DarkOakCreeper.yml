MSO_Creeper_DarkOak:
  Type: CREEPER
  Display: '&5Dark Oak Creeper'
  Health: 20
  Damage: 30
  Drops:
  - COBWEB 0-1 1
  - DARK_OAK_LOG 0-2 1
  Skills:
  - skill:MSO_CreeperPrime @self ~onPrime
  # Spawn model
  - model{m=creeper_dark_oak;n=false} @self ~onSpawn
  - potion{type=INVISIBILITY;delay=1;l=1;force=true} @Self ~onSpawn
  # Enchant the armor
  - enchant{m=creeper_dark_oak;pid=armor;en=true;em=false} @self ~onSpawn
  # Hide the armor on spawn
  - partvisibility{m=creeper_dark_oak;p=armor;v=false;em=false} @self ~onSpawn
  # Show the armor on charge
  - partvisibility{m=creeper_dark_oak;p=armor;v=true;em=false} @self ~onCharged
