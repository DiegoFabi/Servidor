MSO_Creeper_Snowy:
  Type: CREEPER
  Display: '&fSnowy Creeper'
  Health: 20
  Damage: 30
  AITargetSelectors:
  - clear
  - players
  - nearestConditionalTarget{conditions=[
      - entitytype STRAY true
    ]}

  Skills:
  - skill{s=Botin_Creeper_Snowy} @trigger ~onDeath
  - skill:MSO_CreeperPrime @self ~onPrime
  # Spawn model
  - model{m=creeper_snowy;n=false} @self ~onSpawn
  - potion{type=INVISIBILITY;delay=1;l=1;force=true} @Self ~onSpawn
  # Enchant the armor
  - enchant{m=creeper_snowy;pid=armor;en=true;em=false} @self ~onSpawn
  # Hide the armor on spawn
  - partvisibility{m=creeper_snowy;p=armor;v=false;em=false} @self ~onSpawn
  # Show the armor on charge
  - partvisibility{m=creeper_snowy;p=armor;v=true;em=false} @self ~onCharged
