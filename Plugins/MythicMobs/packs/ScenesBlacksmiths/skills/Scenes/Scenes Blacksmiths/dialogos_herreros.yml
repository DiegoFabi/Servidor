# Diálogos de los herreros (clic derecho, sin agacharse). Bocadillos que siguen al NPC.
dialogo_herrero:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - effect:particles{p=small_flame;a=10;hs=0.4;vs=0.3;y=2.2;vd=24} @self
  - randomskill{s=dialogo_herrero_frase1,dialogo_herrero_frase2,dialogo_herrero_frase3,dialogo_herrero_frase4,dialogo_herrero_frase5,dialogo_herrero_frase6,dialogo_herrero_frase7,dialogo_herrero_frase8} @trigger

dialogo_herrero_frase1:
  Skills:
  - sound{s=block.anvil.place;v=0.8;p=1.05} @self
  - speak{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient>\n<#F5E6D6>El buen acero no\n<#F5E6D6>se apresura. Se escucha.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient> <dark_gray>» <#F5E6D6>El buen acero no se apresura. Se escucha."} @trigger

dialogo_herrero_frase2:
  Skills:
  - sound{s=entity.villager.work_toolsmith;v=0.8;p=1.10} @self
  - speak{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient>\n<#F5E6D6>¿Ves esa chispa? Esa es la que\n<#F5E6D6>decide si una espada vive o se rompe.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient> <dark_gray>» <#F5E6D6>¿Ves esa chispa? Esa es la que decide si una espada vive o se rompe."} @trigger

dialogo_herrero_frase3:
  Skills:
  - sound{s=entity.villager.ambient;v=0.8;p=1.15} @self
  - speak{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient>\n<#F5E6D6>Mi abuelo forjó espadas para el Imperio.\n<#F5E6D6>Yo forjo herraduras. Así va el mundo.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient> <dark_gray>» <#F5E6D6>Mi abuelo forjó espadas para el Imperio. Yo forjo herraduras. Así va el mundo."} @trigger

dialogo_herrero_frase4:
  Skills:
  - sound{s=block.anvil.use;v=0.8;p=1.00} @self
  - speak{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient>\n<#F5E6D6>Si traes hierro, te enseño a templarlo.\n<#F5E6D6>Si traes prisa, mejor vuelve otro día.";o=0.4;r=12;d=80;sendchatmessage=false;ll=40} @self
  - message{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient> <dark_gray>» <#F5E6D6>Si traes hierro, te enseño a templarlo. Si traes prisa, mejor vuelve otro día."} @trigger

