# Diálogos de los herreros (clic derecho, sin agacharse). Bocadillos que siguen al NPC.
dialogo_herrero:
  Conditions:
  - variableisset{var=caster.dialogo_cd} false
  TargetConditions:
  - crouching false
  Skills:
  - setvariable{var=caster.dialogo_cd;type=INTEGER;value=1;duration=100} @self
  - effect:particles{p=small_flame;a=10;hs=0.4;vs=0.3;y=2.2;vd=24} @self
  - randomskill{s=dialogo_herrero_frase1,dialogo_herrero_frase2,dialogo_herrero_frase3,dialogo_herrero_frase4,dialogo_herrero_frase5,dialogo_herrero_frase6,dialogo_herrero_frase7,dialogo_herrero_frase8} @trigger

dialogo_herrero_frase1:
  Skills:
  - sound{s=block.anvil.place;v=0.8;p=1.05} @self
  - skill{s=scene_bocadillo_quitar} @Passenger
  - summonpassenger{type=scene_bocadillo} @self
  - settextdisplay{text="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient><newline><#F5E6D6>El buen acero no<newline><#F5E6D6>se apresura. Se escucha.";delay=1} @Passenger
  - message{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient> <dark_gray>» <#F5E6D6>El buen acero no se apresura. Se escucha."} @trigger

