  - message{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient> <dark_gray>» <#F5E6D6>Mi abuelo forjó espadas para el Imperio. Yo forjo herraduras. Así va el mundo."} @trigger

