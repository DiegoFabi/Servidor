  - settextdisplay{text="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient><newline><#F5E6D6>¿Ves esa chispa? Esa es la que<newline><#F5E6D6>decide si una espada vive o se rompe.";delay=1} @Passenger
  - message{m="<#C46A2A>⚒ <gradient:#FFCF9E:#C46A2A>Herrero</gradient> <dark_gray>» <#F5E6D6>¿Ves esa chispa? Esa es la que decide si una espada vive o se rompe."} @trigger

