# ============================================================
#  Enderman Expansion - una variante por bioma
#  REPLACE: sustituye a los endermen vanilla que aparecen en cada bioma
#  (ADD no funciona con GenerateSpawnPoints desactivado en config-spawning).
# ============================================================

enderman_desert:
  Type: enderman_desert
  Worlds: survivalMain
  Chance: 0.5
  Priority: 100
  Action: REPLACE
  UseWorldScaling: false
  Biomes: DESERT
  Conditions:
  - entitytype{t=ENDERMAN} true
  - mobsinradius{t=enderman_desert;a=<3;r=100} true
  - outside true

