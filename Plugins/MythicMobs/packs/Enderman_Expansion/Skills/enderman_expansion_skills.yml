### ENDERMAN GENERIC

generic_enderman_pickup_block_PRE:
  TargetConditions:
  - stance notholdingblock true
  Skills:
  - skill{s=generic_enderman_pickup_block_PRE_3} @ObstructingBlock

generic_enderman_pickup_block_PRE_3:
  TargetConditions:
  - (triggerblocktype{type=BEDROCK} || triggerblocktype{type=AIR} || triggerblocktype{type=CHEST}) cancel
  Skills:
  - skill{s=generic_enderman_pickup_block_PRE_2} @self

generic_enderman_pickup_block_PRE_2:
  TargetConditions:
  - stance notholdingblock true
  Skills:
  - setVariable{var=caster.pickup_block;type=STRING;value=<target.block.type>} @ObstructingBlock
  - skill{s=generic_enderman_pickup_block} @self
  - skill{s=generic_enderman_pickup_block_remove} @self

generic_enderman_pickup_block:
  Skills:
  - meg:setitemmodel{mid=<target.var.enderman_name>;bone=mainhand;i=<target.var.pickup_block>} @self
  ##- message{m=<caster.var.pickup_block>} @world
  - state{mid=<target.var.enderman_name>;s=pickup_on;r=false} @self
  - delay 3
  - state{mid=<target.var.enderman_name>;s=pickup_on;r=true} @self
  - state{mid=<target.var.enderman_name>;s=pickup;r=false} @self
generic_enderman_pickup_block_remove:
  Cooldown: 1
  TargetConditions:
  - (blocktype{type=BEDROCK} || blocktype{type=AIR} || blocktype{type=CHEST} || blocktype{type=CHEST}) cancel
  - nearclaim{r=3} false
  TargetConditions:
  - stance notholdingblock true
  Skills:
  - setblock{m=AIR} @ObstructingBlock
  - setstance{s=holdingblock} @self



generic_enderman_placeblock_PRE_BLOCK_2:
  Cooldown: 35
  Skills:
  - skill{s=generic_enderman_placeblock_PRE_BLOCK} @forward{f=2;y=0}

generic_enderman_placeblock_PRE_BLOCK:
  TargetConditions:
  - blocktype{type=AIR} true
  Skills:
  - skill{s=generic_enderman_placeblock_PRE} @self

generic_enderman_placeblock_PRE:
  TargetConditions:
  - vareq{var=target.pickup_block;value="air"} cancel
  Skills:
  - state{mid=<target.var.enderman_name>;s=pickup;r=true} @self
  - state{mid=<target.var.enderman_name>;s=pickup_off;r=false} @self
  - delay 3
  - state{mid=<target.var.enderman_name>;s=pickup_off;r=true} @self
  - setblock{m=<caster.var.pickup_block>} @forward{f=1;y=0}
  ##- message{m=<caster.var.pickup_block> Place} @PIR{r=20}
  - delay 3
  - setstance{s=notholdingblock} @self
  - meg:setitemmodel{mid=<target.var.enderman_name>;bone=mainhand;i=air} @self
  - setVariable{var=caster.pickup_block;type=STRING;value=air} @self


generic_enderman_angry_PRE:
  Conditions:
  - incombat orElseCast generic_enderman_angry_OFF
  Skills:
  - defaultstate{mid=<target.var.enderman_name>;type=walk;state=run} @self
  - state{mid=<target.var.enderman_name>;s=angry;r=false} @self
  - delay 2
  ##- message{m="I'm in combat"} @PIR{r=20}
  - delay 25
  - skill{s=generic_enderman_angry_OFF} @self

generic_enderman_angry_OFF:
  Conditions:
  - incombat cancel
  Skills:
  - defaultstate{mid=<target.var.enderman_name>;type=walk;state=walk} @self
  - state{mid=<target.var.enderman_name>;s=angry;r=true} @self
  - delay 2
  ##- message{m="I left the combat"} @PIR{r=20}


generic_enderman_passive_damage_PRE:
  Skills:
  - effect:particles{particle=portal;amount=20;y=1.3;hS=0.3;vS=0.4;speed=0.15} @self
  - delay 7
  - sound{s=entity.enderman.teleport;v=0.23;p=1.4} @self
  - skill{s=generic_enderman_passive_damage_rtp} @self
  - delay 3
  - effect:particles{particle=portal;amount=20;y=1.3;hS=0.3;vS=0.4;speed=0.15} @self

