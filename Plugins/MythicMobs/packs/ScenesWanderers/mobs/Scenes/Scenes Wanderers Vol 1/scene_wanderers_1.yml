scene_wanderer_backpack:
  Type: PIG
  Display: ''
  Health: 5
  Damage: 0
  AIGoalSelectors:
  - clear
  - lookAtPlayer{range=5}
  Options:
    Despawn: persistent
    KnockbackResistance: 10
    Collidable: false
    MovementSpeed: 0.12
    Invincible: true
    Silent: true
    PreventLeashing: true
    AlwaysShowName: true
  Skills:
  - skill{s=dialogo_viajero} @trigger ~onInteract
  - remove @self ~onLoad
  - model{mid=scene_wanderers_1_vol1;save=true} @self ~onSpawn
  - model{mid=scene_wanderers_1_vol1;save=true;delay=5} @self ~onLoad
  - defaultstate{t=walk;s=walk} @self ~onSpawn
  - defaultstate{t=walk;s=walk;delay=10} @self ~onLoad
  - defaultstate{t=idle;s=idle} @self ~onSpawn
  - defaultstate{t=idle;s=idle;delay=10} @self ~onLoad
  - changepart{m=scene_wanderers_1_vol1;pid=hat;nm=straw_hat;npid=hat;delay=10;chance=0.2} @self ~onSpawn
  - skill{skill=scenes_traveler_day} @self ~onTimer:100 ?day
  - skill{skill=scenes_traveler_night} @self ~onTimer:100 ?night
  - blockMask{material=LIGHT;radius=0;duration=25;onlyair=true} @modelpart{p=lantern2} ~onTimer:1 ?night
  - skill{s=scene_openmenu} ~onInteract
  - cancelevent{sync=true} @self ~onDamaged
  - setvariable{var=global.skinchange;value=scene_wanderers_1_vol1;type=STRING;save=true} @self ~onInteract
  - light{m=scene_wanderers_1_vol1;p=lantern;block=15} @self ~onSpawn
  - light{m=scene_wanderers_1_vol1;p=lantern;block=15} @self ~onLoad
  - light{m=scene_wanderers_1_vol1;p=lantern2;block=15} @self ~onSpawn
  - light{m=scene_wanderers_1_vol1;p=lantern2;block=15} @self ~onLoad
  - lockhead{lp=true} @self ~onSpawn 
  - lockhead{lp=true} @self ~onTimer:200
  - teleport{spreadh=1;spreadv=0} @self ~onTimer:10 ?mobsinradius{radius=0.3;amount=>0;types=scene_guard_walk_test}
  # Skins:
  - randomskill{skills=wanderer1,wanderer2,wanderer3,wanderer4,wanderer5,wanderer6,wanderer7,wanderer8,wanderer9,wanderer10,wanderer11,wanderer12,wanderer13,wanderer14,wanderer15,wanderer16,wanderer17,wanderer18,wanderer19,wanderer20,wanderer21;delay=2} @self ~onSpawn
  #STANCES:
  - setStance{stance=path<global.var.scenes_path<caster.uuid>>;delay=50} @self ~onLoad
  - setStance{stance=path<global.var.scenes_path<caster.uuid>>_load;delay=5} @self ~onLoad
  - setStance{stance=stand} @self ~onSpawn
  #PATHS:
  #path1
  - skill{skill=path_1_follow} @self ~onTimer:100 ?stance{stance=path1}
  - teleportto{location=80.0,68.0,230.0;delay=20} @self ~onTimer:20 ?stance{stance=path1_load}
  #path2
  - skill{skill=path_2_follow} @self ~onTimer:100 ?stance{stance=path2}
  - teleportto{location=-39.0,68.0,211.0;delay=20} @self ~onTimer:20 ?stance{stance=path2_load}

