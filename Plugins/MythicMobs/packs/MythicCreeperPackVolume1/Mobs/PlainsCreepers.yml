MSO_Creeper_Plains:
  Type: CREEPER
  Display: 'Plains Creeper'
  Damage: 30
  Health: 20
  AIGoalSelectors:
  - clear
  - creeperswell
  Drops:
  - GUNPOWDER 0-2 1 
  - SEEDS 0-2 1
  Skills:
  - model{mid=creeper_plains;n=false} @Self ~onSpawn
  - potion{type=INVISIBILITY;delay=1;l=1;force=true} @Self ~onSpawn
  - skill:MSO_CreeperPrime @self ~onPrime
  # Enchant the armor
  - enchant{m=creeper_plains;pid=armor;en=true;em=false} @self ~onSpawn
  # Hide the armor on spawn
  - partvisibility{m=creeper_plains;p=armor;v=false;em=false} @self ~onSpawn
  # Show the armor on charge
  - partvisibility{m=creeper_plains;p=armor;v=true;em=false} @self ~onCharged
  
