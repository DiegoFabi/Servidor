MSO_Creeper_Hills:
  Type: CREEPER
  Display: '&7Hills Creeper'
  Health: 25
  Damage: 30
  Drops:
  - GUNPOWDER 0-2 1
  Skills:
  - model{mid=creeper_hills;n=false} @Self ~onSpawn
  - potion{type=INVISIBILITY;delay=1;l=1;force=true} @Self ~onSpawn
  - skill:MSO_CreeperPrime @self ~onPrime
  # Enchant the armor
  - enchant{m=creeper_hills;pid=armor;en=true;em=false} @self ~onSpawn
  # Hide the armor on spawn
  - partvisibility{m=creeper_hills;p=armor;v=false;em=false} @self ~onSpawn
  # Show the armor on charge
  - partvisibility{m=creeper_hills;p=armor;v=true;em=false} @self ~onCharged

