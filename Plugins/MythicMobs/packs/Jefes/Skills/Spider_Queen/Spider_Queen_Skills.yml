CancelDamageEvent:
  Skills:
  - CancelEvent
  
  
  # Queen death
  
S_Queen_Death:
  Skills:
  - skill{s=SQ_Dying} @Self
  
  - delay 35
  - sound{s=entity.player.small_fall;p=0.8;v=2} @self
  
  - velocity{m=set;x=0;y=0.3;z=0} @EIR{r=6;ignore=samefaction}
  
  - effect:particlering{particle=block_crack;material=dirt;points=20;amount=8;radius=3;hs=0.2;vs=1.0;y=0.1} @Origin
  - delay 2
  - effect:particlering{particle=block_crack;material=dirt;points=40;amount=6;radius=3;hs=1;vs=0.5;y=0.1} @Origin
  
  
  
  
  
   # Run or Walk
  
S_Queen_Run:
  Conditions:
  - incombat true
  - targetwithin 5 false
  Skills:
  - DefaultState{t=WALK;s=run;li=0;lo=0} @Self
  - setspeed{speed=2;type=walking} @Self
  - setstance{stance=free_state} @self
  
S_Queen_Walk:
  Conditions:
  - targetwithin 5 true
  Skills:
  - DefaultState{t=WALK;s=walk;li=0;lo=0} @Self
  - setspeed{speed=1.4;type=walking} @Self
  - setstance{stance=free_state} @self

  
 # Random Attack
  
  
