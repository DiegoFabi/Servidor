  - recoil{r=1;p=-2.2to-1.2;y=-0.25to0.25}

hv_monolith_shake_area_light:
  Skills:
  - recoil{r=0.65;p=-1.5to1.5;y=-0.2to0.2;repeat=2;repeatInterval=2}

hv_monolith_shake_area_medium:
