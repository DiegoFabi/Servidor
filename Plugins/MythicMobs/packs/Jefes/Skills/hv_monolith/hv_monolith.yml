# -- Spawn & Death -- #

hv_monolith_spawn:
  Skills:
  - setcollidable{c=false} @self
  - partvis{mid=hv_monolith;p=aura_vfx;v=false;child=true;delay=1} @self
  - partvis{mid=hv_monolith;p=aura_vfx2;v=false;child=true;delay=1} @self
  - partvis{mid=hv_monolith;p=lines_vfx;v=false;child=true;delay=1} @self
  - defaultstate{t=idle;s=not_active} @self
  - setspeed{speed=0;delay=1} @self
  - setai{ai=false;delay=1} @self
  - gcd{ticks=20} @self
  - state{s=not_active;delay=1} @self
  - lockmodel{l=true;delay=1} @self
  - cullconfig{vc=false;bkc=false;blc=false;alod=CULLED} @self
  - BodyClamp{mh=0;rde=0;rdu=0;playermode=true} @self
  - skill{s=hv_monolith_partvis_all_false} @self
  - sound{s=block.tuff_bricks.place;v=4;p=0.55} @self
  - sound{s=block.heavy_core.place;v=4;p=0.7} @self
  - effect:particles{p=dust_plume;amount=10;speed=0.03;hS=1.2;vS=0.25;y=0.2} @self

hv_monolith_death:
  Skills:
  - sound{s=block.respawn_anchor.deplete;v=5;p=0.5} @self
  - sound{s=block.beacon.deactivate;v=5;p=0.55} @self
  - effect:particles{p=electric_spark;amount=18;speed=0.1;hS=1.4;vS=2.4;y=1.2} @self
  - effect:particles{p=white_ash;amount=12;speed=0.02;hS=1.2;vS=1.8;y=1.2} @self
  - partvis{mid=hv_monolith;p=aura_vfx2;v=false;child=true;delay=1} @self
  - partvis{mid=hv_monolith;p=aura_vfx;v=false;child=true;delay=99} @self
  - partvis{mid=hv_monolith;p=lines_vfx;v=false;child=true;delay=99} @self
  - skill{s=hv_monolith_partvis_all_true;delay=20}
  - skill{s=hv_monolith_partvis_all_false;delay=30}
  - sound{s=entity.iron_golem.death;v=5;p=0.6;delay=20} @self
  - sound{s=block.tuff_bricks.break;v=5;p=0.55;delay=27} @self
  - effect:particles{p=dust_plume;amount=20;speed=0.08;hS=1.8;vS=1.4;y=1;delay=27} @self
  - effect:particles{p=poof;amount=12;speed=0.12;hS=1.6;vS=1.2;y=1;delay=27} @self
  - sound{s=block.trial_spawner.break;v=5;p=0.55;delay=98} @self
  - sound{s=block.tuff_bricks.break;v=5;p=0.4;delay=98} @self
  - skill{s=hv_monolith_shake_area_heavy;delay=98} @PlayersInRadius{r=40}
  - effect:particles{p=dust_plume;amount=35;speed=0.15;hS=2.2;vS=2.2;y=1.2;delay=98} @self
  - effect:particles{p=electric_spark;amount=28;speed=0.18;hS=2;vS=2.5;y=1.4;delay=98} @self

hv_monolith_activate:
  Cooldown: 10
  Conditions:
  - targetwithin{d=16} true
  - hastag{t=hv_monolith_active} false
  Skills:
  - gcd{ticks=30} @self
  - setspeed{s=0} @self
  - state{s=aura} @self
  - state{s=active} @self
  - sound{s=block.trial_spawner.detect_player;v=5;p=0.65} @self
  - sound{s=block.tuff_bricks.place;v=4;p=0.5} @self
  - effect:particles{p=reverse_portal;amount=14;speed=0.06;hS=1.1;vS=1.8;y=1.2} @self
  - lockmodel{l=false} @self
  - setai{ai=true} @self
  - defaultstate{t=idle;s=idle} @self
  - addtag{t=hv_monolith_active} @self
  - partvis{mid=hv_monolith;p=aura_vfx;v=true;child=true;delay=15} @self
  - partvis{mid=hv_monolith;p=aura_vfx2;v=true;child=true;delay=15} @self
  - partvis{mid=hv_monolith;p=lines_vfx;v=true;child=true;delay=15} @self
  - sound{s=block.beacon.activate;v=5;p=0.65;delay=15} @self
  - sound{s=block.amethyst_block.resonate;v=4;p=0.65;delay=15} @self
  - skill{s=hv_monolith_shake_area_light;delay=15} @PlayersInRadius{r=24}
  - effect:particles{p=flash;amount=1;y=2;delay=15} @self
  - effect:particles{p=electric_spark;amount=26;speed=0.12;hS=1.4;vS=2.4;y=1.2;delay=15} @self
  - effect:particles{p=soul_fire_flame;amount=12;speed=0.05;hS=1.1;vS=1.9;y=1;delay=15} @self
  - sound{s=block.heavy_core.place;v=4;p=0.55;delay=26} @self
  - effect:particles{p=dust_plume;amount=12;speed=0.08;hS=1.3;vS=0.35;y=0.2;delay=26} @self
  - delay 30
  - aura{auraName=hv_monolith_cd;duration=200} @self
  - setspeed{s=1} @self
  - setcollidable{c=true} @self

# -- General -- #

hv_monolith_recoil_hit_light:
