

bl_illusionist:
  Type: HUSK
  Display: 'Illusionist'
  Faction: bl_illusionist
  Health: 220
  Damage: 0
  DamageModifiers:
  - SUFFOCATION 0
  - FALL 0
  - PROJECTILE 0.25
  - FIRE -0.1
  - FIRE_TICK -0.1
  - FREEZE -0.1
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  - lookatplayers
  AITargetSelectors:
  - clear
  - attacker
  - players
  Modules:
    ThreatTable: true
  Options:
    # 1 = 4x la velocidad normal (setspeed es multiplicador sobre este valor)
    MovementSpeed: 0.28
    FollowRange: 32
    KnockbackResistance: 1
    Silent: true
    Despawn: true
    Invincible: false
    PreventSunburn: true
    PreventBlockInfection: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventJockeyMounts: true
    Collidable: true
  BossBar:
    Enabled: true
    Title: ""
    Range: 50
    Color: RED
    Style: SOLID
  Skills:
  - model{mid=bl_illusionist;n=false;step=1;usm=true;save=true;d=true} @self ~onSpawn
  - model{mid=bl_illusionist;n=false;step=1;usm=true;save=true;d=true} @self ~onLoad
  - CancelEvent{sync=true} @self ~onAttack
  - skill{s=bl_illusionist_active} @target ~onTimer:20
  - skill{s=bl_illusionist_spawn} ~onSpawn
  - skill{s=bl_illusionist_death} @self ~onDeath
  - skill{s=bl_illusionist_regeneration} @self ~onDamaged
  - skill{s=bl_illusionist_skills} @target ~onTimer:20
  - skill{s=bl_illusionist_phase_cards} @target ~onTimer:15
  - skill{s=bl_illusionist_attack_cards} @target ~onTimer:20
  - skill{s=bl_illusionist_cards} @target ~onTimer:20


