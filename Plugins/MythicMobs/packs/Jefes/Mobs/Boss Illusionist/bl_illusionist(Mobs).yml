  - aura{auraName=bl_illusionist_attack2_totem;onTick=bl_illusionist_attack2_totem_tick;interval=1;duration=14;delay=1} @self ~onSpawn
  - state{mid=bl_illusionist_vfx_attack2;s=spawn} @self ~onSpawn
  - remove{delay=15} @self ~onSpawn


