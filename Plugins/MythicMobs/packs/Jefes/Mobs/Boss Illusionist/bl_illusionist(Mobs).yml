bl_illusionist_box:
  Type: ARMOR_STAND
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - model{mid=bl_illusionist_box;n=false;usm=true} @self ~onSpawn
  - aura{auraName=bl_illusionist_attack_box_totem;onTick=bl_illusionist_attack_box_totem_tick;interval=1;duration=4;delay=10} @self ~onSpawn
  - aura{auraName=bl_illusionist_attack_box_totem_2;onTick=bl_illusionist_attack_box_totem_tick;interval=1;duration=4;delay=38} @self ~onSpawn
  - aura{auraName=bl_illusionist_attack_box_totem_3;onTick=bl_illusionist_attack_box_totem_tick;interval=1;duration=4;delay=66} @self ~onSpawn
  - aura{auraName=bl_illusionist_attack_box_totem_4;onTick=bl_illusionist_attack_box_totem_tick;interval=1;duration=4;delay=94} @self ~onSpawn
