
hv_tenebris_spawner:
  Type: ARMOR_STAND
  Display: '&6Tenebris'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - skill{s=hv_tenebris_spawner_use} @self ~onTimer:20
  
hv_tenebris:
  Type: husk
  Display: '&6Tenebris'
  Health: 300
  Damage: 5
  DamageModifiers:
  - SUFFOCATION 0.1
  - PROJECTILE 0.25
  - FALL 0.1
  Faction: hv_tenebris
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: true
    PreventOtherDrops: true
    Silent: true
    FollowRange: 64
    PreventItemPickup: true
    PreventSunburn: true
    PreventRandomEquipment: true
    MovementSpeed: 0.2
    KnockbackResistance: 1
    Collidable: true
  BossBar:
    Enabled: true
    Title: ''
    Range: 64
    Color: PURPLE
    Style: SOLID
    CreateFog: false
    DarkenSky: false
  Skills:
  - model{mid=hv_tenebris;ride=true;drive=true;s=1;save=true} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - skill{s=hv_tenebris_phase2} @target ~onTimer:20
  - skill{s=hv_tenebris_staff_particle} @target ~onTimer:10
  - skill{s=hv_tenebris_spawn} @self ~onSpawn
  - skill{s=hv_tenebris_death} @self ~onDeath
  - randomskill{s=hv_tenebris_phase1_skills,hv_tenebris_phase2_skills} @target ~onTimer:15
  
