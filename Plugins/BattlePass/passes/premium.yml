name: 'Premium'
default-points-required: 100
required-permission: 'battlepass.premium'
items:
  doesnt-have-pass-item: # The item if a player does not have the premium pass.
    material: 'gold_nugget'
    customModelData: 7008
    #customModelData: 0 #Set custom model data
    name: '&eNivel %tier%'
    lore:
      - ''
      - '&7Recompensas:'
      - '%lore_addon%'
      - ''
      - '&7Estado: &eNo disponible'
      - '&cCompra el pase de batalla para'
      - '&cpoder ganar recompensas premium.'
  locked-tier-item: # The item if the player has not yet reached the tier.
    material: 'gold_nugget'
    customModelData: 7008
    name: '&eNivel %tier%'
    lore:
      - ''
      - '&7Recompensas:'
      - '%lore_addon%'
      - ''
      - '&7Estado: &cBloqueado'
  unlocked-tier-item:
    material: 'gold_nugget'
    customModelData: 7003
    name: '&aNivel %tier%'
    lore:
      - ''
      - '&7Recompensas:'
      - '%lore_addon%'
      - ''
      - '&7Estado: &aDesbloqueado'
  claimed-tier-item:
    material: 'gold_nugget'
    customModelData: 7004
    name: '&aNivel %tier%'
    lore:
      - ''
      - '&7Recompensas:'
      - '%lore_addon%'
      - ''
      - '&7Estado: &aReclamado'
tier-up-actions:
  - '[message] {㌇ &7¡Alcanzaste el nivel &e%tier%&7!}'
tiers:
  '2': # The tier number
    rewards: ['1'] # The reward numbers to give to the player (see rewards.yml).
    required-points: 10 # The amount of points the player must get to advance to the tier.
  '3':
    rewards: ['2']
    required-points: 50
  '5':
    rewards: ['2', '4']
    required-points: 100
  '7':
    rewards: ['4']
    required-points: 150
  '10':
    rewards: ['1', '2', '3', '4']
    required-points: 500