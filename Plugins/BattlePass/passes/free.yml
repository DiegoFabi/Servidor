name: 'Gratis'
default-points-required: 100
dont-give-premium-free-rewards: false # This will mean that premium users will not receive free rewards
items:
  doesnt-have-pass-item: # This is ONLY shown/used if you have dont-give-premium-free-rewards: true. This is used to make it so premium users can only have premium rewards.
    material: 'gold_nugget'
    customModelData: 7007
    name: '&eNivel %tier%'
    lore:
      - ''
      - '&cSolo puedes reclamar recompensas premium'
  locked-tier-item:
    material: 'gold_nugget'
    customModelData: 7007
    name: '&eNivel %tier%'
    lore:
      - ''
      - '&7Recompensas:'
      - '%lore_addon%'
      - ''
      - '&7Estado: &cBloqueado'
  unlocked-tier-item:
    material: 'gold_nugget'
    customModelData: 7003
    name: '&aNivel %tier%'
    lore:
      - ''
      - '&7Recompensas:'
      - '%lore_addon%'
      - ''
      - '&7Estado: &aDesbloqueado'
  claimed-tier-item:
    material: 'gold_nugget'
    customModelData: 7004
    name: '&aNivel %tier%'
    lore:
      - ''
      - '&7Recompensas:'
      - '%lore_addon%'
      - ''
      - '&7Estado: &aReclamado'
tier-up-actions:
  - '[message] { &7¡Alcanzaste el nivel &e%tier%&7!}'
tiers:
  '2': # The tier number
    rewards: ['1'] # The reward numbers to give to the player (see rewards.yml).
    required-points: 120 # The amount of points the player must get to advance to the tier.
  '4':
    rewards: ['4', '2']
  '10':
    rewards: ['1', '2', '3', '4']
    required-points: 500
    locked-tier-item: # You can specify any of the items in the 'items' section above per tier. They're completely optional for each tier.
      material: 'barrier:0'
      name: '&eNivel %tier%'
      lore:
        - ''
        - '&7Recompensas:'
        - '%lore_addon%'
        - ''
        - '&7Estado: &cObjeto especial bloqueado'